mple":"Metaphysics inquires into the ultimate nature of reality.","exampleAz":"Metafizika reallığın ali mahiyyətini araşdırır."},{"id":1802,"day":121,"indexInDay":2,"word":"Ontology","phonetic":"/ɒnˈtɒl.ə.dʒi/","pos":"noun","az":"Ontologiya / Varlıq təlimi","definition":"Branch of metaphysics dealing with the nature of being","example":"Ontology investigates what entities fundamentally exist.","exampleAz":"Ontologiya fundamental olaraq hansı varlıqların mövcud olduğunu tədqiq edir."},{"id":1803,"day":121,"indexInDay":3,"word":"Dialectic","phonetic":"/ˌdaɪ.əˈlek.tɪk/","pos":"noun","az":"Dialektika / Fikirlərin ziddiyyətli inkişafı","definition":"Art of investigating or discussing the truth of opinions","example":"Hegelian dialectic reconciles thesis and antithesis into synthesis.","exampleAz":"Hegel dialektikası tezis və antitezi sintezdə uzlaşdırır."},{"id":1804,"day":121,"indexInDay":4,"word":"Axiom","phonetic":"/ˈæk.si.əm/","pos":"noun","az":"Aksioma / Sübuta ehtiyacı olmayan həqiqət","definition":"Statement or proposition regarded as self-evidently true","example":"Euclidean geometry builds from fundamental axioms.","exampleAz":"Evklid həndəsəsi təməl aksiomlar üzərində qurulur."},{"id":1805,"day":121,"indexInDay":5,"word":"Empiricism","phonetic":"/ɪmˈpɪr.ɪ.sɪ.zəm/","pos":"noun","az":"Empirizm / Təcrübəçilik","definition":"Theory that all knowledge is derived from sense-experience","example":"British empiricism emphasized observation over pure dogma.","exampleAz":"Britaniya empirizmi sırf doqmadan daha çox müşahidəni önə çəkirdi."},{"id":1806,"day":121,"indexInDay":6,"word":"Rationalism","phonetic":"/ˈræʃ.ən.əl.ɪ.zəm/","pos":"noun","az":"Rasionalizm / Ağıla əsaslanan fəlsəfə","definition":"Practice of basing opinions and actions on reason and knowledge","example":"Descartes championed rationalism as the key to certainty.","exampleAz":"Dekart qətilik və həqiqət açarı kimi rasionalizmi müdafiə edirdi."},{"id":1807,"day":121,"indexInDay":7,"word":"Paradox","phonetic":"/ˈpær.ə.dɒks/","pos":"noun","az":"Paradoks / Ziddiyyətli həqiqət","definition":"Seemingly absurd statement that when investigated may prove true","example":"The paradox of learning is that the more you know, the more you seek.","exampleAz":"Öyrənməyin paradoksu ondadır ki, nə qədər çox bilsən, bir o qədər axtarırsan."},{"id":1808,"day":121,"indexInDay":8,"word":"Existential","phonetic":"/ˌeɡ.zɪˈsten.ʃəl/","pos":"adj","az":"Ekzistensial / Varlıqla bağlı","definition":"Relating to human existence, freedom, and responsibility","example":"Existential literature explores human freedom and moral choices.","exampleAz":"Ekzistensial ədəbiyyat insan azadlığını və mənəvi seçimlərini araşdırır."},{"id":1809,"day":121,"indexInDay":9,"word":"Ethics","phonetic":"/ˈeθ.ɪks/","pos":"noun","az":"Etika / Əxlaq fəlsəfəsi","definition":"Moral principles that govern behavior and human relations","example":"Virtue ethics focuses on cultivating noble character traits.","exampleAz":"Fəzilət etikası alicənab xarakter əlamətlərinin tərbiyəsinə yönəlir."},{"id":1810,"day":121,"indexInDay":10,"word":"Determinism","phonetic":"/dɪˈtɜː.mɪ.nɪ.zəm/","pos":"noun","az":"Determinizm / Səbəbiyyət zərurəti","definition":"Doctrine that all events are determined by causes external to the will","example":"Philosophers debate determinism versus human free will.","exampleAz":"Fəlsəfəçilər determinizmlə azad insan iradəsi arasındakı münasibəti mübahisə edirlər."},{"id":1811,"day":121,"indexInDay":11,"word":"Utilitarianism","phonetic":"/ˌjuː.tɪ.lɪˈteə.ri.ə.nɪ.zəm/","pos":"noun","az":"Utilitarizm / Faydaçılıq","definition":"Doctrine that actions are right if they are useful for majority","example":"Utilitarianism measures ethical goodness by aggregate happiness.","exampleAz":"Utilitarizm əxlaqi yaxşılığı ümumi fayda və xoşbəxtliklə ölçür."},{"id":1812,"day":121,"indexInDay":12,"word":"Syllogism","phonetic":"/ˈsɪl.ə.dʒɪ.zəm/","pos":"noun","az":"Silogizm","definition":"Deductive reasoning scheme consisting of major and minor premise","example":"Formal syllogisms preserve truth from premises to conclusion.","exampleAz":"Formal silogizmlər ilkin şərtlərdən nəticəyədək həqiqəti qoruyur."},{"id":1813,"day":121,"indexInDay":13,"word":"Phenomenology","phonetic":"/fɪˌnɒm.ɪˈnɒl.ə.dʒi/","pos":"noun","az":"Fenomenologiya / Hadisəşünaslıq","definition":"Philosophical study of the structures of experience and consciousness","example":"Phenomenology examines conscious experience from the first person.","exampleAz":"Fenomenologiya şüurlu təcrübəni birinci şəxsin baxışından təhlil edir."},{"id":1814,"day":121,"indexInDay":14,"word":"Pragmatism","phonetic":"/ˈpræɡ.mə.tɪ.zəm/","pos":"noun","az":"Praqmatizm / Əməli fayda fəlsəfəsi","definition":"Approach assessing truth of meaning in terms of practical success","example":"American pragmatism evaluates beliefs by practical consequences.","exampleAz":"Amerika praqmatizmi inancları onların əməli nəticələrinə görə qiymətləndirir."},{"id":1815,"day":121,"indexInDay":15,"word":"Conundrum","phonetic":"/kəˈnʌn.drəm/","pos":"noun","az":"Müəmma / Başsındırıcı məsələ","definition":"Confusing and difficult problem or question","example":"The ethical conundrum tested the philosopher’s principles.","exampleAz":"Etik müəmma filosofun prinsiplərini ciddi sınağa çəkdi."}]},{"day":122,"level":"C1","theme":"Epistemology & Theory of Knowledge","themeAz":"Epistemologiya və İdrak Nəzəriyyəsi","wordCount":15,"words":[{"id":1816,"day":122,"indexInDay":1,"word":"Epistemology","phonetic":"/ɪˌpɪs.təˈmɒl.ə.dʒi/","pos":"noun","az":"Epistemologiya / İdrak nəzəriyyəsi","definition":"Theory of knowledge, especially with regard to methods, validity, scope","example":"Epistemology questions what distinguishes justified belief from opinion.","exampleAz":"Epistemologiya əsaslandırılmış inamı sadə fikirdən nəyin fərqləndirdiyini araşdırır."},{"id":1817,"day":122,"indexInDay":2,"word":"Cognition","phonetic":"/kɒɡˈnɪʃ.ən/","pos":"noun","az":"İdrak / Zehni qavrama","definition":"Mental action or process of acquiring knowledge and understanding","example":"Cognition involves perception, memory, judgment, and reasoning.","exampleAz":"İdrak qavrayış, yaddaş, mühakimə və məntiqi əhatə edir."},{"id":1818,"day":122,"indexInDay":3,"word":"Justification","phonetic":"/ˌdʒʌs.tɪ.fɪˈkeɪ.ʃən/","pos":"noun","az":"Əsaslandırma / Bəraət","definition":"Action of showing something to be right or reasonable","example":"Epistemic justification requires coherent empirical grounds.","exampleAz":"Biliyin əsaslandırılması məntiqli empirik əsaslar tələb edir."},{"id":1819,"day":122,"indexInDay":4,"word":"Heuristic","phonetic":"/hjuˈrɪs.tɪk/","pos":"noun","az":"Evristik qayda","definition":"Hands-on rule or shortcut enabling discovery or learning","example":"Spaced review serves as an indispensable mnemonic heuristic.","exampleAz":"Aralıqlı təkrar əvəzolunmaz bir yaddaş evristikasıdır."},{"id":1820,"day":122,"indexInDay":5,"word":"Hermeneutics","phonetic":"/ˌhɜː.məˈnjuː.tɪks/","pos":"noun","az":"Hermenevtika / Təfsir elmi","definition":"Branch of knowledge that deals with interpretation of literary texts","example":"Hermeneutics illuminates multi-layered classical poetry.","exampleAz":"Hermenevtika çoxqatlı klassik poeziyanı təfsir edir."},{"id":1821,"day":122,"indexInDay":6,"word":"Inference","phonetic":"/ˈɪn.fər.əns/","pos":"noun","az":"Məntiqi nəticə / Çıxarış","definition":"Conclusion reached on the basis of evidence and reasoning","example":"Draw sound inferences from contextual linguistic clues.","exampleAz":"Kontekstual dil ipuclarından möhkəm məntiqi nəticələr çıxarın."},{"id":1822,"day":122,"indexInDay":7,"word":"Perception","phonetic":"/pəˈsep.ʃən/","pos":"noun","az":"Qavrayış","definition":"Ability to perceive through the senses or mental grasp","example":"Sensory perception is filtered through cultural archetypes.","exampleAz":"Duyğu qavrayışı mədəni arxetiplərin süzgəcindən keçir."},{"id":1823,"day":122,"indexInDay":8,"word":"Fallibility","phonetic":"/ˌfæl.əˈbɪl.ə.ti/","pos":"noun","az":"Səhv etmə ehtimalı / Yanılabilənlik","definition":"Tendency to make mistakes or be wrong","example":"Acknowledging human fallibility is the start of true wisdom.","exampleAz":"İnsanın yanıla biləcəyini qəbul etmək həqiqi müdrikliyin başlanğıcıdır."},{"id":1824,"day":122,"indexInDay":9,"word":"Validity","phonetic":"/vəˈlɪd.ə.ti/","pos":"noun","az":"Elmi etibarlılıq / Həqiqilik","definition":"Quality of being logically or factually sound","example":"Rigorous peer analysis confirms the theoretical validity.","exampleAz":"Ciddi elmi təhlil nəzəri etibarlılığı təsdiqləyir."},{"id":1825,"day":122,"indexInDay":10,"word":"Discourse","phonetic":"/ˈdɪs.kɔːs/","pos":"noun","az":"Akademik diskurs / Təhlil mətni","definition":"Written or spoken debate or academic conversation","example":"Philosophical discourse clarifies foundational terminology.","exampleAz":"Fəlsəfi diskurs təməl terminologiyanı aydınlaşdırır."},{"id":1826,"day":122,"indexInDay":11,"word":"Intuition","phonetic":"/ˌɪn.tʃuːˈɪʃ.ən/","pos":"noun","az":"İntuisiya / Daxili duyum","definition":"Direct perception of truth independent of any reasoning process","example":"Cultivated linguistic intuition guides natural phrasing.","exampleAz":"Təcrübə ilə cilalanmış dil intuisiyası təbii cümlə quruluşuna bələdçilik edir."},{"id":1827,"day":122,"indexInDay":12,"word":"Postulate","phonetic":"/ˈpɒs.tʃə.leɪt/","pos":"verb","az":"Müddəa kimi irəli sürmək","definition":"Suggest or assume the existence or truth of as a basis for reasoning","example":"The theoretical physicist postulated multidimensional membranes.","exampleAz":"Nəzəri fizikaçı çoxölçülü membranların mövcudluğunu müddəa kimi irəli sürdü."},{"id":1828,"day":122,"indexInDay":13,"word":"Paradigm","phonetic":"/ˈpær.ə.daɪm/","pos":"noun","az":"Paradiqma","definition":"Distinct set of concepts or thought patterns","example":"Scientific revolutions prompt fundamental paradigm shifts.","exampleAz":"Elmi inqilablar təməl paradiqma dəyişikliklərinə səbəb olur."},{"id":1829,"day":122,"indexInDay":14,"word":"Verifiable","phonetic":"/ˈver.ɪ.faɪ.ə.bəl/","pos":"adj","az":"Yoxlanıla bilən / Təsdiqlənə bilən","definition":"Able to be checked or proved to be true or accurate","example":"Ensure historical hypotheses rest on verifiable documentary sources.","exampleAz":"Tarixi fərziyyələrin yoxlanıla bilən sənədli mənbələrə söykənməsini təmin edin."},{"id":1830,"day":122,"indexInDay":15,"word":"Certainty","phonetic":"/ˈsɜː.tən.ti/","pos":"noun","az":"Qətilik / Şübhəsizlik","definition":"Firm conviction that something is the case","example":"Absolute philosophical certainty is rare; strive for rigorous likelihood.","exampleAz":"Mütləq fəlsəfi qətilik nadirdir; dəqiq əsaslandırılmış ehtimala can atın."}]},{"day":123,"level":"C1","theme":"Nuanced Adjectives for Emotion","themeAz":"Duyğuları Təsvir Edən Zərif Sifətlər","wordCount":15,"words":[{"id":1831,"day":123,"indexInDay":1,"word":"Melancholy","phonetic":"/ˈmel.əŋ.kɒl.i/","pos":"adj","az":"Kədərli / Həzin qəmli","definition":"Having a feeling of pensive sadness, typically with no obvious cause","example":"Autumn rainfall evokes a gentle, poetic melancholy.","exampleAz":"Payız yağışı zərif, poetik bir həzin kədər oyadır."},{"id":1832,"day":123,"indexInDay":2,"word":"Euphoric","phonetic":"/juːˈfɒr.ɪk/","pos":"adj","az":"Vəcdə gəlmiş / Hədsiz sevincli","definition":"Characterized by intense excitement and happiness","example":"The runner felt euphoric crossing the marathon finish.","exampleAz":"Qaçışçı marafonun finiş xəttini keçəndə hədsiz sevinc hiss etdi."},{"id":1833,"day":123,"indexInDay":3,"word":"Apprehensive","phonetic":"/ˌæp.rɪˈhen.sɪv/","pos":"adj","az":"Həyəcanlı / Qayğılı","definition":"Anxious or fearful that something bad or unpleasant will happen","example":"She felt slightly apprehensive before addressing the auditorium.","exampleAz":"Auditoriyaya müraciət etməzdən əvvəl o, bir az həyəcan keçirdi."},{"id":1834,"day":123,"indexInDay":4,"word":"Serene","phonetic":"/səˈriːn/","pos":"adj","az":"Sakit / Səfalı / Təmkinli","definition":"Calm, peaceful, and untroubled; tranquil","example":"The placid surface of Lake Goygol was perfectly serene.","exampleAz":"Göygölün sakit səthi tamamilə səfalı və dinc idi."},{"id":1835,"day":123,"indexInDay":5,"word":"Indignant","phonetic":"/ɪnˈdɪɡ.nənt/","pos":"adj","az":"Qəzəblənmiş / Haqsızlığa hiddətlənmiş","definition":"Feeling or showing anger or annoyance at unfair treatment","example":"Citizens grew indignant at the corrupt administrative practices.","exampleAz":"Vətəndaşlar ədalətsiz idarəçilik qaydalarına haqlı olaraq hiddətləndilər."},{"id":1836,"day":123,"indexInDay":6,"word":"Despondent","phonetic":"/dɪˈspɒn.dənt/","pos":"adj","az":"Ümidsiz / Ruhdan düşmüş","definition":"In low spirits from loss of hope or courage","example":"Never become despondent; persistence yields breakthrough.","exampleAz":"Heç vaxt ruhdan düşməyin; əzmkarlıq mütləq böyük sıçrayış gətirir."},{"id":1837,"day":123,"indexInDay":7,"word":"Nostalgic","phonetic":"/nɒsˈtæl.dʒɪk/","pos":"adj","az":"Nostalgik / Xatirələrə dalan","definition":"Characterized by affectionate longing for past eras","example":"Old photographs awaken nostalgic memories of childhood summers.","exampleAz":"Köhnə fotoşəkillər uşaqlıq yaylarının nostalji xatirələrini oyadır."},{"id":1838,"day":123,"indexInDay":8,"word":"Exuberant","phonetic":"/ɪɡˈzjuː.bər.ənt/","pos":"adj","az":"Coşqun / Sevinc dolu","definition":"Full of energy, excitement, and cheerfulness","example":"The exuberant wedding guests danced until morning dawn.","exampleAz":"Coşqun toy qonaqları sübh açılanadək rəqs etdilər."},{"id":1839,"day":123,"indexInDay":9,"word":"Ambivalent","phonetic":"/æmˈbɪv.ə.lənt/","pos":"adj","az":"Ziddiyyətli / İkili hisslər keçirən","definition":"Having mixed feelings or contradictory ideas about something","example":"He remained ambivalent about relocating overseas.","exampleAz":"Xaricə köçmək barədə o, ikili ziddiyyətli hisslər keçirirdi."},{"id":1840,"day":123,"indexInDay":10,"word":"Vexed","phonetic":"/vekst/","pos":"adj","az":"Qıcıqlanmış / Narahat edilmiş","definition":"Annoyed, frustrated, or worried","example":"The scholar felt vexed by persistent logistical delays.","exampleAz":"Alim daimi logistik gecikmələrdən narahatlıq və qıcıq hissi keçirdi."},{"id":1841,"day":123,"indexInDay":11,"word":"Stoic","phonetic":"/ˈstəʊ.ɪk/","pos":"adj","az":"Mətin / Səbirli / Sızıldamayan","definition":"Enduring pain and hardship without showing feelings or complaining","example":"His stoic endurance through winter hardship was admirable.","exampleAz":"Onun qış çətinliklərinə mətin dözümü heyranedici idi."},{"id":1842,"day":123,"indexInDay":12,"word":"Ecstatic","phonetic":"/ɪkˈstæt.ɪk/","pos":"adj","az":"Vəcd içində / Çox şad","definition":"Feeling or expressing overwhelming happiness or joyful excitement","example":"The laureate was ecstatic upon receiving the international prize.","exampleAz":"Laureat beynəlxalq mükafatı alanda vəcd içində idi."},{"id":1843,"day":123,"indexInDay":13,"word":"Somber","phonetic":"/ˈsɒm.bər/","pos":"adj","az":"Tutqun / Qəmli / Ciddi","definition":"Dark or dull in tone; solemn and grave","example":"The memorial ceremony was held in dignified somber silence.","exampleAz":"Xatirə mərasimi vüqarlı və tutqun bir sükut içində keçirildi."},{"id":1844,"day":123,"indexInDay":14,"word":"Jubilant","phonetic":"/ˈdʒuː.bəl.ənt/","pos":"adj","az":"Qələbə sevinci yaşayan / Zəfər fərəhli","definition":"Feeling or expressing great happiness and triumph","example":"The jubilant crowd celebrated the national championship.","exampleAz":"Fərəhli izdiham milli çempionat qələbəsini təntənə ilə qeyd etdi."},{"id":1845,"day":123,"indexInDay":15,"word":"Wistful","phonetic":"/ˈwɪst.fəl/","pos":"adj","az":"Həsrətli / Xəyalpərvər","definition":"Having or showing a feeling of vague or regretful longing","example":"She cast a wistful glance back at her ancestral home.","exampleAz":"O, ata-baba yurduna həsrət dolu bir nəzər saldı."}]},{"day":124,"level":"C1","theme":"Describing Complex Personalities","themeAz":"Mürəkkəb Şəxsiyyət Xüsusiyyətləri","wordCount":15,"words":[{"id":1846,"day":124,"indexInDay":1,"word":"Magnanimous","phonetic":"/mæɡˈnæn.ɪ.məs/","pos":"adj","az":"Alicənab / Böyük ürəkli","definition":"Generous or forgiving, especially toward a rival or less powerful person","example":"The magnanimous victor praised the valor of the runner-up.","exampleAz":"Alicənab qalib ikinci yerin sahibinin cəsarətini təriflədi."},{"id":1847,"day":124,"indexInDay":2,"word":"Gregarious","phonetic":"/ɡrɪˈɡeə.ri.əs/","pos":"adj","az":"Ünsiyyətcil / İnsan sevən","definition":"Fond of company; sociable and outgoing","example":"Her gregarious nature made her the heart of every conference.","exampleAz":"Onun ünsiyyətcil xarakteri onu hər konfransın ürəyinə çevirirdi."},{"id":1848,"day":124,"indexInDay":3,"word":"Meticulous","phonetic":"/məˈtɪk.jə.ləs/","pos":"adj","az":"Çox diqqətli / Həssas / Titiz","definition":"Showing great attention to detail; very careful and precise","example":"Meticulous vocabulary review eliminates recurring grammatical slips.","exampleAz":"Sözlərin çox diqqətli təkrarı təkrarlanan qrammatik xətaları yox edir."},{"id":1849,"day":124,"indexInDay":4,"word":"Astute","phonetic":"/əˈstjuːt/","pos":"adj","az":"Uzaqgörən / Fərasətli / Zirək","definition":"Having or showing an ability to accurately assess situations","example":"The astute diplomat detected subtle shifts in the negotiation room.","exampleAz":"Fərasətli diplomat danışıqlar zalındakı zərif dəyişiklikləri dərhal sezdi."},{"id":1850,"day":124,"indexInDay":5,"word":"Resolute","phonetic":"/ˈrez.ə.luːt/","pos":"adj","az":"Qətiyyətli / Sarsılmaz","definition":"Admirably purposeful, determined, and unwavering","example":"Remain resolute in your daily pursuit of linguistic mastery.","exampleAz":"Dil ustalığına doğru gündəlik yolunuzda sarsılmaz və qətiyyətli qalın."},{"id":1851,"day":124,"indexInDay":6,"word":"Tenacious","phonetic":"/təˈneɪ.ʃəs/","pos":"adj","az":"Əzmli / Möhkəm yapışan","definition":"Tending to keep a firm hold of something; clinging or persistent","example":"Tenacious learners turn momentary struggles into lasting fluency.","exampleAz":"Əzmli öyrənənlər müvəqqəti çətinlikləri daimi sərbəstliyə çevirirlər."},{"id":1852,"day":124,"indexInDay":7,"word":"Capricious","phonetic":"/kəˈprɪʃ.əs/","pos":"adj","az":"Əhvalı tez dəyişən / Kaprizli","definition":"Given to sudden and unaccountable changes of mood or behavior","example":"Avoid capricious study habits; cultivate steady discipline.","exampleAz":"Əhvaldan asılı qeyri-sabit vərdişlərdən çəkinin; sabit intizam qurun."},{"id":1853,"day":124,"indexInDay":8,"word":"Fastidious","phonetic":"/fæsˈtɪd.i.əs/","pos":"adj","az":"Son dərəcə tələbkar / Təmizkar","definition":"Very attentive to and concerned about accuracy and detail","example":"The editor was fastidious about typographic rhythm and margins.","exampleAz":"Redaktor tipoqrafik ritm və kənar boşluqlara qarşı son dərəcə tələbkar idi."},{"id":1854,"day":124,"indexInDay":9,"word":"Inquisitive","phonetic":"/ɪnˈkwɪz.ə.tɪv/","pos":"adj","az":"Maraqlanan / Hər şeyi öyrənmək istəyən","definition":"Curious or inquiring; eager for knowledge","example":"Inquisitive students absorb languages with natural childlike joy.","exampleAz":"Hər şeyi öyrənmək istəyən tələbələr dilləri təbii uşaq sevinci ilə mənimsəyirlər."},{"id":1855,"day":124,"indexInDay":10,"word":"Benevolent","phonetic":"/bəˈnev.əl.ənt/","pos":"adj","az":"Xeyirxah / Şəfqətli","definition":"Well meaning and kindly; disposed to doing good","example":"The benevolent patron endowed scholarships for village youth.","exampleAz":"Xeyirxah xeyriyyəçi kənd gəncləri üçün təqaüdlər təsis etdi."},{"id":1856,"day":124,"indexInDay":11,"word":"Pragmatic","phonetic":"/præɡˈmæt.ɪk/","pos":"adj","az":"Praqmatik / Əməli faydaya baxan","definition":"Dealing with things sensibly and realistically based on practical outcomes","example":"Adopt a pragmatic study routine that fits your actual day.","exampleAz":"Həqiqi gününüzə uyğun gələn praqmatik bir oxu rejimi seçin."},{"id":1857,"day":124,"indexInDay":12,"word":"Candid","phonetic":"/ˈkæn.dɪd/","pos":"adj","az":"Səmimi / Açıqsözlü","definition":"Truthful and straightforward; frank","example":"We had a candid conversation regarding career development.","exampleAz":"Karyera inkişafı barədə səmimi və açıqsözlü söhbətimiz oldu."},{"id":1858,"day":124,"indexInDay":13,"word":"Charismatic","phonetic":"/ˌkær.ɪzˈmæt.ɪk/","pos":"adj","az":"Xarizmatik / Cəlbedici","definition":"Exercising a compelling charm that inspires devotion in others","example":"The charismatic professor ignited a lifelong passion for history.","exampleAz":"Xarizmatik professor tarixə ömürlük bir sevgi oyatdı."},{"id":1859,"day":124,"indexInDay":14,"word":"Audacious","phonetic":"/ɔːˈdeɪ.ʃəs/","pos":"adj","az":"Cəsarətli / Qorxmaz / İddialı","definition":"Showing a willingness to take surprisingly bold risks","example":"The startup launched an audacious clean energy satellite.","exampleAz":"Startap cəsarətli və iddialı təmiz enerji peykini orbitə buraxdı."},{"id":1860,"day":124,"indexInDay":15,"word":"Affable","phonetic":"/ˈæf.ə.bəl/","pos":"adj","az":"Mehriban / Gülərüz / Xoşxasiyyət","definition":"Friendly, good-natured, or easy to talk to","example":"The ambassador was remarkably affable and approachable.","exampleAz":"Səfir olduqca mehriban və ünsiyyətə açıq bir şəxsiyyət idi."}]},{"day":125,"level":"C1","theme":"Rhetorical Devices & Oratory","themeAz":"Bəlağət Fiqurları və Nitq Sənəti","wordCount":15,"words":[{"id":1861,"day":125,"indexInDay":1,"word":"Hyperbole","phonetic":"/haɪˈpɜː.bəl.i/","pos":"noun","az":"Mübaliğə / Şişirtmə","definition":"Exaggerated statements or claims not meant to be taken literally","example":"Poets employ hyperbole to dramatize profound human passion.","exampleAz":"Şairlər dərin insan şövqünü canlandırmaq üçün mübaliğədən istifadə edirlər."},{"id":1862,"day":125,"indexInDay":2,"word":"Alliteration","phonetic":"/əˌlɪt.əˈreɪ.ʃən/","pos":"noun","az":"Alliterasiya / Eyni samitlərin təkrarı","definition":"Occurrence of the same letter or sound at the beginning of adjacent words","example":"Alliteration imbues poetic verses with musical resonance.","exampleAz":"Alliterasiya poetik misraları musiqili ahənglə bəzəyir."},{"id":1863,"day":125,"indexInDay":3,"word":"Metaphor","phonetic":"/ˈmet.ə.fɔːr/","pos":"noun","az":"Metafora / Məcaz","definition":"Figure of speech in which a word or phrase is applied to an object not literally applicable","example":"Time is an unyielding river carrying civilizations onward.","exampleAz":"Zaman sivilizasiyaları irəli aparan ramolunmaz bir çaydır."},{"id":1864,"day":125,"indexInDay":4,"word":"Simile","phonetic":"/ˈsɪm.ɪ.li/","pos":"noun","az":"Təşbeh / Bənzətmə","definition":"Figure of speech comparing one thing with another using like or as","example":"His mind is as sharp as a finely tempered razor.","exampleAz":"Onun ağlı yaxşıca itilənmiş ülgüc kimi kəskindir."},{"id":1865,"day":125,"indexInDay":5,"word":"Personification","phonetic":"/pəˌsɒn.ɪ.fɪˈkeɪ.ʃən/","pos":"noun","az":"Təşxis / Təcəssüm / Canlandırma","definition":"Attribution of a personal nature or human characteristics to something non-human","example":"The ancient wind whispered forgotten secrets through the stones.","exampleAz":"Qədim külək daşlar arasından unudulmuş sirləri pıçıldayırdı."},{"id":1866,"day":125,"indexInDay":6,"word":"Oxymoron","phonetic":"/ˌɒk.sɪˈmɔː.rɒn/","pos":"noun","az":"Oksimoron / Zidd mənalı sözlərin birləşməsi","definition":"Figure of speech in which apparently contradictory terms appear in conjunction","example":"The phrase \"deafening silence\" is a poignant literary oxymoron.","exampleAz":"\"Kar edici sükut\" ifadəsi təsirli bir ədəbi oksimorondur."},{"id":1867,"day":125,"indexInDay":7,"word":"Anaphora","phonetic":"/əˈnæf.ər.ə/","pos":"noun","az":"Anafora / Cümlə başı təkrar","definition":"Repetition of a word or phrase at the beginning of successive clauses","example":"Dr. King used anaphora masterfully in his immortal speech.","exampleAz":"Doktor Kinq ölməz nitqində anaforadan ustalıqla istifadə etmişdir."},{"id":1868,"day":125,"indexInDay":8,"word":"Irony","phonetic":"/ˈaɪ.rə.ni/","pos":"noun","az":"İroniya / Kinayə","definition":"Expression of meaning by using language signifying opposite","example":"The subtle dramatic irony enriched the philosophical tragedy.","exampleAz":"Zərif dramatik kinayə fəlsəfi faciəni daha da zənginləşdirdi."},{"id":1869,"day":125,"indexInDay":9,"word":"Antithesis","phonetic":"/ænˈtɪθ.ə.sɪs/","pos":"noun","az":"Antiteza / Təzad","definition":"Person or thing that is the direct opposite of someone or something else","example":"Patience is bitter, but its fruit is the antithesis: sweet.","exampleAz":"Səbir acıdır, lakin onun bəhrəsi tam təzaddır: şirindir."},{"id":1870,"day":125,"indexInDay":10,"word":"Euphemism","phonetic":"/ˈjuː.fə.mɪ.zəm/","pos":"noun","az":"Evfemizm","definition":"Mild or indirect expression substituted for one considered harsh","example":"Diplomats select gentle euphemisms to maintain peace.","exampleAz":"Diplomatlar sülhü qorumaq üçün zərif evfemizmlər seçirlər."},{"id":1871,"day":125,"indexInDay":11,"word":"Onomatopoeia","phonetic":"/ˌɒn.əˌmæt.əˈpiː.ə/","pos":"noun","az":"Onomatopoiya / Təqlidi səs sözü","definition":"Formation of a word from a sound associated with what is named","example":"Words like \"whisper\", \"buzz\", and \"splash\" evoke sensory sounds.","exampleAz":"\"Pıçıltı\", \"vızıltı\" və \"şırıltı\" kimi sözlər duyğu səslərini oyadır."},{"id":1872,"day":125,"indexInDay":12,"word":"Epiphany","phonetic":"/ɪˈpɪf.ən.i/","pos":"noun","az":"Qəfil idrak / İlahi aydınlanma","definition":"Moment of sudden revelation or insight","example":"He had an intellectual epiphany while walking by the sea.","exampleAz":"Dəniz kənarında gəzərkən onun beynində qəfil bir aydınlanma baş verdi."},{"id":1873,"day":125,"indexInDay":13,"word":"Eloquent","phonetic":"/ˈel.ə.kwənt/","pos":"adj","az":"Bəlağətli","definition":"Fluent and persuasive in speech","example":"The orator held the amphitheater spellbound with eloquent cadence.","exampleAz":"Natiq bəlağətli nitqi ilə bütün amfiteatrı valeh etdi."},{"id":1874,"day":125,"indexInDay":14,"word":"Cadence","phonetic":"/ˈkeɪ.dəns/","pos":"noun","az":"Ahəng / Ritm / Kadans","definition":"Modulation or inflection of the voice; rhythmic flow of sequence of sounds","example":"Notice the rhythmic cadence of balanced English clauses.","exampleAz":"Tarazlı ingilis cümlələrinin ritmik ahənginə diqqət yetirin."},{"id":1875,"day":125,"indexInDay":15,"word":"Resonance","phonetic":"/ˈrez.ən.əns/","pos":"noun","az":"Rezonans / Dərin təsir gücü","definition":"Quality in a sound of being deep, full, and reverberating; emotional impact","example":"His moving words held enduring spiritual resonance for listeners.","exampleAz":"Onun təsirli sözləri dinləyicilərin qəlbində daimi mənəvi iz buraxdı."}]},{"day":126,"level":"C1","theme":"Subtle Distinctions in Meaning","themeAz":"Mənada İncə Fərqlər və Çalar","wordCount":15,"words":[{"id":1876,"day":126,"indexInDay":1,"word":"Disinterested","phonetic":"/dɪsˈɪn.trəs.tɪd/","pos":"adj","az":"Qərəzsiz / Bitərəf","definition":"Not influenced by personal interest or advantage; impartial","example":"A judge must remain strictly disinterested in the outcome.","exampleAz":"Hakim işin nəticəsində tamamilə qərəzsiz və bitərəf qalmalıdır."},{"id":1877,"day":126,"indexInDay":2,"word":"Uninterested","phonetic":"/ʌnˈɪn.trəs.tɪd/","pos":"adj","az":"Maraqsız / Maraqlanmayan","definition":"Not interested in or concerned about something or someone","example":"He was completely uninterested in trivial office gossip.","exampleAz":"O, mənasız ofis dedi-qoduları ilə heç maraqlanmırdı."},{"id":1878,"day":126,"indexInDay":3,"word":"Ingenious","phonetic":"/ɪnˈdʒiː.ni.əs/","pos":"adj","az":"Dahiyanə / Çox ağıllı","definition":"Clever, original, and inventive","example":"Her ingenious algorithm reduced query latency to zero.","exampleAz":"Onun dahiyanə alqoritmi sorğu gecikməsini sıfıra endirdi."},{"id":1879,"day":126,"indexInDay":4,"word":"Ingenuous","phonetic":"/ɪnˈdʒen.ju.əs/","pos":"adj","az":"Sadəlövh / Səmimi / Hiyləsiz","definition":"Innocent and unsuspecting; frank and open","example":"The child’s ingenuous trust melted the old man’s cynicism.","exampleAz":"Uşağın səmimi və hiyləsiz inamı qocanın bədbinliyini əritdi."},{"id":1880,"day":126,"indexInDay":5,"word":"Judicious","phonetic":"/dʒuːˈdɪʃ.əs/","pos":"adj","az":"Müdrik / Düşünülmüş / Təmkinli","definition":"Having, showing, or done with good judgment or sense","example":"A judicious investment in human capital guarantees returns.","exampleAz":"İnsan kapitalına düşünülmüş sərmayə qoymaq daimi gəlirə zəmanət verir."},{"id":1881,"day":126,"indexInDay":6,"word":"Judicial","phonetic":"/dʒuːˈdɪʃ.əl/","pos":"adj","az":"Məhkəmə / Ədliyyə","definition":"Relating to a court or judge; judicial branch","example":"Judicial independence is essential for the rule of law.","exampleAz":"Qanunun aliliyi üçün məhkəmə müstəqilliyi vacib şərtdir."},{"id":1882,"day":126,"indexInDay":7,"word":"Continuous","phonetic":"/kənˈtɪn.ju.əs/","pos":"adj","az":"Fasiləsiz / Kəsilməz","definition":"Forming an unbroken whole, without interruption","example":"The engine emitted a soft continuous mechanical hum.","exampleAz":"Mühərrik fasiləsiz zərif bir mexaniki səs çıxarırdı."},{"id":1883,"day":126,"indexInDay":8,"word":"Continual","phonetic":"/kənˈtɪn.ju.əl/","pos":"adj","az":"Tez-tez təkrarlanan","definition":"Frequently recurring; occurring at intervals","example":"Continual daily review anchors words in long-term memory.","exampleAz":"Tez-tez təkrarlanan gündəlik baxış sözləri uzunmüddətli yaddaşa bağlayır."},{"id":1884,"day":126,"indexInDay":9,"word":"Sensible","phonetic":"/ˈsen.sə.bəl/","pos":"adj","az":"Ağıllı / Məntiqli","definition":"Chosen in accordance with wisdom or prudence; practical","example":"It is sensible to establish an emergency savings fund.","exampleAz":"Təcili vəziyyətlər üçün qənaət fondu yaratmaq çox ağıllı bir addımdır."},{"id":1885,"day":126,"indexInDay":10,"word":"Sensitive","phonetic":"/ˈsen.sɪ.tɪv/","pos":"adj","az":"Həssas / Zərif duyğulu","definition":"Quick to detect or respond to slight changes or feelings","example":"A poet is exceptionally sensitive to linguistic music.","exampleAz":"Şair dilin musiqisinə qarşı son dərəcə həssasdır."},{"id":1886,"day":126,"indexInDay":11,"word":"Complement","phonetic":"/ˈkɒm.plɪ.ment/","pos":"verb","az":"Tamamlamaq","definition":"Add to in a way that enhances or improves","example":"Spoken practice complements extensive reading harmoniously.","exampleAz":"Danışıq məşqi geniş mütaliəni ahəngdar şəkildə tamamlayır."},{"id":1887,"day":126,"indexInDay":12,"word":"Compliment","phonetic":"/ˈkɒm.plɪ.ment/","pos":"verb","az":"Tərifləmək / Xoş söz demək","definition":"Politely congratulate or praise someone for something","example":"The professor complimented the student on her original thesis.","exampleAz":"Professor tələbəni orijinal dissertasiyasına görə təriflədi."},{"id":1888,"day":126,"indexInDay":13,"word":"Eminent","phonetic":"/ˈem.ɪ.nənt/","pos":"adj","az":"Məşhur / Hörmətli / Görkəmli","definition":"Famous and respected within a particular sphere","example":"An eminent linguist delivered the keynote address.","exampleAz":"Görkəmli dilçi alim əsas məruzə ilə çıxış etdi."},{"id":1889,"day":126,"indexInDay":14,"word":"Imminent","phonetic":"/ˈɪm.ɪ.nənt/","pos":"adj","az":"Gözlənilən / Qapıda olan (təhlükə)","definition":"About to happen; impending","example":"Dark clouds signaled an imminent mountain downpour.","exampleAz":"Qara buludlar dağda qapıda olan güclü leysandan xəbər verirdi."},{"id":1890,"day":126,"indexInDay":15,"word":"Elusive","phonetic":"/iˈluː.sɪv/","pos":"adj","az":"Çətin tutulan / Sirli","definition":"Difficult to find, catch, or achieve","example":"True fluency is elusive only to those who lack patience.","exampleAz":"Əsl sərbəstlik yalnız səbri çatmayanlar üçün əlçatmazdır."}]},{"day":127,"level":"C1","theme":"Sophisticated Adverbs of Degree","themeAz":"Dərəcə və Tərz Bildirən Ali Zərflər","wordCount":15,"words":[{"id":1891,"day":127,"indexInDay":1,"word":"Profoundly","phonetic":"/prəˈfaʊnd.li/","pos":"adv","az":"Dərindən / Hədsiz dərəcədə","definition":"To a profound extent; extremely or deeply","example":"I am profoundly grateful for your generous encouragement.","exampleAz":"Sizin səxavətli dəstəyinizə görə dərindən minnətdaram."},{"id":1892,"day":127,"indexInDay":2,"word":"Remarkably","phonetic":"/rɪˈmɑː.kə.bli/","pos":"adv","az":"Heyranedici dərəcədə / Təəccüblü dərəcədə","definition":"In a way that is worthy of attention or striking","example":"The student progressed remarkably in pronunciation.","exampleAz":"Tələbə tələffüzdə heyranedici dərəcədə irəlilədi."},{"id":1893,"day":127,"indexInDay":3,"word":"Utterly","phonetic":"/ˈʌt.əl.i/","pos":"adv","az":"Tamamilə / Qətiyyən","definition":"Completely and without qualification; absolutely","example":"The historic coastal vista was utterly breathtaking.","exampleAz":"Tarixi sahil mənzərəsi tamamilə nəfəskəsici idi."},{"id":1894,"day":127,"indexInDay":4,"word":"Subtly","phonetic":"/ˈsʌt.li/","pos":"adv","az":"Zərifcə / Hiss olunmadan","definition":"In a clever or indirect way; with delicate nuance","example":"The lighting subtly shifted as dusk settled over the bay.","exampleAz":"Qürub çağı körfəzə enərkən işıq zərifcə dəyişdi."},{"id":1895,"day":127,"indexInDay":5,"word":"Invariably","phonetic":"/ɪnˈveə.ri.ə.bli/","pos":"adv","az":"Həmişə / İstisnasız olaraq","definition":"In every case or on every occasion; always","example":"Dedication invariably yields tangible mastery.","exampleAz":"Fədakarlıq istisnasız olaraq həmişə real ustalıq gətirir."},{"id":1896,"day":127,"indexInDay":6,"word":"Exclusively","phonetic":"/ɪkˈskluː.sɪv.li/","pos":"adv","az":"Yalnız / Məxsusi olaraq","definition":"Only; not including any others","example":"Dedicate this half-hour exclusively to language immersion.","exampleAz":"Bu yarım saatı yalnız dildə yaşamağa həsr edin."},{"id":1897,"day":127,"indexInDay":7,"word":"Indisputably","phonetic":"/ˌɪn.dɪˈspjuː.tə.bli/","pos":"adv","az":"Mübahisəsiz / Şübhəsiz olaraq","definition":"In a manner that cannot be questioned or doubted","example":"English is indisputably the lingua franca of global research.","exampleAz":"İngilis dili şübhəsiz olaraq qlobal tədqiqatların ortaq dilidir."},{"id":1898,"day":127,"indexInDay":8,"word":"Inadvertently","phonetic":"/ˌɪn.ədˈvɜː.tənt.li/","pos":"adv","az":"Bilmədən / Təsadüfən","definition":"Without intention; accidentally","example":"He inadvertently used a British spelling in the essay.","exampleAz":"O, essedə bilmədən Britaniya orfoqrafiyasından istifadə etmişdi."},{"id":1899,"day":127,"indexInDay":9,"word":"Conspicuously","phonetic":"/kənˈspɪk.ju.əs.li/","pos":"adv","az":"Gözəçarpan dərəcədə / Açıq-aşkar","definition":"In a clearly visible or noticeable way","example":"Her linguistic composure stood out conspicuously in the debate.","exampleAz":"Debatda onun dil təmkinliyi açıq-aşkar seçilirdi."},{"id":1900,"day":127,"indexInDay":10,"word":"Scrupulously","phonetic":"/ˈskruː.pjə.ləs.li/","pos":"adv","az":"Vicdanla / Həddindən artıq dəqiqliklə","definition":"In a very careful and thorough way; adhering strictly to ethics","example":"The translator scrupulously preserved the author’s philosophical intent.","exampleAz":"Tərcüməçi müəllifin fəlsəfi məramını son dərəcə dəqiqliklə qorudu."},{"id":1901,"day":127,"indexInDay":11,"word":"Impeccably","phonetic":"/ɪmˈpek.ə.bli/","pos":"adv","az":"Qüsursuz şəkildə","definition":"In accordance with the highest standards; faultlessly","example":"He spoke impeccably during the foreign delegation dinner.","exampleAz":"O, xarici nümayəndə heyətinin şam yeməyində qüsursuz danışdı."},{"id":1902,"day":127,"indexInDay":12,"word":"Virtually","phonetic":"/ˈvɜː.tʃu.ə.li/","pos":"adv","az":"Demək olar ki / Faktiki olaraq","definition":"Nearly; almost entirely","example":"With 2,400 core words, you understand virtually all standard prose.","exampleAz":"2400 əsas sözlə siz demək olar ki, bütün standart nəsri başa düşürsünüz."},{"id":1903,"day":127,"indexInDay":13,"word":"Unequivocally","phonetic":"/ˌʌn.ɪˈkwɪv.ə.kəl.i/","pos":"adv","az":"Birmənalı olaraq / Qəti surətdə","definition":"In a way that leaves no doubt","example":"The data unequivocally substantiate our hypothesis.","exampleAz":"Faktlar fərziyyəmizi birmənalı olaraq təsdiqləyir."},{"id":1904,"day":127,"indexInDay":14,"word":"Exceedingly","phonetic":"/ɪkˈsiː.dɪŋ.li/","pos":"adv","az":"Həddən artıq / Çox","definition":"Extremely; to an unusual degree","example":"The grammatical concept is exceedingly straightforward when demonstrated.","exampleAz":"Göstərildikdə qrammatik qayda olduqca aydın və sadədir."},{"id":1905,"day":127,"indexInDay":15,"word":"Intricately","phonetic":"/ˈɪn.trɪ.kət.li/","pos":"adv","az":"Dolaşıq və zərif şəkildə / İncəliklə","definition":"In a very complicated or detailed manner","example":"The carpet patterns are intricately woven by master artisans.","exampleAz":"Xalça naxışları usta sənətkarlar tərəfindən incəliklə toxunmuşdur."}]},{"day":128,"level":"C1","theme":"Formal Discourse Markers","themeAz":"Rəsmi Nitq və Mətn Keçidləri","wordCount":15,"words":[{"id":1906,"day":128,"indexInDay":1,"word":"Notwithstanding","phonetic":"/ˌnɒt.wɪðˈstæn.dɪŋ/","pos":"prep","az":"Baxmayaraq ki / Buna rəğmən","definition":"In spite of; despite","example":"Notwithstanding initial apprehensions, the launch was triumphant.","exampleAz":"İlk narahatlıqlara baxmayaraq, layihənin startı zəfərlə keçdi."},{"id":1907,"day":128,"indexInDay":2,"word":"Henceforth","phonetic":"/ˌhensˈfɔːθ/","pos":"adv","az":"Bundan sonra / Bu andan etibarən","definition":"From this time on or from that point forward","example":"Henceforth, English shall be our daily medium of reflection.","exampleAz":"Bu andan etibarən ingilis dili bizim gündəlik düşüncə vasitəmiz olacaq."},{"id":1908,"day":128,"indexInDay":3,"word":"Albeit","phonetic":"/ɔːlˈbiː.ɪt/","pos":"conj","az":"Hərçənd / Baxmayaraq ki","definition":"Though; even if","example":"He completed the marathon, albeit at a measured pace.","exampleAz":"O, marafonu bitirdi, hərçənd ölçülü və təmkinli bir templə."},{"id":1909,"day":128,"indexInDay":4,"word":"Inasmuch as","phonetic":"/ɪn.əzˈmʌtʃ əz/","pos":"conj","az":"Madam ki / Nəzərə alsaq ki","definition":"To the extent that; considering that","example":"Inasmuch as education transforms lives, we must invest heavily.","exampleAz":"Nəzərə alsaq ki, təhsil həyatları dəyişir, ona böyük sərmayə qoymalıyıq."},{"id":1910,"day":128,"indexInDay":5,"word":"Whereby","phonetic":"/weəˈbaɪ/","pos":"adv","az":"Hansının vasitəsilə ki","definition":"By which method, arrangement, or means","example":"A treaty was ratified whereby regional tariffs were dismantled.","exampleAz":"Regional gömrük rüsumlarının ləğv edildiyi bir müqavilə təsdiqləndi."},{"id":1911,"day":128,"indexInDay":6,"word":"Heretofore","phonetic":"/ˌhɪə.tuːˈfɔːr/","pos":"adv","az":"İndiyədək / Bu vaxtadək","definition":"Before now; until this period","example":"Heretofore unseen documents were unveiled at the exhibition.","exampleAz":"İndiyədək görünməmiş tarixi sənədlər sərgidə nümayiş etdirildi."},{"id":1912,"day":128,"indexInDay":7,"word":"Apropos","phonetic":"/ˌæp.rəˈpəʊ/","pos":"prep","az":"Yeri gəlmişkən / ...-ə münasibətdə","definition":"Concerning or with reference to; suitable","example":"Apropos our previous discussion, here is the verified dataset.","exampleAz":"Əvvəlki müzakirəmizə münasibətdə, buyurun, yoxlanılmış məlumat bazası."},{"id":1913,"day":128,"indexInDay":8,"word":"Ergo","phonetic":"/ˈɜː.ɡəʊ/","pos":"adv","az":"Deməli / Buna görə də (latınca)","definition":"Therefore; consequently","example":"You practice diligently every sunrise; ergo, you excel.","exampleAz":"Siz hər dan yeri söküləndə səylə məşq edirsiniz; deməli, ucalacaqsınız."},{"id":1914,"day":128,"indexInDay":9,"word":"Vis-à-vis","phonetic":"/ˌviːz.əˈviː/","pos":"prep","az":"Münasibətdə / Müqayisədə","definition":"In relation to; with regard to; face to face with","example":"Analyze your progress vis-à-vis your original Day 1 benchmark.","exampleAz":"İrəliləyişinizi 1-ci gündəki ilkin səviyyənizlə müqayisədə təhlil edin."},{"id":1915,"day":128,"indexInDay":10,"word":"Inter alia","phonetic":"/ˌɪn.tər ˈeɪ.li.ə/","pos":"phrase","az":"Digər şeylərlə yanaşı","definition":"Among other things","example":"The report addressed, inter alia, digital pedagogical tools.","exampleAz":"Hesabat, digər məsələlərlə yanaşı, rəqəmsal pedaqoji alətlərə də toxundu."},{"id":1916,"day":128,"indexInDay":11,"word":"Ipso facto","phonetic":"/ˌɪp.səʊ ˈfæk.təʊ/","pos":"phrase","az":"Faktın özünə görə / Təbii olaraq","definition":"By that very fact or act","example":"Mastering the lexicon makes you, ipso facto, far more articulate.","exampleAz":"Söz ehtiyatını mənimsəmək sizi təbii olaraq daha fəsahətli edir."},{"id":1917,"day":128,"indexInDay":12,"word":"Prima facie","phonetic":"/ˌpraɪ.mə ˈfeɪ.ʃiː/","pos":"adj","az":"İlk baxışdan / Açıq-aşkar","definition":"Based on the first impression; accepted as correct until proved otherwise","example":"The brief provides prima facie evidence of intellectual property infringement.","exampleAz":"Sənəd intellektual mülkiyyətin pozulmasına dair ilk baxışdan tutarlı sübut təqdim edir."},{"id":1918,"day":128,"indexInDay":13,"word":"Mutatis mutandis","phonetic":"/mjuːˌteɪ.tɪs mjuːˈtæn.dɪs/","pos":"phrase","az":"Zəruri dəyişiklikləri etməklə","definition":"Making necessary alterations while preserving core essence","example":"The principle applies, mutatis mutandis, to foreign language acquisition.","exampleAz":"Bu prinsip zəruri dəyişikliklərlə xarici dil öyrənməsinə də aiddir."},{"id":1919,"day":128,"indexInDay":14,"word":"Qua","phonetic":"/kweɪ/","pos":"prep","az":"Kimi / Sifətində","definition":"In the capacity or character of","example":"Duty belongs to him qua senior executive of the enterprise.","exampleAz":"Bu öhdəlik ona müəssisənin baş rəhbəri sifətində aiddir."},{"id":1920,"day":128,"indexInDay":15,"word":"In toto","phonetic":"/ɪn ˈtəʊ.təʊ/","pos":"phrase","az":"Bütövlükdə / Tamamilə","definition":"As a whole; completely","example":"The academic committee accepted the curriculum proposal in toto.","exampleAz":"Akademik şura kurikulum təklifini bütövlükdə tam qəbul etdi."}]},{"day":129,"level":"C1","theme":"High-Level Academic Verbs","themeAz":"Ali Akademik Tədqiqat Felləri","wordCount":15,"words":[{"id":1921,"day":129,"indexInDay":1,"word":"Elucidate","phonetic":"/iˈluː.sɪ.deɪt/","pos":"verb","az":"Aydınlaşdırmaq / İzah etmək","definition":"Make something clear; explain","example":"The professor elucidated the intricacies of syntax.","exampleAz":"Professor cümlə sintaksisinin incəliklərini dərindən izah etdi."},{"id":1922,"day":129,"indexInDay":2,"word":"Substantiate","phonetic":"/səbˈstæn.ʃi.eɪt/","pos":"verb","az":"Əsaslandırmaq / Sübut etmək","definition":"Provide evidence to support or prove the truth of","example":"Empirical citations substantiate the thesis statement.","exampleAz":"Empirik istinadlar dissertasiyanın əsas müddəasını sübut edir."},{"id":1923,"day":129,"indexInDay":3,"word":"Delineate","phonetic":"/dɪˈlɪn.i.eɪt/","pos":"verb","az":"Dəqiqliklə təsvir etmək / Cızmaq","definition":"Describe or portray something precisely","example":"The roadmap delineates the four phases of vocabulary mastery.","exampleAz":"Yol xəritəsi lüğət ustalığının dörd mərhələsini dəqiqliklə təsvir edir."},{"id":1924,"day":129,"indexInDay":4,"word":"Exemplify","phonetic":"/ɪɡˈzem.plɪ.faɪ/","pos":"verb","az":"Nümunə olmaq / Təcəssüm etdirmək","definition":"Be a typical example of","example":"Her dedication exemplifies the ideal scholarly spirit.","exampleAz":"Onun fədakarlığı ideal alim ruhunu təcəssüm etdirir."},{"id":1925,"day":129,"indexInDay":5,"word":"Extrapolate","phonetic":"/ɪkˈstræp.ə.leɪt/","pos":"verb","az":"Mövcud faktlardan nəticə çıxarmaq / Proqnozlaşdırmaq","definition":"Extend the application of a method to an unknown situation","example":"We can extrapolate future fluency gains from your daily streak.","exampleAz":"Gündəlik ardıcıllığınızdan gələcək danışıq irəliləyişinizi proqnozlaşdıra bilərik."},{"id":1926,"day":129,"indexInDay":6,"word":"Corroborate","phonetic":"/kəˈrɒb.ə.reɪt/","pos":"verb","az":"Təsdiqləmək / Qüvvətləndirmək","definition":"Confirm or give support to a statement, theory, or finding","example":"Archaeological discoveries corroborated ancient historical annals.","exampleAz":"Arxeoloji tapıntılar qədim tarixi salnamələri təsdiqlədi."},{"id":1927,"day":129,"indexInDay":7,"word":"Demarcate","phonetic":"/ˈdiː.mɑː.keɪt/","pos":"verb","az":"Sərhəd çəkmək / Fərqləndirmək","definition":"Set the boundaries or limits of","example":"Carefully demarcate between objective evidence and personal belief.","exampleAz":"Obyektiv sübutla şəxsi inanc arasındakı sərhədi dəqiqliklə müəyyənləşdirin."},{"id":1928,"day":129,"indexInDay":8,"word":"Postulate","phonetic":"/ˈpɒs.tʃə.leɪt/","pos":"verb","az":"Fərziyyə irəli sürmək","definition":"Suggest or assume the truth of as basis for reasoning","example":"The linguist postulated a universal cognitive grammar framework.","exampleAz":"Dilçi universal koqnitiv qrammatika modelini irəli sürdü."},{"id":1929,"day":129,"indexInDay":9,"word":"Synthesize","phonetic":"/ˈsɪn.θə.saɪz/","pos":"verb","az":"Sintez etmək / Birləşdirmək","definition":"Combine diverse ideas into a coherent whole","example":"Synthesize lessons from each block to view the wider linguistic tapestry.","exampleAz":"Böyük dil lövhəsini görmək üçün hər blokun dərslərini sintez edin."},{"id":1930,"day":129,"indexInDay":10,"word":"Disseminate","phonetic":"/dɪˈsem.ɪ.neɪt/","pos":"verb","az":"Yaymaq / Nəşr etmək","definition":"Spread something, especially information, widely","example":"Universities disseminate research for the flourishing of mankind.","exampleAz":"Universitetlər bəşəriyyətin rifahı üçün tədqiqatları geniş yayırlar."},{"id":1931,"day":129,"indexInDay":11,"word":"Juxtapose","phonetic":"/ˌdʒʌk.stəˈpəʊz/","pos":"verb","az":"Yan-yana qoyub müqayisə etmək","definition":"Place close together for contrasting effect","example":"Juxtapose classical idioms with modern vernacular expressions.","exampleAz":"Klassik idiomları müasir danışıq ifadələri ilə yan-yana qoyub müqayisə edin."},{"id":1932,"day":129,"indexInDay":12,"word":"Articulate","phonetic":"/ɑːˈtɪk.jə.leɪt/","pos":"verb","az":"Fikri aydın ifadə etmək","definition":"Express an idea or feeling fluently and coherently","example":"Articulate your scholarly arguments with intellectual poise.","exampleAz":"Elmi arqumentlərinizi intellektual təmkinlə aydın ifadə edin."},{"id":1933,"day":129,"indexInDay":13,"word":"Reiterate","phonetic":"/riˈɪt.ər.eɪt/","pos":"verb","az":"Təkidlə təkrar etmək","definition":"Say something again or a number of times, typically for emphasis","example":"Let me reiterate: daily consistency conquers every linguistic hurdle.","exampleAz":"Bir daha təkidlə təkrar edirəm: gündəlik ardıcıllıq hər bir dil əngəlini aşır."},{"id":1934,"day":129,"indexInDay":14,"word":"Encompass","phonetic":"/ɪnˈkʌm.pəs/","pos":"verb","az":"Əhatə etmək","definition":"Surround and have or hold within","example":"Our 160 days encompass 2,400 meticulously organized words.","exampleAz":"Bizim 160 günümüz diqqətlə nizama salınmış 2400 sözü tam əhatə edir."},{"id":1935,"day":129,"indexInDay":15,"word":"Interrogate","phonetic":"/ɪnˈter.ə.ɡeɪt/","pos":"verb","az":"Dərindən sorğu-sual etmək / Tədqiq etmək","definition":"Ask questions of someone or inspect assumptions closely","example":"Interrogate cultural biases embedded within translated idioms.","exampleAz":"Tərcümə olunmuş idiomların içindəki mədəni çalarları dərindən araşdırın."}]},{"day":130,"level":"C1","theme":"Diplomatic & Cautious Language","themeAz":"Diplomatik və Ehtiyatlı Dil (Hedging)","wordCount":15,"words":[{"id":1936,"day":130,"indexInDay":1,"word":"Plausible","phonetic":"/ˈplɔː.zə.bəl/","pos":"adj","az":"Ağlabatan / İnandırıcı","definition":"Seeming reasonable or probable","example":"The historian offered a highly plausible interpretation.","exampleAz":"Tarixçi son dərəcə ağlabatan və inandırıcı bir təfsir təqdim etdi."},{"id":1937,"day":130,"indexInDay":2,"word":"Tentative","phonetic":"/ˈten.tə.tɪv/","pos":"adj","az":"İlkin / Qeyri-qəti / Sınaq xarakterli","definition":"Not certain or fixed; provisional","example":"We drew a tentative conclusion pending further verification.","exampleAz":"Əlavə yoxlama aparılanadək ilkin bir nəticəyə gəldik."},{"id":1938,"day":130,"indexInDay":3,"word":"Inconceivable","phonetic":"/ˌɪn.kənˈsiː.və.bəl/","pos":"adj","az":"Ağlasığmaz / Təsəvvüredilməz","definition":"Not capable of being imagined or grasped mentally","example":"Decades ago, pocket smartphones with AI were inconceivable.","exampleAz":"Onilliklər əvvəl süni intellektli cib telefonları ağlasığmaz idi."},{"id":1939,"day":130,"indexInDay":4,"word":"Conceivably","phonetic":"/kənˈsiː.və.bli/","pos":"adv","az":"Ehtimal ki / Fərz etmək olar ki","definition":"It is conceivable or imaginable that","example":"Conceivably, you will master advanced C1 idioms within weeks.","exampleAz":"Ehtimal etmək olar ki, bir neçə həftəyə yüksək C1 idiomlarına yiyələnəcəksiniz."},{"id":1940,"day":130,"indexInDay":5,"word":"Seemingly","phonetic":"/ˈsiː.mɪŋ.li/","pos":"adv","az":"Zahirən / Görünüşə görə","definition":"So as to give the impression of having a certain quality","example":"The riddle was seemingly impenetrable until we spotted the pattern.","exampleAz":"Qanunauyğunluğu görənədək tapmaca zahirən həllolunmaz görünürdü."},{"id":1941,"day":130,"indexInDay":6,"word":"Purportedly","phonetic":"/pəˈpɔː.tɪd.li/","pos":"adv","az":"İddiaya görə / Deyilənə görə","definition":"As appears or is stated to be true, though not proved","example":"The manuscript purportedly dates to the twelfth century.","exampleAz":"Deyilənə görə, əlyazma on ikinci əsrə aiddir."},{"id":1942,"day":130,"indexInDay":7,"word":"Presumably","phonetic":"/prɪˈzjuː.mə.bli/","pos":"adv","az":"Güman ki / Yəqin ki","definition":"Used to convey that what is asserted is very likely","example":"Presumably, disciplined learners complete exercises every morning.","exampleAz":"Yəqin ki, intizamlı tələbələr hər səhər çalışmalarını tamamlayırlar."},{"id":1943,"day":130,"indexInDay":8,"word":"Ostensibly","phonetic":"/ɒsˈten.sə.bli/","pos":"adv","az":"Zahirən / Görünüşdə","definition":"As appears or is stated to be true, though perhaps not so","example":"The meeting was ostensibly a friendly tea gathering, but treaties were finalized.","exampleAz":"Görüş zahirən dostcasına çay məclisi idi, lakin mühüm müqavilələr bağlandı."},{"id":1944,"day":130,"indexInDay":9,"word":"Speculative","phonetic":"/ˈspek.jə.lə.tɪv/","pos":"adj","az":"Fərziyyəvi / Dəlilsiz","definition":"Engaged in, expressing, or based on conjecture rather than knowledge","example":"Avoid purely speculative claims without empirical grounding.","exampleAz":"Empirik əsası olmayan sırf fərziyyəvi iddialardan çəkinin."},{"id":1945,"day":130,"indexInDay":10,"word":"Caveat","phonetic":"/ˈkeɪ.vi.æt/","pos":"noun","az":"Xəbərdarlıq / Şərt / Qeyd","definition":"Warning or proviso of specific stipulations, conditions, or limitations","example":"One vital caveat: memorizing words without pronunciation hinders speech.","exampleAz":"Vacib bir xəbərdarlıq: tələffüzü bilmədən söz əzbərləmək danışığı ləngidir."},{"id":1946,"day":130,"indexInDay":11,"word":"Prudent","phonetic":"/ˈpruː.dənt/","pos":"adj","az":"Ehtiyatlı / Uzaqgörən","definition":"Acting with or showing care and thought for the future","example":"It is prudent to review tricky idioms across spaced days.","exampleAz":"Çətin idiomları fasiləli günlərdə təkrar etmək uzaqgörən addımdır."},{"id":1947,"day":130,"indexInDay":12,"word":"Equivocal","phonetic":"/ɪˈkwɪv.ə.kəl/","pos":"adj","az":"İkibaşlı / Qeyri-müəyyən","definition":"Open to more than one interpretation; ambiguous","example":"Diplomatic statements are often deliberately equivocal.","exampleAz":"Diplomatik bəyanatlar çox vaxt qəsdən ikibaşlı və ehtiyatlı tərtib olunur."},{"id":1948,"day":130,"indexInDay":13,"word":"Nuance","phonetic":"/ˈnjuː.ɑːns/","pos":"noun","az":"İncə fərq","definition":"Delicate shade of meaning","example":"Grasp the nuance to distinguish politeness from subservience.","exampleAz":"Nəzakəti yaltaqlıqdan fərqləndirmək üçün incə çalarları dərk edin."},{"id":1949,"day":130,"indexInDay":14,"word":"Discretion","phonetic":"/dɪˈskreʃ.ən/","pos":"noun","az":"Ehtiyatlılıq / Təmkin","definition":"Quality of behaving or speaking in such a way as to avoid causing offense","example":"Exercise professional discretion when handling private dossiers.","exampleAz":"Şəxsi sənədlərlə işləyərkən peşəkar ehtiyatlılıq və təmkin nümayiş etdirin."},{"id":1950,"day":130,"indexInDay":15,"word":"Moderate","phonetic":"/ˈmɒd.ər.eɪt/","pos":"verb","az":"Mülayimləşdirmək / Tənzimləmək","definition":"Make or become less extreme, intense, or violent","example":"Moderate your tone to invite open, defenseless dialogue.","exampleAz":"Açıq və səmimi dialoq yaratmaq üçün tonunuzu mülayimləşdirin."}]},{"day":131,"level":"C1","theme":"Sociopolitical Discourse","themeAz":"İctimai-Siyasi Diskurs və Təhlil","wordCount":15,"words":[{"id":1951,"day":131,"indexInDay":1,"word":"Sovereignty","phonetic":"/ˈsɒv.rɪn.ti/","pos":"noun","az":"Suverenlik / Dövlət müstəqilliyi","definition":"Supreme power or authority of a state over its destiny","example":"National sovereignty safeguards the cultural self-determination of a people.","exampleAz":"Milli suverenlik xalqın mədəni öz müqəddəratını təyin etməsini qoruyur."},{"id":1952,"day":131,"indexInDay":2,"word":"Hegemony","phonetic":"/hɪˈɡem.ə.ni/","pos":"noun","az":"Hegemonluq / Ağalıq","definition":"Leadership or dominance, especially by one country or social group over others","example":"Multipolar diplomacy dismantles unilateral global hegemony.","exampleAz":"Çoxqütblü diplomatiya birtərəfli qlobal hegemonluğu aradan qaldırır."},{"id":1953,"day":131,"indexInDay":3,"word":"Partisan","phonetic":"/ˌpɑː.tɪˈzæn/","pos":"adj","az":"Qərəzli / Bir tərəfi tutan","definition":"Prejudiced in favor of a particular political cause","example":"Statesmen rise above narrow partisan interests for the common good.","exampleAz":"Dövlət xadimləri ümumi xeyir naminə dar partiya maraqlarından uca dururlar."},{"id":1954,"day":131,"indexInDay":4,"word":"Polarization","phonetic":"/ˌpəʊ.lər.aɪˈzeɪ.ʃən/","pos":"noun","az":"Qütbləşmə","definition":"Division into two sharply contrasting groups or sets of opinions","example":"Civic education bridges corrosive sociopolitical polarization.","exampleAz":"Vətəndaşlıq təhsili dağıdıcı ictimai-siyasi qütbləşməni azaldır."},{"id":1955,"day":131,"indexInDay":5,"word":"Grassroots","phonetic":"/ˈɡrɑːs.ruːts/","pos":"noun","az":"Xalq hərəkatı / Təməldən gələn təşəbbüs","definition":"Common people at local level as distinct from leadership","example":"Grassroots ecological movements cleaned coastal waterways.","exampleAz":"Təməldən gələn xalq ekoloji hərəkatları sahil sularını təmizlədi."},{"id":1956,"day":131,"indexInDay":6,"word":"Disenfranchised","phonetic":"/ˌdɪs.ɪnˈfræn.tʃaɪzd/","pos":"adj","az":"Hüquqlarından məhrum edilmiş","definition":"Deprived of rights or privileges, especially right to vote","example":"Democratic reforms empower historically disenfranchised communities.","exampleAz":"Demokratik islahatlar hüquqsuz qalmış icmalara səlahiyyət verir."},{"id":1957,"day":131,"indexInDay":7,"word":"Autocracy","phonetic":"/ɔːˈtɒk.rə.si/","pos":"noun","az":"Avtokratiya / Təkhakimiyyətlilik","definition":"System of government by one person with absolute power","example":"Rule of law and civil liberties stand as the ultimate shield against autocracy.","exampleAz":"Qanunun aliliyi və vətəndaş azadlıqları avtokratiyaya qarşı əsas qalxandır."},{"id":1958,"day":131,"indexInDay":8,"word":"Pluralism","phonetic":"/ˈplʊə.rəl.ɪ.zəm/","pos":"noun","az":"Plüralizm / Fikir müxtəlifliyi","definition":"Condition in which two or more states, groups, or sources coexist","example":"Cultural pluralism enriches national harmony and intellectual vigor.","exampleAz":"Mədəni plüralizm milli həmrəyliyi və intellektual zənginliyi artırır."},{"id":1959,"day":131,"indexInDay":9,"word":"Lobbying","phonetic":"/ˈlɒb.i.ɪŋ/","pos":"noun","az":"Lobbiçilik","definition":"Seeking to influence politicians on an issue","example":"Strict transparency regulations govern corporate political lobbying.","exampleAz":"Sərt şəffaflıq qaydaları korporativ siyasi lobbiçiliyi tənzimləyir."},{"id":1960,"day":131,"indexInDay":10,"word":"Referendum","phonetic":"/ˌref.əˈren.dəm/","pos":"noun","az":"Referendum / Ümumxalq səsverməsi","definition":"General vote by electorate on a single political question","example":"The historic referendum endorsed the constitutional amendment.","exampleAz":"Tarixi referendum konstitusiya dəyişikliyini təsdiqlədi."},{"id":1961,"day":131,"indexInDay":11,"word":"Civil society","phonetic":"/ˌsɪv.əl səˈsaɪ.ə.ti/","pos":"noun","az":"Vətəndaş cəmiyyəti","definition":"Society considered as a community of citizens linked by common interests","example":"A vibrant civil society holds administrative power accountable.","exampleAz":"Canlı vətəndaş cəmiyyəti idarəetmə hakimiyyətini hesabatlı saxlayır."},{"id":1962,"day":131,"indexInDay":12,"word":"Ideology","phonetic":"/ˌaɪ.diˈɒl.ə.dʒi/","pos":"noun","az":"İdeologiya","definition":"System of ideas and ideals forming basis of economic or political theory","example":"Humanism is a noble ideology centering universal human dignity.","exampleAz":"Humanizm universal insan ləyaqətini ucaldan ali ideologiyadır."},{"id":1963,"day":131,"indexInDay":13,"word":"Mandate","phonetic":"/ˈmæn.deɪt/","pos":"noun","az":"Mandat / Səlahiyyət","definition":"Official order or commission to do something; authority conferred by election","example":"The newly elected government carries an unambiguous civic mandate.","exampleAz":"Yeni seçilmiş hökumət birmənalı xalq mandatı daşıyır."},{"id":1964,"day":131,"indexInDay":14,"word":"Sanction","phonetic":"/ˈsæŋk.ʃən/","pos":"verb","az":"Sanksiya tətbiq etmək / Rəsmi icazə vermək","definition":"Give official permission; or impose a penalty on","example":"International bodies sanction violations of maritime law.","exampleAz":"Beynəlxalq qurumlar dəniz hüququnun pozulmasına sanksiya tətbiq edirlər."},{"id":1965,"day":131,"indexInDay":15,"word":"Demagogue","phonetic":"/ˈdem.ə.ɡɒɡ/","pos":"noun","az":"Demaqoq / Kütləni aldadan siyasətçi","definition":"Political leader seeking support by appealing to desires rather than reason","example":"Responsible journalism exposes the shallow fallacies of demagogues.","exampleAz":"Məsuliyyətli jurnalistika demaqoqların dayaz yalanlarını ifşa edir."}]},{"day":132,"level":"C1","theme":"Constitutional & Human Rights","themeAz":"Konstitusiya və İnsan Hüquqları","wordCount":15,"words":[{"id":1966,"day":132,"indexInDay":1,"word":"Inalienable","phonetic":"/ɪnˈeɪ.li.ə.nə.bəl/","pos":"adj","az":"Ayrılmaz / Toxunulmaz","definition":"Unable to be taken away from or given away by the possessor","example":"Freedom of conscience is an inalienable human birthright.","exampleAz":"Vicdan azadlığı hər bir insanın anadangəlmə ayrılmaz hüququdur."},{"id":1967,"day":132,"indexInDay":2,"word":"Jurisprudence","phonetic":"/ˌdʒʊə.rɪsˈpruː.dəns/","pos":"noun","az":"Hüquqşünaslıq / Hüquq nəzəriyyəsi","definition":"Theory or philosophy of law; legal system","example":"Constitutional jurisprudence safeguards minority protections.","exampleAz":"Konstitusiya hüquqşünaslığı azlıqların hüquqlarını qoruyur."},{"id":1968,"day":132,"indexInDay":3,"word":"Due process","phonetic":"/ˌdjuː ˈprəʊ.ses/","pos":"noun","az":"Ədalətli məhkəmə araşdırması","definition":"Fair treatment through normal judicial system, especially citizens’ entitlement","example":"Due process guarantees a fair and impartial public trial.","exampleAz":"Ədalətli məhkəmə araşdırması qərəzsiz açıq dinləməyə zəmanət verir."},{"id":1969,"day":132,"indexInDay":4,"word":"Habeas corpus","phonetic":"/ˌheɪ.bi.əs ˈkɔː.pəs/","pos":"noun","az":"Qanunsuz həbsdən qorunma hüququ","definition":"Writ requiring a person under arrest to be brought before a judge","example":"Habeas corpus protects individuals from unlawful detention.","exampleAz":"Habeas corpus vətəndaşları qanunsuz həbsdən qoruyan ən mühüm hüquqdur."},{"id":1970,"day":132,"indexInDay":5,"word":"Precedent","phonetic":"/ˈpres.ɪ.dənt/","pos":"noun","az":"Presedent / Əvvəlki nümunə","definition":"Earlier event or action regarded as an example in subsequent circumstances","example":"The Supreme Court ruling set an enduring legal precedent.","exampleAz":"Ali Məhkəmənin qərarı daimi hüquqi presedent yaratdı."},{"id":1971,"day":132,"indexInDay":6,"word":"Ratify","phonetic":"/ˈræt.ɪ.faɪ/","pos":"verb","az":"Ratififikasiya etmək / Təsdiqləmək","definition":"Sign or give formal consent to a treaty, contract, or agreement","example":"Parliament voted to ratify the international human rights pact.","exampleAz":"Parlament beynəlxalq insan hüquqları paktını ratifikasiya etdi."},{"id":1972,"day":132,"indexInDay":7,"word":"Arbitrary","phonetic":"/ˈɑː.bɪ.trər.i/","pos":"adj","az":"Özbəşına / İxtiyari","definition":"Based on random choice or personal whim, rather than any reason","example":"The constitution forbids arbitrary deprivation of personal property.","exampleAz":"Konstitusiya şəxsi mülkiyyətin özbaşına əlindən alınmasını qadağan edir."},{"id":1973,"day":132,"indexInDay":8,"word":"Asylum","phonetic":"/əˈsaɪ.ləm/","pos":"noun","az":"Siyasi sığınacaq","definition":"Protection granted by a state to someone who has left their home country","example":"The nation offered political asylum to persecuted scholars.","exampleAz":"Ölkə təqib olunan alimlərə siyasi sığınacaq təqdim etdi."},{"id":1974,"day":132,"indexInDay":9,"word":"Subjugation","phonetic":"/ˌsʌb.dʒʊˈɡeɪ.ʃən/","pos":"noun","az":"Tabe etmə / Əsarət","definition":"Action of bringing someone or something under domination or control","example":"Human history records an unrelenting struggle against subjugation.","exampleAz":"Bəşər tarixi əsarətə qarşı amansız azadlıq mübarizəsini qeyd edir."},{"id":1975,"day":132,"indexInDay":10,"word":"Sanctity","phonetic":"/ˈsæŋk.tə.ti/","pos":"noun","az":"Müqəddəslik / Toxunulmazlıq","definition":"State or quality of being holy, sacred, or inviolable","example":"Law enshrines the sacred sanctity of human life.","exampleAz":"Qanun insan həyatının müqəddəs toxunulmazlığını təsbit edir."},{"id":1976,"day":132,"indexInDay":11,"word":"Amnesty","phonetic":"/ˈæm.nə.sti/","pos":"noun","az":"Amnistiya / Əfv","definition":"Official pardon for people who have been convicted of political offenses","example":"The state issued an executive amnesty restoring civic rights.","exampleAz":"Dövlət vətəndaş hüquqlarını bərpa edən əfv fərmanı imzaladı."},{"id":1977,"day":132,"indexInDay":12,"word":"Tribunal","phonetic":"/traɪˈbjuː.nəl/","pos":"noun","az":"Tribunal / Beynəlxalq məhkəmə","definition":"Court of justice convened for particular purpose","example":"The war crimes tribunal prosecuted crimes against humanity.","exampleAz":"Hərbi cinayətlər tribunali bəşəriyyətə qarşı cinayətləri mühakimə etdi."},{"id":1978,"day":132,"indexInDay":13,"word":"Liberty","phonetic":"/ˈlɪb.ə.ti/","pos":"noun","az":"Azadlıq","definition":"Power or scope to act as one pleases without oppressive restraint","example":"Civic liberty thrives where knowledge is universal.","exampleAz":"Biliyin hamı üçün əlçatan olduğu yerdə vətəndaş azadlığı çiçəklənir."},{"id":1979,"day":132,"indexInDay":14,"word":"Enfranchise","phonetic":"/ɪnˈfræn.tʃaɪz/","pos":"verb","az":"Səsvermə hüququ vermək","definition":"Give the right to vote to people","example":"The 1918 Azerbaijan Republic was among the first to enfranchise women.","exampleAz":"1918-ci il Azərbaycan Cümhuriyyəti qadınlara səsvermə hüququ verən ilk dövlətlərdəndir."},{"id":1980,"day":132,"indexInDay":15,"word":"Inviolable","phonetic":"/ɪnˈvaɪ.ə.lə.bəl/","pos":"adj","az":"Toxunulmaz","definition":"Never to be broken, infringed, or dishonored","example":"Human dignity is an inviolable constitutional principle.","exampleAz":"İnsan ləyaqəti toxunulmaz bir konstitusiya prinsipidir."}]},{"day":133,"level":"C1","theme":"Macroeconomics & Fiscal Policy","themeAz":"Makroiqtisadiyyat və Fiskal Siyasət","wordCount":15,"words":[{"id":1981,"day":133,"indexInDay":1,"word":"Macroeconomics","phonetic":"/ˌmæk.rəʊ.iː.kəˈnɒm.ɪks/","pos":"noun","az":"Makroiqtisadiyyat","definition":"Branch of economics concerned with large-scale or general factors","example":"Macroeconomics analyzes inflation, national income, and employment.","exampleAz":"Makroiqtisadiyyat inflyasiyanı, milli gəliri və məşğulluğu təhlil edir."},{"id":1982,"day":133,"indexInDay":2,"word":"Liquidity","phonetic":"/lɪˈkwɪd.ə.ti/","pos":"noun","az":"Likvidlik / Sərbəst nağd vəsait","definition":"Availability of liquid assets to a market or company","example":"Central banks injected liquidity to stabilize credit markets.","exampleAz":"Mərkəzi banklar kredit bazarlarını sabitləşdirmək üçün likvidlik təmin etdilər."},{"id":1983,"day":133,"indexInDay":3,"word":"Austerity","phonetic":"/ɒsˈter.ə.ti/","pos":"noun","az":"Sərt qənaət rejimi","definition":"Difficult economic conditions created by government measures to reduce deficit","example":"Severe budget austerity depressed public infrastructure investments.","exampleAz":"Sərt büdcə qənaəti ictimai infrastruktur sərmayələrini azaltdı."},{"id":1984,"day":133,"indexInDay":4,"word":"Stagflation","phonetic":"/stæɡˈfleɪ.ʃən/","pos":"noun","az":"Staqflyasiya / Durğunluqla yanaşı inflyasiya","definition":"Persistent high inflation combined with high unemployment and stagnant demand","example":"Economists devise delicate strategies to conquer stagflation.","exampleAz":"İqtisadçılar staqflyasiyaya qalib gəlmək üçün zərif strategiyalar qururlar."},{"id":1985,"day":133,"indexInDay":5,"word":"Subsidize","phonetic":"/ˈsʌb.sɪ.daɪz/","pos":"verb","az":"Subsidiyalaşdırmaq / Maliyyə dəstəyi vermək","definition":"Support an organization or activity financially","example":"Governments subsidize clean solar farms to accelerate adoption.","exampleAz":"Hökumətlər günəş stansiyalarını təşviq etmək üçün subsidiyalar ayırırlar."},{"id":1986,"day":133,"indexInDay":6,"word":"Solvency","phonetic":"/ˈsɒl.vən.si/","pos":"noun","az":"Ödəniş qabiliyyəti","definition":"Possession of assets in excess of liabilities; ability to pay debts","example":"The bank’s robust capital ratio guarantees long-term solvency.","exampleAz":"Bankın güclü kapital nisbəti uzunmüddətli ödəniş qabiliyyətinə zəmanət verir."},{"id":1987,"day":133,"indexInDay":7,"word":"Equilibrium","phonetic":"/ˌiː.kwɪˈlɪb.ri.əm/","pos":"noun","az":"Bazar tarazlığı","definition":"State in which economic forces such as supply and demand are balanced","example":"Market equilibrium determines the clearing price of commodities.","exampleAz":"Bazar tarazlığı əmtəələrin optimal satış qiymətini müəyyən edir."},{"id":1988,"day":133,"indexInDay":8,"word":"Remittance","phonetic":"/rɪˈmɪt.əns/","pos":"noun","az":"Pul köçürməsi (xaricdən)","definition":"Sum of money sent in payment or as a gift back home","example":"Remittances from diaspora communities support regional households.","exampleAz":"Xaricdəki həmvətənlərin göndərdiyi pul köçürmələri ailələrə dəstək olur."},{"id":1989,"day":133,"indexInDay":9,"word":"Aggregate","phonetic":"/ˈæɡ.rɪ.ɡət/","pos":"adj","az":"Məcmu / Ümumi","definition":"Formed or calculated by the combination of many separate units","example":"Aggregate domestic demand rose four percent over the quarter.","exampleAz":"Rüb ərzində məcmu daxili tələbat dörd faiz artdı."},{"id":1990,"day":133,"indexInDay":10,"word":"Depreciation","phonetic":"/dɪˌpriː.ʃiˈeɪ.ʃən/","pos":"noun","az":"Amortizasiya / Qiymətdən düşmə","definition":"Reduction in the value of an asset over time","example":"Accountants calculate linear depreciation of manufacturing equipment.","exampleAz":"Mühasiblər istehsalat avadanlığının xətti amortizasiyasını hesablayırlar."},{"id":1991,"day":133,"indexInDay":11,"word":"Sovereign","phonetic":"/ˈsɒv.rɪn/","pos":"adj","az":"Dövlət / Suveren","definition":"Possessing supreme power; relating to state fund","example":"The State Oil Fund of Azerbaijan manages sovereign wealth assets.","exampleAz":"Azərbaycan Respublikası Dövlət Neft Fondu suveren sərvət aktivlərini idarə edir."},{"id":1992,"day":133,"indexInDay":12,"word":"Leverage","phonetic":"/ˈliː.vər.ɪdʒ/","pos":"noun","az":"Kredit rıçaqı / Borclanma","definition":"Ratio of a company’s loan capital to the value of its ordinary shares","example":"Excessive corporate leverage compounds financial fragility during recessions.","exampleAz":"Həddindən artıq borclanma böhranlar zamanı maliyyə zəifliyini artırır."},{"id":1993,"day":133,"indexInDay":13,"word":"Quantitative","phonetic":"/ˈkwɒn.tɪ.tə.tɪv/","pos":"adj","az":"Kəmiyyətə aid","definition":"Relating to, measuring, or measured by the quantity of something","example":"Central banks employed quantitative easing to stimulate investment.","exampleAz":"Mərkəzi banklar sərmayələri təşviq etmək üçün kəmiyyət yumşalmasından istifadə etdilər."},{"id":1994,"day":133,"indexInDay":14,"word":"Sanction","phonetic":"/ˈsæŋk.ʃən/","pos":"noun","az":"İqtisadi sanksiya","definition":"Punitive economic measures against a state","example":"Targeted economic sanctions constrain hostile belligerence.","exampleAz":"Hədəfli iqtisadi sanksiyalar təcavüzkar hərəkətləri məhdudlaşdırır."},{"id":1995,"day":133,"indexInDay":15,"word":"Monopolize","phonetic":"/məˈnɒp.əl.aɪz/","pos":"verb","az":"Monopoliya yaratmaq / İnhisara almaq","definition":"Obtain exclusive possession or control of a trade or service","example":"Antitrust laws prevent tech giants from monopolizing digital markets.","exampleAz":"Antimonopoliya qanunları rəqəmsal bazarların inhisara alınmasının qarşısını alır."}]},{"day":134,"level":"C1","theme":"Corporate Governance & Integrity","themeAz":"Korporativ İdarəetmə və Dürüstlük","wordCount":15,"words":[{"id":1996,"day":134,"indexInDay":1,"word":"Fiduciary","phonetic":"/fɪˈdjuː.ʃi.ri/","pos":"adj","az":"Etibara əsaslanan / Qəyyumluq məsuliyyəti","definition":"Involving trust, especially regarding the relationship between trustee and beneficiary","example":"Directors hold a strict fiduciary duty toward shareholders.","exampleAz":"Direktorlar səhmdarlar qarşısında sərt qəyyumluq və etibar məsuliyyəti daşıyırlar."},{"id":1997,"day":134,"indexInDay":2,"word":"Whistleblower","phonetic":"/ˈwɪs.əlˌbləʊ.ər/","pos":"noun","az":"Məlumat sızdıran / Qanunsuzluğu ifşa edən","definition":"Person who informs on a person or organization engaged in unlawful activity","example":"Protective statutes shield internal corporate whistleblowers.","exampleAz":"Xüsusi qanunlar qanunsuzluqları ifşa edən vicdanlı əməkdaşları qoruyur."},{"id":1998,"day":134,"indexInDay":3,"word":"Embezzlement","phonetic":"/ɪmˈbez.əl.mənt/","pos":"noun","az":"Mənimsəmə / İsrafçılıqla oğurlama","definition":"Theft or misappropriation of funds placed in one’s trust","example":"Internal auditors uncovered executive embezzlement of grants.","exampleAz":"Daxili auditorlar qrantların rəhbərlik tərəfindən mənimsənilməsini üzə çıxardılar."},{"id":1999,"day":134,"indexInDay":4,"word":"Transparency","phonetic":"/trænˈspær.ən.si/","pos":"noun","az":"Şəffaflıq","definition":"Condition of operating openly and without concealed agenda","example":"Radical financial transparency eliminates corporate corruption.","exampleAz":"Tam maliyyə şəffaflığı korporativ korrupsiyanı kökündən yox edir."},{"id": "words":[{"id":2011,"day":135,"indexInDay":1,"word":"Paradigm","phonetic":"/ˈpær.ə.daɪm/","pos":"noun","az":"Paradiqma / Elmi model","definition":"Worldview or conceptual framework underlying the theories of science","example":"Quantum mechanics ushered in an unprecedented physics paradigm.","exampleAz":"Kvant mexanikası fizikada görünməmiş yeni paradiqma açdı."},{"id":2012,"day":135,"indexInDay":2,"word":"Synthesis","phonetic":"/ˈsɪn.θə.sɪs/","pos":"noun","az":"Sintez / Vahid nəzəriyyə","definition":"Combination of components or elements to form a connected whole","example":"The modern evolutionary synthesis united genetics with paleontology.","exampleAz":"Müasir təkamül sintezi genetika ilə paleontologiyanı birləşdirdi."},{"id":2013,"day":135,"indexInDay":3,"word":"Empirical","phonetic":"/ɪmˈpɪr.ɪ.kəl/","pos":"adj","az":"Empirik / Təcrübəyə əsaslanan","definition":"Based on, concerned with, or verifiable by observation or experience","example":"Empirical validation separates genuine science from metaphysical fantasy.","exampleAz":"Empirik təsdiq həqiqi elmi metafizik xəyallardan fərqləndirir."},{"id":2014,"day":135,"indexInDay":4,"word":"Anomalous","phonetic":"/əˈnɒm.ə.ləs/","pos":"adj","az":"Anomal / Qanunauyğunluqdan kənar","definition":"Deviating from what is standard, normal, or expected","example":"Anomalous radiation readings led to the discovery of cosmic rays.","exampleAz":"Anomal radiasiya göstəriciləri kosmik şüaların kəşfinə yol açdı."},{"id":2015,"day":135,"indexInDay":5,"word":"Inductive","phonetic":"/ɪnˈdʌk.tɪv/","pos":"adj","az":"İnduktiv / Təcrübədən ümumiyə gedən","definition":"Characterized by the inference of general laws from instances","example":"Inductive reasoning builds scientific principles from laboratory datasets.","exampleAz":"İnduktiv mühakimə laboratoriya məlumatlarından elmi prinsiplər hasil edir."},{"id":2016,"day":135,"indexInDay":6,"word":"Deductive","phonetic":"/dɪˈdʌk.tɪv/","pos":"adj","az":"Deduktiv / Ümumidən xüsusiyə çıxarıla
