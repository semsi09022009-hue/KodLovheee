 atmosferini qızdırır."},{"id":2032,"day":136,"indexInDay":7,"word":"Biosphere","phonetic":"/ˈbaɪ.əʊ.sfɪər/","pos":"noun","az":"Biosfer / Canlılar aləmi","definition":"Regions of surface, atmosphere, and hydrosphere occupied by life","example":"Humans hold moral stewardship over the living biosphere.","exampleAz":"İnsanlar canlı biosfer üzərində əxlaqi qayğı və məsuliyyət daşıyırlar."},{"id":2033,"day":136,"indexInDay":8,"word":"Sanctuary","phonetic":"/ˈsæŋk.tʃʊə.ri/","pos":"noun","az":"Qoruq / Sığınacaq","definition":"Nature reserve where animals or birds are sheltered","example":"The wildlife sanctuary safeguards endangered Caucasian leopards.","exampleAz":"Vəhşi təbiət qoruğu nəsli kəsilməkdə olan Qafqaz bəbirlərini mühafizə edir."},{"id":2034,"day":136,"indexInDay":9,"word":"Poaching","phonetic":"/ˈpəʊ.tʃɪŋ/","pos":"noun","az":"Brakonyerlik / Qanunsuz ov","definition":"Illegal practice of trespassing on another’s property to hunt animals","example":"Strict ranger patrols extinguished illegal poaching in reserves.","exampleAz":"Sərt mühafizə reydləri qoruqlarda qanunsuz ovun qarşısını aldı."},{"id":2035,"day":136,"indexInDay":10,"word":"Ecosystem","phonetic":"/ˈiː.kəʊˌsɪs.təm/","pos":"noun","az":"Ekosistem","definition":"Biological community of interacting organisms and physical environment","example":"A mangrove ecosystem shields coastal villages from tidal storms.","exampleAz":"Manqrov ekosistemi sahil kəndlərini fırtına dalğalarından qoruyur."},{"id":2036,"day":136,"indexInDay":11,"word":"Regenerative","phonetic":"/rɪˈdʒen.ər.ə.tɪv/","pos":"adj","az":"Bərpaedici / Yeniləyici","definition":"Able to or serving to heal or regenerate natural balance","example":"Regenerative agriculture replenishes exhausted topsoils.","exampleAz":"Bərpaedici kənd təsərrüfatı yorulmuş torpaqları yenidən canlandırır."},{"id":2037,"day":136,"indexInDay":12,"word":"Acidification","phonetic":"/əˌsɪd.ɪ.fɪˈkeɪ.ʃən/","pos":"noun","az":"Turşulaşma","definition":"Process of becoming acid, especially oceanic absorption of CO2","example":"Ocean acidification dissolves delicate microscopic marine shells.","exampleAz":"Okeanların turşulaşması zərif dəniz qabıqlılarını məhv edir."},{"id":2038,"day":136,"indexInDay":13,"word":"Extinction","phonetic":"/ɪkˈstɪŋk.ʃən/","pos":"noun","az":"Nəslin kəsilməsi","definition":"State or process of a species being or becoming extinct","example":"Conservation initiatives rescued the Caspian seal from extinction.","exampleAz":"Mühafizə tədbirləri Xəzər suitisini nəsli kəsilməkdən xilas etdi."},{"id":2039,"day":136,"indexInDay":14,"word":"Equilibrium","phonetic":"/ˌiː.kwɪˈlɪb.ri.əm/","pos":"noun","az":"Təbii müvazinət","definition":"State in which opposing ecological influences are balanced","example":"Predators sustain ecological equilibrium in mountain ranges.","exampleAz":"Yırtıcı heyvanlar dağlarda təbii ekoloji müvazinəti saxlayırlar."},{"id":2040,"day":136,"indexInDay":15,"word":"Pristine","phonetic":"/ˈprɪs.tiːn/","pos":"adj","az":"Toxunulmamış / Saf / Təbii","definition":"In its original condition; unspoiled and clean","example":"Alpine springs provide pristine, mineral-rich drinking water.","exampleAz":"Alp bulaqları toxunulmamış, minerallarla zəngin saf su bəxş edir."}]},{"day":137,"level":"C1","theme":"Aesthetic Criticism & Literary Analysis","themeAz":"Estetik Tənqid və Ədəbi Təhlil","wordCount":15,"words":[{"id":2041,"day":137,"indexInDay":1,"word":"Allegory","phonetic":"/ˈæl.ə.ɡər.i/","pos":"noun","az":"Alleqoriya / Məcazlı hekayət","definition":"Story, poem, or picture that can be interpreted to reveal a hidden meaning","example":"Nizami’s Haft Paykar is an intricate astrological allegory.","exampleAz":"Nizaminin \"Yeddi Gözəl\" əsəri mürəkkəb bir astroloji alleqoriyadır."},{"id":2042,"day":137,"indexInDay":2,"word":"Motif","phonetic":"/məʊˈtiːf/","pos":"noun","az":"Motiv / Təkrarlanan bədii mövzu","definition":"Decorative design or recurring thematic element in artistic work","example":"The buta motif recurs throughout Azerbaijani carpet weaving.","exampleAz":"Buta motivi Azərbaycan xalçaçılığında təkrarlanan əsas bədii mövzudur."},{"id":2043,"day":137,"indexInDay":3,"word":"Sublime","phonetic":"/səˈblaɪm/","pos":"adj","az":"Uca / Heyranedici / Ali","definition":"Of such excellence, grandeur, or beauty as to inspire great awe","example":"Fuzuli’s Ghazals evoke the sublime yearning of mystical love.","exampleAz":"Füzulinin qəzəlləri ilahi eşqin uca və həzin yanğısını tərənnüm edir."},{"id":2044,"day":137,"indexInDay":4,"word":"Juxtaposition","phonetic":"/ˌdʒʌk.stə.pəˈzɪʃ.ən/","pos":"noun","az":"Təzadlı qarşılaşdırma / Yan-yana qoyma","definition":"Fact of two things being seen or placed close together with contrasting effect","example":"The stark juxtaposition of ancient minarets and glass towers captivates.","exampleAz":"Qədim minarələrlə şüşə göydələnlərin təzadlı qarşılaşdırılması insanı valeh edir."},{"id":2045,"day":137,"indexInDay":5,"word":"Tone","phonetic":"/təʊn/","pos":"noun","az":"Bədii ton / İntonasiya","definition":"General character or attitude of a piece of literary writing","example":"The author’s elegiac tone mourns the passage of idyllic youth.","exampleAz":"Müəllifin elegik və həzin tonu gəncliyin ötüşünə kədərlənir."},{"id":2046,"day":137,"indexInDay":6,"word":"Allusion","phonetic":"/əˈluː.ʒən/","pos":"noun","az":"Allüziya / Tarixi-ədəbi işarə","definition":"Expression designed to call something to mind without mentioning explicitly","example":"The poem features rich biblical and Quranic mythological allusions.","exampleAz":"Şeirdə zəngin tarixi və dini allüziyalardan istifadə olunmuşdur."},{"id":2047,"day":137,"indexInDay":7,"word":"Catharsis","phonetic":"/kəˈθɑː.sɪs/","pos":"noun","az":"Katarsis / Mənəvi arınma","definition":"Process of releasing, and thereby providing relief from, strong emotions","example":"Tragic drama evokes emotional catharsis through sorrow and awe.","exampleAz":"Faciəli dram kədər və heyrət hissi vasitəsilə mənəvi arınma bəxş edir."},{"id":2048,"day":137,"indexInDay":8,"word":"Irony","phonetic":"/ˈaɪ.rə.ni/","pos":"noun","az":"Bədii ironiya / Kinayə","definition":"Expression of meaning through language that signifies opposite","example":"Dramatic irony intensifies spectator empathy during the play.","exampleAz":"Dramatik ironiya tamaşa boyu tamaşaçının qəhrəmana şəfqətini artırır."},{"id":2049,"day":137,"indexInDay":9,"word":"Prose","phonetic":"/prəʊz/","pos":"noun","az":"Nəsr","definition":"Written or spoken language in its ordinary form, without metrical structure","example":"Mirza Fatali Akhundov pioneered modern Azerbaijani prose comedy.","exampleAz":"Mirzə Fətəli Axundov müasir Azərbaycan nəsri və komediyasının banisidir."},{"id":2050,"day":137,"indexInDay":10,"word":"Diction","phonetic":"/ˈdɪk.ʃən/","pos":"noun","az":"Nitq üslubu / Söz seçimi","definition":"Style of enunciation in speaking or singing; choice of words","example":"Elevated poetic diction ennobles classical epic romances.","exampleAz":"Uca poetik söz seçimi klassik qəhrəmanlıq dastanlarını şərəfləndirir."},{"id":2051,"day":137,"indexInDay":11,"word":"Archetype","phonetic":"/ˈɑː.kɪ.taɪp/","pos":"noun","az":"Arxetip / Əbədi ilkin obraz","definition":"Very typical example of a certain person or thing; recurring symbol","example":"The wise wandering elder is a universal folklore archetype.","exampleAz":"Müdrik dərviş baba universal folklor arxetipidir."},{"id":2052,"day":137,"indexInDay":12,"word":"Protagonist","phonetic":"/prəˈtæɡ.ən.ɪst/","pos":"noun","az":"Baş qəhrəman","definition":"Leading character or one of major characters in a drama or novel","example":"The noble protagonist struggled heroically against systemic tyranny.","exampleAz":"Alicənab baş qəhrəman sistemli zülmə qarşı qəhrəmancasına vuruşdu."},{"id":2053,"day":137,"indexInDay":13,"word":"Antagonist","phonetic":"/ænˈtæɡ.ən.ɪst/","pos":"noun","az":"Əks qəhrəman / Rəqib","definition":"Person who actively opposes or is hostile to someone; adversary","example":"A nuanced antagonist possesses compelling, tragic inner motives.","exampleAz":"Mürəkkəb əks qəhrəmanın özünəməxsus təsirli və faciəvi daxili səbəbləri olur."},{"id":2054,"day":137,"indexInDay":14,"word":"Denouement","phonetic":"/deɪˈnuː.mɒ̃/","pos":"noun","az":"Bədii sonluq / Düyünün açılması","definition":"Final part of a play, film, or narrative in which strands of plot are drawn together","example":"The unexpected denouement left theatergoers pondering for days.","exampleAz":"Gözlənilməz sonluq teatrsevərləri günlərlə dərin düşüncələrə qərq etdi."},{"id":2055,"day":137,"indexInDay":15,"word":"Aesthetics","phonetic":"/esˈθet.ɪks/","pos":"noun","az":"Estetika / Gözəllik fəlsəfəsi","definition":"Set of principles concerned with the nature and appreciation of beauty","example":"Eastern aesthetics harmonizes spiritual contemplation with geometrical symmetry.","exampleAz":"Şərq estetikası mənəvi düşüncəni həndəsi simmetriya ilə birləşdirir."}]},{"day":138,"level":"C1","theme":"Historical Analysis & Historiography","themeAz":"Tarixi Təhlil və Tarixşünaslıq","wordCount":15,"words":[{"id":2056,"day":138,"indexInDay":1,"word":"Historiography","phonetic":"/hɪˌstɒr.iˈɒɡ.rə.fi/","pos":"noun","az":"Tarixşünaslıq","definition":"Study of the methods of historians in developing history as discipline","example":"Historiography scrutinizes how chronicles reflect ruling dynasties.","exampleAz":"Tarixşünaslıq salnamələrin hakim sülalələri necə əks etdirdiyini təhlil edir."},{"id":2057,"day":138,"indexInDay":2,"word":"Chronicle","phonetic":"/ˈkrɒn.ɪ.kəl/","pos":"noun","az":"Salnamə / Tarixi xronika","definition":"Factual written account of important or historical events in order of time","example":"Medieval chronicles narrate the heroic campaigns of Babak.","exampleAz":"Orta əsr salnamələri Babəkin qəhrəmanlıq yürüşlərini nəql edir."},{"id":2058,"day":138,"indexInDay":3,"word":"Epoch","phonetic":"/ˈiː.pɒk/","pos":"noun","az":"Dövr / Epoxa","definition":"Particular period of time in history or a person’s life","example":"The Renaissance was an epoch of scientific rebirth and artistic glory.","exampleAz":"Renessans elmi dirçəliş və bədii şöhrət dövrü idi."},{"id":2059,"day":138,"indexInDay":4,"word":"Anachronism","phonetic":"/əˈnæk.rə.nɪ.zəm/","pos":"noun","az":"Xronoloji uyğunsuzluq / Anakronizm","definition":"Thing belonging or appropriate to a period other than that in which it exists","example":"Portraying firearms in medieval antiquity is a glaring anachronism.","exampleAz":"Orta əsr qədimliyində odlu silahlar təsvir etmək açıq bir anakronizmdir."},{"id":2060,"day":138,"indexInDay":5,"word":"Manuscript","phonetic":"/ˈmæn.jə.skrɪpt/","pos":"noun","az":"Əlyazma","definition":"Book, document, or piece of music written by hand rather than typed","example":"The Institute of Manuscripts in Baku preserves illuminated codices.","exampleAz":"Bakıdakı Əlyazmalar İnstitutu miniatürlü qədim əlyazmaları qoruyur."},{"id":2061,"day":138,"indexInDay":6,"word":"Dynasty","phonetic":"/ˈdɪn.ə.sti/","pos":"noun","az":"Sülalə","definition":"Line of hereditary rulers of a country","example":"The Safavid dynasty united vast territories under centralized governance.","exampleAz":"Səfəvilər sülaləsi geniş əraziləri mərkəzləşdirilmiş idarəetmədə birləşdirdi."},{"id":2062,"day":138,"indexInDay":7,"word":"Artifact","phonetic":"/ˈɑː.tɪ.fækt/","pos":"noun","az":"Maddi mədəniyyət abidəsi / Artefakt","definition":"Object made by a human being, typically an item of cultural interest","example":"Obsidian arrowheads are stone-age artifacts unearthed in Gobustan.","exampleAz":"Obsidian ox ucları Qobustanda tapılmış daş dövrü artefaktlarıdır."},{"id":2063,"day":138,"indexInDay":8,"word":"Excavation","phonetic":"/ˌek.skəˈveɪ.ʃən/","pos":"noun","az":"Arxeoloji qazıntı","definition":"Action of excavating something, especially an archaeological site","example":"Archaeological excavation in Gabala revealed Hellenistic ruins.","exampleAz":"Qəbələdəki arxeoloji qazıntılar ellinist dövrün xarabalıqlarını üzə çıxardı."},{"id":2064,"day":138,"indexInDay":9,"word":"Archive","phonetic":"/ˈɑː.kaɪv/","pos":"noun","az":"Arxiv","definition":"Collection of historical documents or records providing information","example":"National archives safeguard treaties, cartography, and decrees.","exampleAz":"Milli arxivlər müqavilələri, xəritələri və fərmanları qoruyub saxlayır."},{"id":2065,"day":138,"indexInDay":10,"word":"Sovereign","phonetic":"/ˈsɒv.rɪn/","pos":"noun","az":"Hökmdar / Monarx","definition":"Supreme ruler, especially a monarch","example":"Shah Ismail Khatai was an inspired poet and decisive sovereign.","exampleAz":"Şah İsmayıl Xətai ilhamlı şair və qətiyyətli hökmdar idi."},{"id":2066,"day":138,"indexInDay":11,"word":"Feudalism","phonetic":"/ˈfjuː.dəl.ɪ.zəm/","pos":"noun","az":"Feodalizm","definition":"Dominant social system in medieval Europe and Orient","example":"Agrarian land tenures defined medieval feudalism.","exampleAz":"Torpaq sahibliyi münasibətləri orta əsr feodalizmini müəyyən edirdi."},{"id":2067,"day":138,"indexInDay":12,"word":"Colonization","phonetic":"/ˌkɒl.ə.naɪˈzeɪ.ʃən/","pos":"noun","az":"Müstəmləkəçilik","definition":"Action or process of settling among and establishing control over indigenous people","example":"Decolonization restored sovereign independence across nations.","exampleAz":"Müstəmləkəsizləşmə xalqların suveren müstəqilliyini bərpa etdi."},{"id":2068,"day":138,"indexInDay":13,"word":"Antiquity","phonetic":"/ænˈtɪk.wə.ti/","pos":"noun","az":"Qədim dövr / Antik dövr","definition":"Ancient past, especially the period before the Middle Ages","example":"Caucasian Albania flourished during late classical antiquity.","exampleAz":"Qafqaz Albaniyası son antik dövrdə çiçəklənmişdir."},{"id":2069,"day":138,"indexInDay":14,"word":"Treaty","phonetic":"/ˈtriː.ti/","pos":"noun","az":"Tarixi müqavilə","definition":"Formally concluded and ratified agreement between states","example":"Historians analyze the geopolitical aftermath of the Turkmenchay treaty.","exampleAz":"Tarixçilər Türkmənçay müqaviləsinin geosiyasi nəticələrini təhlil edirlər."},{"id":2070,"day":138,"indexInDay":15,"word":"Legacy","phonetic":"/ˈleɡ.ə.si/","pos":"noun","az":"İrs / Tarixi miras","definition":"Amount of money or property left to someone; heritage of deeds","example":"The Democratic Republic of 1918 left an enduring democratic legacy.","exampleAz":"1918-ci il Xalq Cümhuriyyəti əbədi bir demokratik irs qoydu."}]},{"day":139,"level":"C1","theme":"Cognitive Neuroscience & Mind","themeAz":"Koqnitiv Neyroelm və Şüur","wordCount":15,"words":[{"id":2071,"day":139,"indexInDay":1,"word":"Neuroscience","phonetic":"/ˈnjʊə.rəʊˌsaɪ.əns/","pos":"noun","az":"Neyroelm / Sinir elmi","definition":"Scientific study of the nervous system and brain","example":"Cognitive neuroscience maps how syllables spark neural networks.","exampleAz":"Koqnitiv neyroelm hecaların neyron şəbəkələrini necə alovlandırdığını xəritələndirir."},{"id":2072,"day":139,"indexInDay":2,"word":"Neuroplasticity","phonetic":"/ˌnjʊə.rəʊ.plæsˈtɪs.ə.ti/","pos":"noun","az":"Neyroplastiklik / Beynin yenidən qurulma qabiliyyəti","definition":"Ability of the brain to form and reorganize synaptic connections","example":"Learning a second language physically enhances brain neuroplasticity.","exampleAz":"İkinci dil öyrənmək beynin neyroplastikliyini fiziki olaraq artırır."},{"id":2073,"day":139,"indexInDay":3,"word":"Synapse","phonetic":"/ˈsaɪ.næps/","pos":"noun","az":"Sinaps / Sinir uclarının birləşməsi","definition":"Junction between two nerve cells, consisting of a minute gap","example":"Spaced repetition fires synapses repeatedly, turning memory permanent.","exampleAz":"Aralıqlı təkrar sinapsları mütəmadi alovlandıraraq yaddaşı daimi edir."},{"id":2074,"day":139,"indexInDay":4,"word":"Cortex","phonetic":"/ˈkɔː.teks/","pos":"noun","az":"Beyin qabığı","definition":"Outer layer of cerebrum composed of folded gray matter","example":"The prefrontal cortex coordinates executive decision-making.","exampleAz":"Prefrontal beyin qabığı ali idarəetmə və qərar qəbulunu tənzimləyir."},{"id":2075,"day":139,"indexInDay":5,"word":"Hemisphere","phonetic":"/ˈhem.ɪ.sfɪər/","pos":"noun","az":"Beyin yarımkürəsi","definition":"Either of the two halves of the human brain","example":"Both cerebral hemispheres collaborate dynamically in speech generation.","exampleAz":"Hər iki beyin yarımkürəsi nitq hasilində dinamik əməkdaşlıq edir."},{"id":2076,"day":139,"indexInDay":6,"word":"Dopamine","phonetic":"/ˈdəʊ.pə.miːn/","pos":"noun","az":"Dofamin / Həzz və motivasiya neyrotransmitteri","definition":"Compound present in the body as a neurotransmitter","example":"Achieving your daily fifteen-word goal releases rewarding dopamine.","exampleAz":"Gündəlik 15 sözlük hədəfinizə çatmaq mükafatlandırıcı dofamin ifraz edir."},{"id":2077,"day":139,"indexInDay":7,"word":"Cognitive","phonetic":"/ˈkɒɡ.nə.tɪv/","pos":"adj","az":"İdraki / Zehni","definition":"Relating to conscious intellectual activity such as thinking or reasoning","example":"Bilingualism builds robust cognitive reserve protecting against dementia.","exampleAz":"İkidillilik zehni ehtiyatı gücləndirərək beyin qocalmasının qarşısını alır."},{"id":2078,"day":139,"indexInDay":8,"word":"Subconscious","phonetic":"/ˌsʌbˈkɒn.ʃəs/","pos":"adj","az":"Şüuraltı","definition":"Operating below the threshold of conscious perception","example":"Listening to authentic English audio trains the subconscious ear.","exampleAz":"Təbii ingilis audio dinləmələri şüuraltı qulağı tərbiyə edir."},{"id":2079,"day":139,"indexInDay":9,"word":"Stimulus","phonetic":"/ˈstɪm.jə.ləs/","pos":"noun","az":"Qıcıqlandırıcı / Siqnal","definition":"Thing that evokes a specific functional reaction in an organ","example":"Visual flashcards provide a distinct multimodal learning stimulus.","exampleAz":"Vizual kartlar fərqli çoxşaxəli öyrənmə siqnalı təqdim edir."},{"id":2080,"day":139,"indexInDay":10,"word":"Aphasia","phonetic":"/əˈfeɪ.zi.ə/","pos":"noun","az":"Afaziya / Nitq itirmə pozğunluğu","definition":"Loss of ability to understand or express speech, caused by brain damage","example":"Clinical aphasia studies uncovered Broca’s speech articulation area.","exampleAz":"Klinik afaziya tədqiqatları Broka nitq mərkəzini üzə çıxardı."},{"id":2081,"day":139,"indexInDay":11,"word":"Hippocampus","phonetic":"/ˌhɪp.əˈkæm.pəs/","pos":"noun","az":"Hippokamp / Yaddaş mərkəzi","definition":"Elongated ridges on floor of each lateral ventricle of brain, major role in memory","example":"The hippocampus consolidates short-term practice into long-term recall.","exampleAz":"Hippokamp qısamüddətli məşqi uzunmüddətli yaddaşa çevirir."},{"id":2082,"day":139,"indexInDay":12,"word":"Neurotransmitter","phonetic":"/ˌnjʊə.rəʊ.trænzˈmɪt.ər/","pos":"noun","az":"Neyrotransmitter / Kimyəvi ötürücü","definition":"Chemical substance released at the end of a nerve fiber","example":"Serotonin and acetylcholine facilitate focused mental concentration.","exampleAz":"Serotonin və asetilxolin zehni konsentrasiyanı asanlaşdırır."},{"id":2083,"day":139,"indexInDay":13,"word":"Consciousness","phonetic":"/ˈkɒn.ʃəs.nəs/","pos":"noun","az":"Şüur / Özünüdərk","definition":"State or fact of being aware of an external object or internal state","example":"Language allows human consciousness to reflect upon its own nature.","exampleAz":"Dil insan şüuruna öz mahiyyəti üzərində düşünmək imkanı verir."},{"id":2084,"day":139,"indexInDay":14,"word":"Perception","phonetic":"/pəˈsep.ʃən/","pos":"noun","az":"Sensor qavrayış","definition":"Organization, identification, and interpretation of sensory information","example":"Auditory perception differentiates minute phonemic variations.","exampleAz":"Eşitmə qavrayışı ən xırda fonetik fərqləri belə ayırd edir."},{"id":2085,"day":139,"indexInDay":15,"word":"Acuity","phonetic":"/əˈkjuː.ə.ti/","pos":"noun","az":"İtiti / Dəqiqlik","definition":"Sharpness or keenness of thought, vision, or hearing","example":"Daily mental workouts preserve youthful cognitive acuity forever.","exampleAz":"Gündəlik zehni məşqlər cavan zehni itiliyi əbədi qoruyub saxlayır."}]},{"day":140,"level":"C1","theme":"Anthropology & Cultural Evolution","themeAz":"Antropologiya və Mədəni Təkamül","wordCount":15,"words":[{"id":2086,"day":140,"indexInDay":1,"word":"Anthropology","phonetic":"/ˌæn.θrəˈpɒl.ə.dʒi/","pos":"noun","az":"Antropologiya / İnsanşünaslıq","definition":"Study of human societies, cultures, and their biological development","example":"Cultural anthropology explores kinship structures across ancient continents.","exampleAz":"Mədəni antropologiya qədim qitələrdəki qohumluq münasibətlərini tədqiq edir."},{"id":2087,"day":140,"indexInDay":2,"word":"Kinship","phonetic":"/ˈkɪn.ʃɪp/","pos":"noun","az":"Qohumluq / Doğmalıq bağları","definition":"Blood relationship; sharing of characteristics or origins","example":"Traditional Azerbaijani kinship networks provide resilient mutual social safety.","exampleAz":"Ənənəvi Azərbaycan qohumluq əlaqələri möhkəm qarşılıqlı sosial dayaq təmin edir."},{"id":2088,"day":140,"indexInDay":3,"word":"Ritual","phonetic":"/ˈrɪtʃ.u.əl/","pos":"noun","az":"Ritual / Ayin","definition":"Religious or solemn ceremony consisting of a series of actions performed according to order","example":"Jumping over holiday bonfires is a cherished Novruz ritual.","exampleAz":"Bayram tonqallarının üzərindən tullanmaq sevimli Novruz ayinidir."},{"id":2089,"day":140,"indexInDay":4,"word":"Mythology","phonetic":"/mɪˈθɒl.ə.dʒi/","pos":"noun","az":"Mifologiya / Əsatir","definition":"Collection of myths, especially one belonging to particular tradition","example":"Turkic mythology is populated by legendary wolves and sacred mountains.","exampleAz":"Türk mifologiyası əfsanəvi qurdlar və müqəddəs dağlarla zəngindir."},{"id":2090,"day":140,"indexInDay":5,"word":"Egalitarian","phonetic":"/ɪˌɡæl.ɪˈteə.ri.ən/","pos":"adj","az":"Bərabərhüquqlu / Bərabərlikçi","definition":"Believing in or based on the principle that all people are equal","example":"Hunter-gatherer bands maintained largely egalitarian social norms.","exampleAz":"Qədim ovçu-yığıcı qruplar əsasən bərabərhüquqlu sosial normaları qoruyurdular."},{"id":2091,"day":140,"indexInDay":6,"word":"Nomadic","phonetic":"/nəʊˈmæd.ɪk/","pos":"adj","az":"Köçəri","definition":"Living the life of a nomad; wandering from pasture to pasture","example":"Nomadic pastoralists moved herds between lush highlands and plains.","exampleAz":"Köçəri maldarlar sürülərini yaylaqlar və qışlaqlar arasında hərəkət etdirirdilər."},{"id":2092,"day":140,"indexInDay":7,"word":"Sedentary","phonetic":"/ˈsed.ən.tər.i/","pos":"adj","az":"Oturaq","definition":"Tending to spend much time seated; somewhat inactive, or settled","example":"The agricultural revolution transitioned humanity from wandering to sedentary life.","exampleAz":"Kənd təsərrüfatı inqilabı bəşəriyyəti köçərilikdən oturaq həyata keçirdi."},{"id":2093,"day":140,"indexInDay":8,"word":"Artifact","phonetic":"/ˈɑː.tɪ.fækt/","pos":"noun","az":"Maddi abidə / Əşya","definition":"Object made by a human being, typically of historical interest","example":"Bronze age ceramics unearthed in Nakhchivan reveal exquisite artistry.","exampleAz":"Naxçıvanda tapılan tunc dövrü keramikası nəfis sənətkarlığı üzə çıxarır."},{"id":2094,"day":140,"indexInDay":9,"word":"Folklore","phonetic":"/ˈfəʊk.lɔːr/","pos":"noun","az":"Folklor","definition":"Traditional beliefs, legends, and customs of a people passed orally","example":"Dada Gorgud epics are foundational treasures of Turkic folklore.","exampleAz":"Dədə Qorqud dastanları türk folklorunun təməl daşlarıdır."},{"id":2095,"day":140,"indexInDay":10,"word":"Linguistic","phonetic":"/lɪŋˈɡwɪs.tɪk/","pos":"adj","az":"Dilçilik / Linqvistik","definition":"Relating to language or the study of language","example":"Linguistic relativity posits that language influences world perspective.","exampleAz":"Linqvistik nisbilik nəzəriyyəsi dilin dünyagörüşünə təsir etdiyini irəli sürür."},{"id":2096,"day":140,"indexInDay":11,"word":"Ethnocentrism","phonetic":"/ˌeθ.nəʊˈsen.trɪ.zəm/","pos":"noun","az":"Etnosentrizm / Öz xalqını mərkəzə qoyma","definition":"Evaluation of other cultures according to preconceptions originating in one’s own","example":"Anthropologists cultivate cultural humility to overcome ethnocentrism.","exampleAz":"Antropoloqlar etnosentrizmə qalib gəlmək üçün mədəni təvazökarlıq aşılayırlar."},{"id":2097,"day":140,"indexInDay":12,"word":"Taboo","phonetic":"/təˈbuː/","pos":"noun","az":"Tabu / Qadağa","definition":"Social or religious custom prohibiting discussion of a practice","example":"Overcoming conversational taboos requires delicate tact.","exampleAz":"Söhbətdəki tabuları aşmaq zərif nəzakət tələb edir."},{"id":2098,"day":140,"indexInDay":13,"word":"Lineage","phonetic":"/ˈlɪn.i.ɪdʒ/","pos":"noun","az":"Şəcərə / Soy-kök","definition":"Lineal descent from an ancestor; ancestry or pedigree","example":"Ancient genealogies traced noble lineage back ten generations.","exampleAz":"Qədim nəsil şəcərələri əsilzadə kökünü on nəsil geriyə qədər izləyirdi."},{"id":2099,"day":140,"indexInDay":14,"word":"Acculturation","phonetic":"/əˌkʌl.tʃəˈreɪ.ʃən/","pos":"noun","az":"Mədəniyyətlərin qovuşması / Uyğunlaşma","definition":"Assimilation to a different culture, typically dominant one","example":"Bilingual communities demonstrate fluid, harmonious acculturation.","exampleAz":"İkidilli icmalar axıcı və həmahəng mədəni uyğunlaşma nümayiş etdirirlər."},{"id":2100,"day":140,"indexInDay":15,"word":"Civilization","phonetic":"/ˌsɪv.əl.aɪˈzeɪ.ʃən/","pos":"noun","az":"Sivilizasiya / Mədəniyyət","definition":"Stage of human social and cultural development considered advanced","example":"Mesopotamia and the Caucasus cradle the dawn of human civilization.","exampleAz":"Mesopotamiya və Qafqaz bəşər sivilizasiyasının beşiyidir."}]},{"day":141,"level":"C1","theme":"Advanced Idioms: Fortune & Misfortune","themeAz":"Bəxt və Tale ilə Bağlı Ali İdiomlar","wordCount":15,"words":[{"id":2101,"day":141,"indexInDay":1,"word":"Silver lining","phonetic":"/ˈsɪl.vər ˌlaɪ.nɪŋ/","pos":"phrase","az":"Hər şərdə bir xeyir / Təsəlli","definition":"A sign of hope or positive aspect in an otherwise negative situation","example":"Every painful setback carries an educational silver lining.","exampleAz":"Hər bir acı məğlubiyyətin içində öyrədici bir xeyir vardır."},{"id":2102,"day":141,"indexInDay":2,"word":"Blessing in disguise","phonetic":"/ˈbles.ɪŋ ɪn dɪsˈɡaɪz/","pos":"phrase","az":"Şər görünən xeyir","definition":"Apparent misfortune that eventually results in good fortune","example":"Losing that old job proved to be a blessing in disguise.","exampleAz":"Köhnə işi itirmək sonradan böyük bir xeyirə çevrildi."},{"id":2103,"day":141,"indexInDay":3,"word":"Strike gold","phonetic":"/straɪk ɡəʊld/","pos":"phrase","az":"Bəxti gətirmək / Böyük uğur qazanmaq","definition":"Discover or attain unexpected sudden success or riches","example":"You strike gold whenever you master a core set of idioms.","exampleAz":"Əsas idiomları mənimsədikcə böyük intellektual uğur qazanırsınız."},{"id":2104,"day":141,"indexInDay":4,"word":"Against all odds","phonetic":"/əˈɡeɪnst ɔːl ɒdz/","pos":"phrase","az":"Bütün çətinliklərə baxmayaraq","definition":"Despite enormous obstacles or very low probability of success","example":"Against all odds, the self-taught student attained total fluency.","exampleAz":"Bütün çətinliklərə baxmayaraq, özü öyrənən tələbə tam sərbəstliyə çatdı."},{"id":2105,"day":141,"indexInDay":5,"word":"Down on one’s luck","phonetic":"/daʊn ɒn wʌnz lʌk/","pos":"phrase","az":"Bəxti gətirməmək / Çətin günlər keçirmək","definition":"Experiencing a period of misfortune or financial hardship","example":"Help those who are down on their luck with quiet dignity.","exampleAz":"Bəxti gətirməyən insanlara nəzakət və ləyaqətlə kömək edin."},{"id":2106,"day":141,"indexInDay":6,"word":"Windfall","phonetic":"/ˈwɪnd.fɔːl/","pos":"noun","az":"Gözlənilməz qazanc / Bəxt qisməti","definition":"Piece of unexpected good fortune, typically a large sum of money","example":"The research institute received an unexpected philanthropic windfall.","exampleAz":"Tədqiqat institutu gözlənilməz böyük xeyriyyə vəsaiti aldı."},{"id":2107,"day":141,"indexInDay":7,"word":"Touch and go","phonetic":"/tʌtʃ ænd ɡəʊ/","pos":"phrase","az":"Qeyri-müəyyən / Təhlükəli dərəcədə qərarsız","definition":"Precarious or uncertain in outcome","example":"His recovery after the emergency surgery was touch and go.","exampleAz":"Təcili əməliyyatdan sonra onun sağalması olduqca həssas və qeyri-müəyyən idi."},{"id":2108,"day":141,"indexInDay":8,"word":"Save the day","phonetic":"/seɪv ðə deɪ/","pos":"phrase","az":"Vəziyyəti xilas etmək","definition":"Find a successful solution to a problem just in time","example":"Her quick wit and clear English saved the day at the summit.","exampleAz":"Onun hazırcavablığı və aydın ingiliscəsi sammitdə vəziyyəti xilas etdi."},{"id":2109,"day":141,"indexInDay":9,"word":"At the end of one’s tether","phonetic":"/æt ðiː end ɒv wʌnz ˈteð.ər/","pos":"phrase","az":"Səbrinin son həddində olmaq","definition":"Having no patience, endurance, or resources left to cope","example":"When at the end of your tether, rest deeply and begin anew.","exampleAz":"Səbrinizin sonuna çatdıqda yaxşıca dincəlin və yenidən başlayın."},{"id":2110,"day":141,"indexInDay":10,"word":"Turn the tide","phonetic":"/tɜːn ðə taɪd/","pos":"phrase","az":"Vəziyyəti xeyrinə dəyişmək","definition":"Reverse the trend of events, especially from loss to victory","example":"Her brilliant speech turned the tide of the debate.","exampleAz":"Onun parlaq çıxışı debatın gedişatını tamamilə xeyrinə dəyişdi."},{"id":2111,"day":141,"indexInDay":11,"word":"Out of the woods","phonetic":"/aʊt ɒv ðə wʊdz/","pos":"phrase","az":"Təhlükəni arxada qoymaq","definition":"No longer in danger or dealing with difficult situation","example":"The company is not yet out of the woods financially.","exampleAz":"Şirkət maliyyə baxımından təhlükəni hələ tam arxada qoymayıb."},{"id":2112,"day":141,"indexInDay":12,"word":"In a tight spot","phonetic":"/ɪn ə taɪt spɒt/","pos":"phrase","az":"Çətin vəziyyətdə olmaq","definition":"In a difficult, perilous, or perplexing situation","example":"A calm logical mind navigates being in a tight spot.","exampleAz":"Sakit məntiqli ağıl çətin vəziyyətlərdən asanlıqla çıxır."},{"id":2113,"day":141,"indexInDay":13,"word":"Stroke of luck","phonetic":"/strəʊk ɒv lʌk/","pos":"phrase","az":"Gözlənilməz bəxt / Şans","definition":"Fortunate occurrence that happens purely by chance","example":"Meeting that mentor was an auspicious stroke of luck.","exampleAz":"Həmin mentorla rastlaşmaq möhtəşəm bir bəxt qisməti oldu."},{"id":2114,"day":141,"indexInDay":14,"word":"Weather the storm","phonetic":"/ˈweð.ər ðə stɔːm/","pos":"phrase","az":"Fırtınaya tab gətirmək / Çətinliyi adlamaq","definition":"Survive a difficult period safely","example":"Disciplined organizations weather the storm of economic cycles.","exampleAz":"İntizamlı təşkilatlar iqtisadi böhran fırtınasına tab gətirirlər."},{"id":2115,"day":141,"indexInDay":15,"word":"Count one’s blessings","phonetic":"/kaʊnt wʌnz ˈbles.ɪŋz/","pos":"phrase","az":"Şükür etmək / Nemətlərin qədrini bilmək","definition":"Be grateful for the good things in one’s life","example":"Count your blessings daily and channel gratitude into study.","exampleAz":"Hər gün nemətlərinizin qədrini bilin və şükranlığı oxumağa yönəldin."}]},{"day":142,"level":"C1","theme":"Advanced Idioms: Effort & Perseverance","themeAz":"Zəhmət və Əzmkarlıq İdiomları","wordCount":15,"words":[{"id":2116,"day":142,"indexInDay":1,"word":"Burn the candle at both ends","phonetic":"/bɜːn ðə ˈkæn.dəl æt bəʊθ endz/","pos":"phrase","az":"Özünü həddən artıq yormaq","definition":"Exhaust one’s energy by working early in morning and late at night","example":"Avoid burning the candle at both ends; consistency beats burnout.","exampleAz":"Özünüzü həddən artıq yormaqdan çəkinin; ardıcıllıq tükənməyi üstələyir."},{"id":2117,"day":142,"indexInDay":2,"word":"Go the extra mile","phonetic":"/ɡəʊ ðiː ˈek.strə maɪl/","pos":"phrase","az":"Artıqlaması ilə çalışmaq","definition":"Make a special effort to achieve something higher than required","example":"Dedicated teachers go the extra mile to illuminate concepts.","exampleAz":"Fədakar müəllimlər dərsi aydınlatmaq üçün həmişə artıqlaması ilə çalışırlar."},{"id":2118,"day":142,"indexInDay":3,"word":"Leave no stone unturned","phonetic":"/liːv nəʊ stəʊn ʌnˈtɜːnd/","pos":"phrase","az":"Hər daşın altına baxmaq / Hər vasitəyə əl atmaq","definition":"Try every possible course of action in order to find something","example":"Leave no stone unturned in deciphering classical poetry.","exampleAz":"Klassik poeziyanı dərk etmək üçün hər bir vasitəyə əl atın."},{"id":2119,"day":142,"indexInDay":4,"word":"Put one’s shoulder to the wheel","phonetic":"/pʊt wʌnz ˈʃəʊl.dər tuː ðə wiːl/","pos":"phrase","az":"Can-dillə işə girişmək","definition":"Start working very hard with determination","example":"Put your shoulder to the wheel and finish the final twenty days!","exampleAz":"Can-dillə işə girişin və son iyirmi günü fəth edin!"},{"id":2120,"day":142,"indexInDay":5,"word":"Grit one’s teeth","phonetic":"/ɡrɪt wʌnz tiːθ/","pos":"phrase","az":"Dişini qıcıyıb dözmək","definition":"Resolve to do something difficult or unpleasant courageously","example":"Grit your teeth and speak through initial pronunciation stumbles.","exampleAz":"Dişinizi qıcıyıb dözün və ilk tələffüz xətalarına baxmayaraq danışın."},{"id":2121,"day":142,"indexInDay":6,"word":"Pull one’s weight","phonetic":"/pʊl wʌnz weɪt/","pos":"phrase","az":"Öz payına düşən zəhməti çəkmək","definition":"Do one’s fair share of work in a team","example":"In high-performing software teams, every engineer pulls their weight.","exampleAz":"Yüksək səviyyəli komandalarda hər kəs öz payına düşən işi layiqincə görür."},{"id":2122,"day":142,"indexInDay":7,"word":"Move heaven and earth","phonetic":"/muːv ˈhev.ən ænd ɜːθ/","pos":"phrase","az":"Əlindən gələn hər şeyi etmək","definition":"Do everything possible with extraordinary exertion","example":"She moved heaven and earth to secure the student exchange fellowship.","exampleAz":"O, tələbə mübadiləsi təqaüdünü qazanmaq üçün əlindən gələn hər şeyi etdi."},{"id":2123,"day":142,"indexInDay":8,"word":"Keep one’s nose to the grindstone","phonetic":"/kiːp wʌnz nəʊz tuː ðə ˈɡraɪnd.stəʊn/","pos":"phrase","az":"Başını qaldırmadan çalışmaq","definition":"Work persistently without interruption or rest","example":"Keep your nose to the grindstone during morning review.","exampleAz":"Səhər təkrarı zamanı fikrinizi yayındırmadan başınızı qoyub oxuyun."},{"id":2124,"day":142,"indexInDay":9,"word":"Weather through","phonetic":"/ˈweð.ər θruː/","pos":"phrase","az":"Dözüb başa çatdırmaq","definition":"Endure until the conclusion of difficulty","example":"We weathered through the confusing early stages of grammar.","exampleAz":"Qrammatikanın ilk çaşdırıcı mərhələlərinə dözüb onu başa çatdırdıq."},{"id":2125,"day":142,"indexInDay":10,"word":"Rise to the occasion","phonetic":"/raɪz tuː ðiː əˈkeɪ.ʒən/","pos":"phrase","az":"Məsuliyyəti layiqincə yerinə yetirmək","definition":"Perform exceptionally well in response to difficult challenge","example":"The young orator rose to the occasion before the United Nations.","exampleAz":"Gənc natiq Birləşmiş Millətlər Təşkilatı qarşısında məsuliyyəti layiqincə doğrultdu."},{"id":2126,"day":142,"indexInDay":11,"word":"Stand the test of time","phonetic":"/stænd ðə test ɒv taɪm/","pos":"phrase","az":"Zamanın sınağından çıxmaq","definition":"Remain valuable, respected, or true over prolonged periods","example":"Nizami Ganjavi’s Khamsa has stood the test of time for centuries.","exampleAz":"Nizami Gəncəvinin \"Xəmsə\"si əsrlər boyu zamanın sınağından çıxmışdır."},{"id":2127,"day":142,"indexInDay":12,"word":"Fight an uphill battle","phonetic":"/faɪt ən ˈʌp.hɪl ˈbæt.əl/","pos":"phrase","az":"Ağır mübarizə aparmaq","definition":"Struggle against very unfavorable odds","example":"Studying without a system is fighting an uphill battle.","exampleAz":"Sistemsiz oxumaq əvvəlcədən uduzulmuş ağır bir mübarizədir."},{"id":2128,"day":142,"indexInDay":13,"word":"Bear the brunt of","phonetic":"/beər ðə brʌnt ɒv/","pos":"phrase","az":"Ən ağır zərbəni üzərinə götürmək","definition":"Endure the worst part of something unpleasant","example":"Frontline health workers bore the brunt of the pandemic.","exampleAz":"Səhiyyə işçiləri pandemiyanın ən ağır yükünü öz çiyinlərinə götürdülər."},{"id":2129,"day":142,"indexInDay":14,"word":"Through sweat and tears","phonetic":"/θruː swet ænd tɪəz/","pos":"phrase","az":"Alın təri və zəhmətlə","definition":"By enduring difficult toil and emotional distress","example":"Through sweat and tears, the immigrant family built a thriving legacy.","exampleAz":"Alın təri və böyük zəhmətlə həmin ailə çiçəklənən bir irs qurdu."},{"id":2130,"day":142,"indexInDay":15,"word":"Steer the ship","phonetic":"/stɪər ðə ʃɪp/","pos":"phrase","az":"Gəmini idarə etmək / Rəhbərlik etmək","definition":"Guide and direct an enterprise through challenges","example":"A composed executive steers the ship through stormy economic markets.","exampleAz":"Təmkinli rəhbər gəmini fırtınalı iqtisadi bazarlardan ustalıqla keçirir."}]},{"day":143,"level":"C1","theme":"Advanced Idioms: Communication & Truth","themeAz":"Həqiqət və Rabitə İdiomları","wordCount":15,"words":[{"id":2131,"day":143,"indexInDay":1,"word":"Call a spade a spade","phonetic":"/kɔːl ə speɪd ə speɪd/","pos":"phrase","az":"Hər şeyi öz adı ilə çağırmaq / Düzünü demək","definition":"Speak frankly and directly about a subject, avoiding euphemism","example":"Let us call a spade a spade: cramming the night before does not work.","exampleAz":"Gəlin düzünü deyək: imtahana son gecə hazırlaşmaq fayda vermir."},{"id":2132,"day":143,"indexInDay":2,"word":"Straight from the horse’s mouth","phonetic":"/streɪt frɒm ðə ˈhɔː.sɪz maʊθ/","pos":"phrase","az":"Birinci mənbədən / Birbaşa","definition":"From the highest or most reliable authoritative source","example":"I heard the policy announcement straight from the minister’s mouth.","exampleAz":"Qərar barədə məlumatı birbaşa nazirin öz dilindən eşitdim."},{"id":2133,"day":143,"indexInDay":3,"word":"Read between the lines","phonetic":"/riːd bɪˈtwiːn ðə laɪnz/","pos":"phrase","az":"Mətnaltı mənanı oxumaq / Anlamaq","definition":"Look for or discover hidden meaning in text or speech","example":"Read between the lines to perceive diplomatic hesitations.","exampleAz":"Diplomatik tərəddüdləri duymaq üçün mətnaltı mənanı anlayın."},{"id":2134,"day":143,"indexInDay":4,"word":"Cut to the chase","phonetic":"/kʌt tuː ðə tʃeɪs/","pos":"phrase","az":"Əsas mətləbə keçmək","definition":"Come directly to the important matter without wasting time","example":"Skip unnecessary preambles and cut straight to the chase.","exampleAz":"Lüzumsuz girişləri buraxın və birbaşa əsas mətləbə keçin."},{"id":2135,"day":143,"indexInDay":5,"word":"A bitter pill to swallow","phonetic":"/ə ˈbɪt.ər pɪl tuː ˈswɒl.əʊ/","pos":"phrase","az":"Udulması acı olan həqiqət","definition":"Unpleasant fact that one is forced to accept","example":"Admitting our initial design had flaws was a bitter pill to swallow.","exampleAz":"İlkin dizaynımızın qüsurlu olduğunu etiraf etmək acı bir həqiqət idi."},{"id":2136,"day":143,"indexInDay":6,"word":"Clear the air","phonetic":"/klɪər ðiː eər/","pos":"phrase","az":"Anlaşılmazlığı aradan qaldırmaq","definition":"Defuse tension by frank discussion of differences","example":"A candid conversation cleared the air between the researchers.","exampleAz":"Səmimi söhbət tədqiqatçılar arasındakı bütün anlaşılmazlığı aradan qaldırdı."},{"id":2137,"day":143,"indexInDay":7,"word":"Ring a bell","phonetic":"/rɪŋ ə bel/","pos":"phrase","az":"Tanış gəlmək","definition":"Sound vaguely familiar to memory","example":"Does the archaic grammatical term \"henceforth\" ring a bell?","exampleAz":"\"Henceforth\" qədim qrammatik termini sizə tanış gəlirmi?"},{"id":2138,"day":143,"indexInDay":8,"word":"On the tip of one’s tongue","phonetic":"/ɒn ðə tɪp ɒv wʌnz tʌŋ/","pos":"phrase","az":"Dilimin ucunda olmaq","definition":"About to be spoken or remembered with effort","example":"The precise synonym was on the tip of my tongue.","exampleAz":"Dəqiq sinonim düz dilimin ucunda idi."},{"id":2139,"day":143,"indexInDay":9,"word":"Speak volumes","phonetic":"/spiːk ˈvɒl.juːmz/","pos":"phrase","az":"Çox şeydən xəbər vermək","definition":"Convey an enormous amount of information indirectly","example":"Her calm, attentive listening spoke volumes about her character.","exampleAz":"Onun sakit və diqqətlə dinləməsi xarakterindən çox şey xəbər verirdi."},{"id":2140,"day":143,"indexInDay":10,"word":"Grain of salt","phonetic":"/ɡreɪn ɒv sɒlt/","pos":"phrase","az":"Ehtiyatla yanaşmaq / Şübhə ilə qəbul etmək","definition":"View with skeptical reserve or caution","example":"Take unverified internet rumors with a grain of salt.","exampleAz":"İnternetdəki təsdiqlənməmiş şayiələrə həmişə ehtiyat və şübhə ilə yanaşın."},{"id":2141,"day":143,"indexInDay":11,"word":"Hear through the grapevine","phonetic":"/hɪər θruː ðə ˈɡreɪp.vaɪn/","pos":"phrase","az":"Qulaqdan-qulağa eşitmək","definition":"Learn information through informal rumors","example":"I heard through the grapevine that promotions are coming.","exampleAz":"Qulaqdan-qulağa eşitdim ki, yaxınlarda vəzifə yüksəlişləri olacaq."},{"id":2142,"day":143,"indexInDay":12,"word":"Play devil’s advocate","phonetic":"/pleɪ ˈdev.əlz ˈæd.və.kət/","pos":"phrase","az":"Qəsdən əks tərəfi müdafiə etmək","definition":"Argue against an opinion for the sake of exploring thought","example":"The professor played devil’s advocate to test our reasoning.","exampleAz":"Professor məntiqimizi yoxlamaq üçün qəsdən əks mövqeni müdafiə etdi."},{"id":2143,"day":143,"indexInDay":13,"word":"To the point","phonetic":"/tuː ðə pɔɪnt/","pos":"phrase","az":"Yığcam və dəqiq / Konkret","definition":"Relevant, concise, and appropriate","example":"Her answers during the interview were articulate and to the point.","exampleAz":"Müsahibədə onun cavabları səlis, yığcam və çox konkret idi."},{"id":2144,"day":143,"indexInDay":14,"word":"Hold one’s tongue","phonetic":"/həʊld wʌnz tʌŋ/","pos":"phrase","az":"Dilini saxlamaq / Susmaq","definition":"Refrain from expressing an opinion or judgment","example":"In heated moments, it is wiser to hold one’s tongue.","exampleAz":"Qızğın anlarda dilini saxlamaq ən böyük müdriklikdir."},{"id":2145,"day":143,"indexInDay":15,"word":"The naked truth","phonetic":"/ðə ˈneɪ.kɪd truːθ/","pos":"phrase","az":"Ağrıdıcı çılpaq həqiqət","definition":"The complete, unvarnished, and plain truth","example":"Face the naked truth: language fluency requires daily dedication.","exampleAz":"Çılpaq həqiqətlə üzləşin: dil sərbəstliyi gündəlik zəhmət tələb edir."}]},{"day":144,"level":"C1","theme":"Advanced Idioms: Decision & Risk","themeAz":"Qərar və Risk İdiomları","wordCount":15,"words":[{"id":2146,"day":144,"indexInDay":1,"word":"Cross the Rubicon","phonetic":"/krɒs ðə ˈruː.bɪ.kɒn/","pos":"phrase","az":"Geri dönüşü olmayan addım atmaq","definition":"Take an irrevocable step that commits one to a course of action","example":"Deciding to master English is crossing the Rubicon of career growth.","exampleAz":"İngilis dilini öyrənməyə qərar vermək karyera üçün geri dönüşü olmayan uca addımdır."},{"id":2147,"day":144,"indexInDay":2,"word":"At a crossroads","phonetic":"/æt ə ˈkrɒs.rəʊdz/","pos":"phrase","az":"Yol ayrıcında olmaq","definition":"At a point where a critical decision must be made","example":"The graduate stood at a crossroads between research and entrepreneurship.","exampleAz":"Məzun elmi tədqiqatla sahibkarlıq arasında yol ayrıcında qalmışdı."},{"id":2148,"day":144,"indexInDay":3,"word":"Play with fire","phonetic":"/pleɪ wɪð ˈfaɪər/","pos":"phrase","az":"Odla oynamaq / Riskli iş görmək","definition":"Take foolish risks that could easily end in disaster","example":"Neglecting data privacy standards is playing with fire.","exampleAz":"Məlumat məxfiliyi qaydalarına etinasızlıq göstərmək odla oynamaqdır."},{"id":2149,"day":144,"indexInDay":4,"word":"Take the plunge","phonetic":"/teɪk ðə plʌndʒ/","pos":"phrase","az":"Risk edib qəti addım atmaq","definition":"Commit oneself to a course of action about which one felt hesitant","example":"Take the plunge and start conversing with international colleagues.","exampleAz":"Qəti addım atın və beynəlxalq həmkarlarınızla danışmağa başlayın."},{"id":2150,"day":144,"indexInDay":5,"word":"Throw caution to the wind","phonetic":"/θrəʊ ˈkɔː.ʃən tuː ðə wɪnd/","pos":"phrase","az":"Bütün ehtiyatı kənara qoymaq","definition":"Act recklessly or decisively without worrying about consequences","example":"She threw caution to the wind and launched her startup venture.","exampleAz":"O, bütün tərəddüdləri kənara qoydu və öz texnoloji startapını qurdu."},{"id":2151,"day":144,"indexInDay":6,"word":"Calculated risk","phonetic":"/ˈkæl.kjə.leɪ.tɪd rɪsk/","pos":"phrase","az":"Hesablanmış risk","definition":"Chance of exposure to danger taken after careful assessment","example":"Investing in software education is a sound calculated risk.","exampleAz":"İT təhsilinə sərmayə qoymaq son dərəcə doğru və hesablanmış riskdir."},{"id":2152,"day":144,"indexInDay":7,"word":"In the balance","phonetic":"/ɪn ðə ˈbæl.əns/","pos":"phrase","az":"Tərəzidə olmaq / Taleyi həll olunmaq","definition":"In a precarious or critical condition; uncertain","example":"The fate of the diplomatic treaty hung in the balance.","exampleAz":"Diplomatik müqavilənin taleyi tükdən asılı qalmışdı."},{"id":2153,"day":144,"indexInDay":8,"word":"On the fence","phonetic":"/ɒn ðə fens/","pos":"phrase","az":"Qərarsız qalmaq / İki daş arasında olmaq","definition":"Undecided between two opposing sides or choices","example":"Do not stay on the fence; commit completely to fluency.","exampleAz":"İki daş arasında qalmayın; özünüzü tamamilə dil ustalığına həsr edin."},{"id":2154,"day":144,"indexInDay":9,"word":"Bite the bullet","phonetic":"/baɪt ðə ˈbʊl.ɪt/","pos":"phrase","az":"Çətin qərarı qəbul etmək","definition":"Face a painful necessity with resolute courage","example":"Bite the bullet and discard counterproductive study habits.","exampleAz":"Çətin qərarı qəbul edin və səmərəsiz oxu vərdişlərini birdəfəlik atın."},{"id":2155,"day":144,"indexInDay":10,"word":"Double-edged sword","phonetic":"/ˌdʌb.əl.edʒd ˈsɔːd/","pos":"phrase","az":"İkiuclu qılınc / Həm xeyri, həm zərəri olan","definition":"Circumstance that has both favorable and unfavorable consequences","example":"Social media is a double-edged sword for learning focus.","exampleAz":"Sosial şəbəkələr öyrənmə diqqəti üçün ikiuclu bir qılıncdır."},{"id":2156,"day":144,"indexInDay":11,"word":"Sit on the fence","phonetic":"/sɪt ɒn ðə fens/","pos":"phrase","az":"Tərəfsiz qalmaq / Qərar verməmək","definition":"Delay making a decision between two choices","example":"Decisive leaders never sit on the fence during crises.","exampleAz":"Qətiyyətli rəhbərlər böhran anında heç vaxt qərarsız qalıb gözləməzlər."},{"id":2157,"day":144,"indexInDay":12,"word":"Weigh the pros and cons","phonetic":"/weɪ ðə prəʊz ænd kɒnz/","pos":"phrase","az":"Müsbət və mənfi cəhətləri ölçüb-biçmək","definition":"Carefully consider the advantages and disadvantages","example":"Weigh the pros and cons before accepting international assignments.","exampleAz":"Beynəlxalq təyinatı qəbul etməzdən əvvəl müsbət və mənfi cəhətləri ölçüb-biçin."},{"id":2158,"day":144,"indexInDay":13,"word":"Tip the scales","phonetic":"/tɪp ðə skeɪlz/","pos":"phrase","az":"Tərəzinin gözünü dəyişmək / Həlledici təsir etmək","definition":"Be the decisive factor in turning an event in one direction","example":"Her fluent English tipped the scales in the job competition.","exampleAz":"Onun səlis ingiliscəsi iş müsabiqəsində həlledici rol oynadı."},{"id":2159,"day":144,"indexInDay":14,"word":"Point of no return","phonetic":"/pɔɪnt ɒv nəʊ rɪˈtɜːn/","pos":"phrase","az":"Geri dönüşü olmayan nöqtə","definition":"Critical moment when it becomes impossible to reverse an action","example":"Once you think in a foreign language, you pass the point of no return.","exampleAz":"Bir dildə düşünməyə başladıqda, artıq geri dönüşü olmayan mərhələni keçirsiniz."},{"id":2160,"day":144,"indexInDay":15,"word":"Roll the dice","phonetic":"/rəʊl ðə daɪs/","pos":"phrase","az":"Bəxtini sınamaq","definition":"Take a chance or gamble on an uncertain outcome","example":"Do not merely roll the dice with your education; follow a verified system.","exampleAz":"Təhsilinizlə sadəcə zər atıb bəxtinizi sınamayın; yoxlanılmış sistemlə gedin."}]},{"day":145,"level":"C1","theme":"Nuanced Verbs of Perception & Speech","themeAz":"Nitq və Qavrayışın Zərif Felləri","wordCount":15,"words":[{"id":2161,"day":145,"indexInDay":1,"word":"Decipher","phonetic":"/dɪˈsaɪ.fər/","pos":"verb","az":"Mənasını açmaq / Şifrini oxumaq","definition":"Convert into normal language; succeed in understanding","example":"Scholars decipher ancient cuneiform clay tablets.","exampleAz":"Alimlər qədim mixi yazılı gil lövhələrin mənasını açırlar."},{"id":2162,"day":145,"indexInDay":2,"word":"Articulate","phonetic":"/ɑːˈtɪk.jə.leɪt/","pos":"verb","az":"Səlis ifadə etmək","definition":"Express an idea or feeling fluently and coherently","example":"Articulate philosophical distinctions with precision.","exampleAz":"Fəlsəfi fərqləri dəqiqliklə və səlis ifadə edin."},{"id":2163,"day":145,"indexInDay":3,"word":"Discern","phonetic":"/dɪˈsɜːn/","pos":"verb","az":"Ayırd etmək / Fərqini sezmək","definition":"Recognize or perceive differences clearly","example":"A trained ear discerns delicate differences in vowel length.","exampleAz":"Məşq etmiş qulaq saitlərin uzunluğundakı zərif fərqləri ayırd edir."},{"id":2164,"day":145,"indexInDay":4,"word":"Expound","phonetic":"/ɪkˈspaʊnd/","pos":"verb","az":"Şərh etmək / Ətraflı izah etmək","definition":"Present and explain a theory or idea systematically and in detail","example":"The philosopher expounded his thesis before the assembled faculty.","exampleAz":"Filosof öz nəzəriyyəsini toplaşmış professor heyətinə ətraflı şərh etdi."},{"id":2165,"day":145,"indexInDay":5,"word":"Intuit","phonetic":"/ɪnˈtʃuː.ɪt/","pos":"verb","az":"İntuisiya ilə hiss etmək","definition":"Understand or work out by instinct rather than conscious reasoning","example":"Experienced interpreters intuit implied subtexts effortlessly.","exampleAz":"Təcrübəli tərcüməçilər mətnaltı mənaları daxili duyumla asanlıqla hiss edirlər."},{"id":2166,"day":145,"indexInDay":6,"word":"Elaborate","phonetic":"/iˈlæb.ə.reɪt/","pos":"verb","az":"Ətraflı danışmaq / Təfərrüatlandırmaq","definition":"Develop or present in detail","example":"Please elaborate on how spaced repetition anchors neural memory.","exampleAz":"Aralıqlı təkrarın neyron yaddaşını necə qurduğu barədə ətraflı danışın."},{"id":2167,"day":145,"indexInDay":7,"word":"Glean","phonetic":"/ɡliːn/","pos":"verb","az":"Tədricən toplamaq / Məlumat süzmək","definition":"Extract information from various sources with patience","example":"Glean subtle linguistic patterns from everyday reading.","exampleAz":"Gündəlik mütaliədən zərif dil qanunauyğunluqlarını səbirlə toplayın."},{"id":2168,"day":145,"indexInDay":8,"word":"Enunciate","phonetic":"/iˈnʌn.si.eɪt/","pos":"verb","az":"Aydın tələffüz etmək","definition":"Say or pronounce words clearly","example":"Enunciate consonants cleanly to project authority.","exampleAz":"Nüfuz və inam yaratmaq üçün samitləri aydın tələffüz edin."},{"id":2169,"day":145,"indexInDay":9,"word":"Scrutinize","phonetic":"/ˈskruː.tɪ.naɪz/","pos":"verb","az":"Dərindən araşdırmaq / Təftiş etmək","definition":"Examine or inspect closely and thoroughly","example":"Scrutinize each sentence structure to grasp grammatical elegance.","exampleAz":"Qrammatik zərifliyi qavramaq üçün hər cümlə quruluşunu dərindən araşdırın."},{"id":2170,"day":145,"indexInDay":10,"word":"Divulge","phonetic":"/daɪˈvʌldʒ/","pos":"verb","az":"Aşkara çıxarmaq / Faş etmək","definition":"Make known private or sensitive information","example":"Ethical professionals never divulge confidential client data.","exampleAz":"Etik peşəkarlar müştərinin məxfi məlumatlarını heç vaxt aşkara çıxarmazlar."},{"id":2171,"day":145,"indexInDay":11,"word":"Perceive","phonetic":"/pəˈsiːv/","pos":"verb","az":"Qavramaq / Hiss etmək","definition":"Become aware or conscious of something; come to realize","example":"You will perceive the living cadence of spoken English.","exampleAz":"Siz canlı ingilis danışığının ritmini qavrayacaqsınız."},{"id":2172,"day":145,"indexInDay":12,"word":"Pronounce","phonetic":"/prəˈnaʊns/","pos":"verb","az":"Tələffüz etmək / Bəyan etmək","definition":"Make the sound of a word or declare formally","example":"Listen to phonetics to pronounce every term naturally.","exampleAz":"Hər bir termini təbii tələffüz etmək üçün fonetikanı dinləyin."},{"id":2173,"day":145,"indexInDay":13,"word":"Contemplate","phonetic":"/ˈkɒn.təm.pleɪt/","pos":"verb","az":"Düşüncəyə dalmaq / Nəzərdən keçirmək","definition":"Look thoughtfully for a long time at; meditate on","example":"Contemplate the profound philosophical poetry of Nasimi.","exampleAz":"Nəsiminin dərin fəlsəfi poeziyası üzərində düşüncəyə dalın."},{"id":2174,"day":145,"indexInDay":14,"word":"Reiterate","phonetic":"/riˈɪt.ər.eɪt/","pos":"verb","az":"Yenidən vurğulamaq","definition":"Say something again for emphasis or clarity","example":"Reiterate the day’s vocabulary before drifting to sleep.","exampleAz":"Yuxuya getməzdən əvvəl günün sözlərini bir daha xatırlayın."},{"id":2175,"day":145,"indexInDay":15,"word":"Fathom","phonetic":"/ˈfæð.əm/","pos":"verb","az":"Dərk etmək / Dərinliyinə varmaq","definition":"Understand a difficult problem after much thought","example":"It is hard to fathom how much progress 160 days produce.","exampleAz":"160 günün nə qədər böyük tərəqqi hasil etdiyini təsəvvür etmək möhtəşəmdir."}]},{"day":146,"level":"C1","theme":"Nuanced Verbs of Change & Transformation","themeAz":"Dəyişiklik və Çevrilmə Felləri","wordCount":15,"words":[{"id":2176,"day":146,"indexInDay":1,"word":"Metamorphose","phonetic":"/ˌmet.əˈmɔː.fəʊz/","pos":"verb","az":"Tamamilə çevrilmək / Metamorfoz keçirmək","definition":"Change or cause to change completely in form or nature","example":"Caterpillars metamorphose into majestic winged butterflies.","exampleAz":"Tırtıllar möhtəşəm qanadlı kəpənəklərə çevrilirlər."},{"id":2177,"day":146,"indexInDay":2,"word":"Transmute","phonetic":"/trænzˈmjuːt/","pos":"verb","az":"Daha uca formaya çevirmək","definition":"Change in form, nature, or substance, typically into higher state","example":"Alchemists of mind transmute intellectual toil into wisdom.","exampleAz":"Zehin kimyagərləri zəhməti ali müdrikliyə çevirirlər."},{"id":2178,"day":146,"indexInDay":3,"word":"Catalyze","phonetic":"/ˈkæt.əl.aɪz/","pos":"verb","az":"Sürətləndirmək / Katalizator olmaq","definition":"Cause or accelerate a reaction by acting as a catalyst","example":"Innovative apps catalyze rapid foreign language acquisition.","exampleAz":"Yenilikçi tətbiqlər xarici dilin sürətli mənimsənilməsinə təkan verir."},{"id":2179,"day":146,"indexInDay":4,"word":"Oscillate","phonetic":"/ˈɒs.ɪ.leɪt/","pos":"verb","az":"Tərəddüd etmək / Yellənmək","definition":"Move or swing back and forth at a regular speed; waver","example":"Do not oscillate between enthusiasm and neglect; remain steady.","exampleAz":"Həvəslə laqeydlik arasında tərəddüd etməyin; sabit qalın."},{"id":2180,"day":146,"indexInDay":5,"word":"Fluctuate","phonetic":"/ˈflʌk.tʃu.eɪt/","pos":"verb","az":"Dəyişmək / Qeyri-sabit qalxıb-enmək","definition":"Rise and fall irregularly in number or amount","example":"Atmospheric pressure fluctuates as mountain storms gather.","exampleAz":"Dağ fırtınaları yaxınlaşdıqca pleAz":"Mütaliənizi esselər, elm və tarix üzrə şaxələndirin."},{"id":2187,"day":146,"indexInDay":12,"word":"Reconfigure","phonetic":"/ˌriː.kənˈfɪɡ.ər/","pos":"verb","az":"Yenidən konfiqurasiya etmək","definition":"Rearrange the elements or settings of something","example":"Reconfigure your daily schedule to protect study focus.","exampleAz":"Dərsə diqqəti qorumaq üçün gündəlik cədvəlinizi yenidən qurun."},{"id":2188,"day":146,"indexInDay":13,"word":"Attenuate","phonetic":"/əˈten.ju.eɪt/","pos":"verb","az":"Zəiflətmək / Təsirini azaltmaq","definition":"Reduce the force, effect, or value of","example":"Consistent exercise attenuates physiological stress.","exampleAz":"Müntəzəm idman fizioloji gərginliyi zəiflədir."},{"id":2189,"day":146,"indexInDay":14,"word":"Proliferate","phonetic":"/prəˈlɪf.ər.eɪt/","pos":"verb","az":"Sürətlə artmaq / Çoxalmaq","definition":"Increase rapidly in numbers; multiply","example":"Bilingual opportunities proliferate across the international market.","exampleAz":"Beynəlxalq bazarda ikidilli mütəxəssislər üçün imkanlar sürətlə çoxalır."},{"id":2190,"day":146,"indexInDay":15,"word":"Culminate","phonetic":"/ˈkʌl.mɪ.neɪt/","pos":"verb","az":"Zirvəsinə çatmaq / Yekunlaşmaq","definition":"Reach a climax or point of highest development","example":"Our 160-day journey culminates in unshakeable conversational ease.","exampleAz":"160 günlük səyahətimiz sarsılmaz danışıq rahatlığı ilə zirvəsinə çatır."}]},{"day":147,"level":"C1","theme":"Describing Complexity & Intricacy","themeAz":"Mürəkkəblik və Dolaşıqlığın Təsviri","wordCount":15,"words":[{"id":2191,"day":147,"indexInDay":1,"word":"Labyrinthine","phonetic":"/ˌlæb.əˈrɪn.θaɪn/","pos":"adj","az":"Labirintvari / Çox dolaşıq","definition":"Complicated and irregular; like a labyrinth","example":"The ancient citadel features a labyrinthine network of passages.","exampleAz":"Qədim qala labirintvari keçidlər şəbəkəsinə malikdir."},{"id":2192,"day":147,"indexInDay":2,"word":"Convoluted","phonetic":"/ˈkɒn.və.luː.tɪd/","pos":"adj","az":"Qarışıq / Dolaşıq (cümlə/fikir)","definition":"Extremely complex and difficult to follow","example":"Untangle convoluted clauses into clean, elegant sentences.","exampleAz":"Dolaşıq cümlə budaqlarını aydın, zərif cümlələrə ayırın."},{"id":2193,"day":147,"indexInDay":3,"word":"Intricate","phonetic":"/ˈɪn.trɪ.kət/","pos":"adj","az":"İncə / Naxışlı / Dolaşıq","definition":"Very complicated or detailed; exquisitely designed","example":"Sheki stained-glass windows exhibit intricate geometric patterns.","exampleAz":"Şəki şəbəkə pəncərələri incə və mürəkkəb həndəsi naxışlar sərgiləyir."},{"id":2194,"day":147,"indexInDay":4,"word":"Inscrutable","phonetic":"/ɪnˈskruː.tə.bəl/","pos":"adj","az":"Müəmmalı / Oxunmaz / Sirli","definition":"Impossible to understand or interpret; mysterious","example":"The Sphinx wore an inscrutable expression across millennia.","exampleAz":"Sfinks minilliklər boyu müəmmalı və sirli bir sima daşıdı."},{"id":2195,"day":147,"indexInDay":5,"word":"Perplexing","phonetic":"/pəˈplek.sɪŋ/","pos":"adj","az":"Başsındırıcı / Çaşdırıcı","definition":"Completely baffling or puzzling","example":"Grammatical exceptions are perplexing only until systematic rules appear.","exampleAz":"Qrammatik istisnalar yalnız sistemli qaydaları görənədək çaşdırıcı olur."},{"id":2196,"day":147,"indexInDay":6,"word":"Enigmatic","phonetic":"/ˌen.ɪɡˈmæt.ɪk/","pos":"adj","az":"Sirli / Qapalı","definition":"Difficult to interpret or understand; mysterious","example":"Mona Lisa’s enigmatic smile has fascinated generations.","exampleAz":"Mona Lizanın sirli təbəssümü nəsilləri heyran qoymuşdur."},{"id":2197,"day":147,"indexInDay":7,"word":"Nuanced","phonetic":"/ˈnjuː.ɑːnst/","pos":"adj","az":"Zərif çalarlı / Dərin","definition":"Characterized by subtle shades of meaning or expression","example":"Diplomatic treatises demand nuanced, measured vocabulary.","exampleAz":"Diplomatik risalələr zərif və ölçülü lüğət tələb edir."},{"id":2198,"day":147,"indexInDay":8,"word":"Multifaceted","phonetic":"/ˌmʌl.tiˈfæs.ɪ.tɪd/","pos":"adj","az":"Çoxşaxəli / Çoxtərəfli","definition":"Having many facets or aspects","example":"Language learning is a multifaceted cognitive and cultural adventure.","exampleAz":"Dil öyrənmək çoxşaxəli zehni və mədəni bir macəradır."},{"id":2199,"day":147,"indexInDay":9,"word":"Inextricable","phonetic":"/ˌɪn.ɪkˈstrɪk.ə.bəl/","pos":"adj","az":"Ayrılmaz / Bir-birinə dolaşmış","definition":"Impossible to disentangle or separate","example":"Culture and vocabulary are bound in an inextricable embrace.","exampleAz":"Mədəniyyət və söz ehtiyatı bir-birinə ayrılmaz tellərlə bağlıdır."},{"id":2200,"day":147,"indexInDay":10,"word":"Byzantine","phonetic":"/bɪˈzæn.taɪn/","pos":"adj","az":"Həddən artıq mürəkkəb / Bürokratik","definition":"Excessively complicated, and typically involving a great deal of administrative detail","example":"Streamline byzantine bureaucracies through digital transparency.","exampleAz":"Rəqəmsal şəffaflıq vasitəsilə həddən artıq mürəkkəb bürokratiyanı sadələşdirin."},{"id":2201,"day":147,"indexInDay":11,"word":"Tortuous","phonetic":"/ˈtɔː.tʃu.əs/","pos":"adj","az":"Dolama / İlanvari / Əyri-üyrü","definition":"Full of twists and turns; excessively complex","example":"The alpine path took a tortuous ascent toward the mountain peak.","exampleAz":"Dağ cığırı zirvəyə doğru dolama və ilanvari bir yüksəlişlə gedirdi."},{"id":2202,"day":147,"indexInDay":12,"word":"Subtle","phonetic":"/ˈsʌt.əl/","pos":"adj","az":"Zərif / Çətin duyulan","definition":"So delicate or precise as to be difficult to analyze","example":"Appreciate the subtle musicality of unstressed English vowels.","exampleAz":"Vurğusuz ingilis saitlərinin zərif musiqisini duyun."},{"id":2203,"day":147,"indexInDay":13,"word":"Esoteric","phonetic":"/ˌes.əˈter.ɪk/","pos":"adj","az":"Ezoterik / Yalnız az sayda bilənə aid","definition":"Intended for or likely to be understood by only a small number of people","example":"Theoretical physics is esoteric only to those who lack mathematics.","exampleAz":"Nəzəri fizika yalnız riyaziyyatı bilməyənlər üçün ezoterikdir."},{"id":2204,"day":147,"indexInDay":14,"word":"Dense","phonetic":"/dens/","pos":"adj","az":"Sıx / Məzmunca ağır","definition":"Closely compacted in substance or complex in thought","example":"Philosophical treatises are dense and require unhurried contemplation.","exampleAz":"Fəlsəfi risalələr sıxdır və tələsmədən düşünməyi tələb edir."},{"id":2205,"day":147,"indexInDay":15,"word":"Interconnected","phonetic":"/ˌɪn.tə.kəˈnek.tɪd/","pos":"adj","az":"Bir-birinə bağlı / Zəncirvari","definition":"Having all constituent parts linked or related","example":"All 2,400 vocabulary items form an interconnected communicative web.","exampleAz":"Bütün 2400 söz bir-birinə bağlı canlı ünsiyyət şəbəkəsi təşkil edir."}]},{"day":148,"level":"C1","theme":"Describing Brevity, Ephemerality & Time","themeAz":"Müvəqqəti və Keçici Hadisələrin Təsviri","wordCount":15,"words":[{"id":2206,"day":148,"indexInDay":1,"word":"Ephemeral","phonetic":"/ɪˈfem.ər.əl/","pos":"adj","az":"Gəldi-gedər / Müvəqqəti / Tez keçən","definition":"Lasting for a very short time","example":"Spring blossom is exquisite yet ephemeral.","exampleAz":"Bahar çiçəkləri gözəldir, lakin gəldi-gedər və tez keçəndir."},{"id":2207,"day":148,"indexInDay":2,"word":"Transient","phonetic":"/ˈtræn.zi.ənt/","pos":"adj","az":"Keçici / Qalıcı olmayan","definition":"Lasting only for a short time; impermanent","example":"Worldly hardships are transient; cultivated wisdom is eternal.","exampleAz":"Dünyəvi çətinliklər keçicidir; qazanılmış hikmət isə əbədidir."},{"id":2208,"day":148,"indexInDay":3,"word":"Evanescent","phonetic":"/ˌev.əˈnes.ənt/","pos":"adj","az":"Tez yox olan / Qeyb olan","definition":"Soon passing out of sight, memory, or existence; quickly fading","example":"The evanescent rainbow dissolved into morning mist.","exampleAz":"Tez yox olan göyqurşağı səhər dumanında əridi."},{"id":2209,"day":148,"indexInDay":4,"word":"Fleeting","phonetic":"/ˈfliː.tɪŋ/","pos":"adj","az":"Uçucu / Göz qırpımında keçən","definition":"Lasting for a very short time; momentary","example":"Do not trade lifelong mastery for fleeting digital distractions.","exampleAz":"Ömürlük ustalığı anlıq rəqəmsal əyləncələrə qurban verməyin."},{"id":2210,"day":148,"indexInDay":5,"word":"Perennial","phonetic":"/pəˈren.i.əl/","pos":"adj","az":"Daimi / Əbədi / Çoxillik","definition":"Lasting or existing for a long or apparently infinite time","example":"Integrity and kindness are perennial human virtues.","exampleAz":"Dürüstlük və mərhəmət insanlığın daimi və əbədi fəzilətləridir."},{"id":2211,"day":148,"indexInDay":6,"word":"Momentary","phonetic":"/ˈməʊ.mən.tr.i/","pos":"adj","az":"Anlıq / Bir anlıq","definition":"Lasting for a very short time","example":"A momentary pause allows the orator to collect his thoughts.","exampleAz":"Bir anlıq fasilə natiqə fikirlərini toplamağa imkan verir."},{"id":2212,"day":148,"indexInDay":7,"word":"Temporal","phonetic":"/ˈtem.pər.əl/","pos":"adj","az":"Müvəqqəti / Zamana aid","definition":"Relating to worldly as opposed to spiritual affairs; time-bound","example":"Philosophers contrast temporal phenomena with timeless ideals.","exampleAz":"Filosoflar zamana bağlı hadisələri əbədi ideallarla müqayisə edirlər."},{"id":2213,"day":148,"indexInDay":8,"word":"Enduring","phonetic":"/ɪnˈdʒʊə.rɪŋ/","pos":"adj","az":"Davamlı / Yaşayan / Əbədi","definition":"Continuing or long-lasting","example":"Nizami’s verses left an enduring impression on world literature.","exampleAz":"Nizaminin misraları dünya ədəbiyyatında əbədi bir iz qoymuşdur."},{"id":2214,"day":148,"indexInDay":9,"word":"Perpetual","phonetic":"/pəˈpetʃ.u.əl/","pos":"adj","az":"Daimi / Fasiləsiz","definition":"Never ending or changing; occurring repeatedly","example":"Curiosity is a perpetual fountain of intellectual youth.","exampleAz":"Maraq intellektual gəncliyin daimi və tükənməz çeşməsidir."},{"id":2215,"day":148,"indexInDay":10,"word":"Succinct","phonetic":"/səkˈsɪŋkt/","pos":"adj","az":"Yığcam / Qısa və məzmunlu","definition":"Briefly and clearly expressed","example":"Craft succinct definitions that illuminate core meaning.","exampleAz":"Əsas mənanı işıqlandıran yığcam və dəqiq təriflər qurun."},{"id":2216,"day":148,"indexInDay":11,"word":"Curt","phonetic":"/kɜːt/","pos":"adj","az":"Qısa / Kəsə (bəzən kobud)","definition":"Rudely brief; terse in response","example":"Avoid curt replies; respond with warm communicative grace.","exampleAz":"Kəsə və quru cavablardan çəkinin; səmimi zərifliklə cavab verin."},{"id":2217,"day":148,"indexInDay":12,"word":"Terse","phonetic":"/tɜːs/","pos":"adj","az":"Lakonik / Qısa və aydın","definition":"Sparing in the use of words; abrupt","example":"His terse telegram communicated all essential instructions.","exampleAz":"Onun lakonik teleqramı bütün vacib təlimatları çatdırdı."},{"id":2218,"day":148,"indexInDay":13,"word":"Brevity","phonetic":"/ˈbrev.ə.ti/","pos":"noun","az":"Qısalıq / Yığcamlıq","definition":"Concise and exact use of words in writing or speech","example":"Brevity is the soul of wit, as Shakespeare observed.","exampleAz":"Şekspirin qeyd etdiyi kimi, yığcamlıq hazırcavablığın canıdır."},{"id":2219,"day":148,"indexInDay":14,"word":"Centenary","phonetic":"/senˈtiː.nər.i/","pos":"noun","az":"Yüzillik yubiley","definition":"Hundredth anniversary of a significant event","example":"Baku celebrated the centenary of the university with splendor.","exampleAz":"Bakı universitetin yüzillik yubileyini böyük təntənə ilə qeyd etdi."},{"id":2220,"day":148,"indexInDay":15,"word":"Millennium","phonetic":"/mɪˈlen.i.əm/","pos":"noun","az":"Minillik","definition":"Period of a thousand years","example":"Gobustan’s rock petroglyphs bridge many a millennium.","exampleAz":"Qobustanın qayaüstü rəsmləri minillikləri birləşdirir."}]},{"day":149,"level":"C1","theme":"Describing Grandeur, Scale & Abundance","themeAz":"Əzəmət, Miqyas və Bollluq Bildirən Sözlər","wordCou "word":"Plethora","phonetic":"/ˈpleθ.ər.ə/","pos":"noun","az":"Hədsiz çoxluq / Bəhrə bolluğu","definition":"Large or excessive amount of something","example":"Our web app delivers a rich plethora of practice modalities.","exampleAz":"Veb tətbiqimiz zəngin məşq üsulları bolluğu təqdim edir."},{"id":2228,"day":149,"indexInDay":8,"word":"Prodigious","phonetic":"/prəˈdɪdʒ.əs/","pos":"adj","az":"Fövqəladə / Heyrətamiz","definition":"Remarkably or impressively great in extent, size, or degree","example":"Her prodigious memory mastered hundreds of idioms with ease.","exampleAz":"Onun heyrətamiz yaddaşı yüzlərlə idiomu asanlıqla mənimsədi."},{"id":2229,"day":149,"indexInDay":9,"word":"Resplendent","phonetic":"/rɪˈsplen.dənt/","pos":"adj","az":"Parlaq / Gözqamaşdırıcı","definition":"Attractive and impressive through being richly colorful or sumptuous","example":"The bride wore a resplendent silk national costume.","exampleAz":"Gəlin gözqamaşdırıcı ipək milli geyim geyinmişdi."},{"id":2230,"day":149,"indexInDay":10,"word":"Imposing","phonetic":"/ɪmˈpəʊ.zɪŋ/","pos":"adj","az":"Vüqarlı / Əzəmətli","definition":"Grand and impressive in appearance","example":"The medieval fortress presents an imposing architectural silhouette.","exampleAz":"Orta əsr qalası vüqarlı memarlıq silueti sərgiləyir."},{"id":2231,"day":149,"indexInDay":11,"word":"Vast","phonetic":"/vɑːst/","pos":"adj","az":"Geniş / Nəhəng","definition":"Of very great extent or quantity; immense","example":"The vast Caspian waters sparkle under the midday sun.","exampleAz":"Xəzərin nəhəng suları günorta günəşi altında parıldayır."},{"id":2232,"day":149,"indexInDay":12,"word":"Infinite","phonetic":"/ˈɪn.fɪ.nət/","pos":"adj","az":"Sonsuz","definition":"Limitless or endless in space, extent, or size","example":"Human intellectual potential is virtually infinite.","exampleAz":"İnsanın intellektual potensialı demək olar ki, sonsuzdur."},{"id":2233,"day":149,"indexInDay":13,"word":"Boundless","phonetic":"/ˈbaʊnd.ləs/","pos":"adj","az":"Hüdudsuz / Tükənməz","definition":"Unlimited; immense","example":"Approach language exploration with boundless child-like wonder.","exampleAz":"Dil kəşfinə hüdudsuz uşaq heyrəti ilə yanaşın."},{"id":2234,"day":149,"indexInDay":14,"word":"Omnipresent","phonetic":"/ˌɒm.nɪˈprez.ənt/","pos":"adj","az":"Hər yerdə olan","definition":"Widely or constantly encountered; widespread","example":"English has become an omnipresent language in modern science.","exampleAz":"İngilis dili müasir elmdə hər yerdə olan bir dilə çevrilmişdir."},{"id":2235,"day":149,"indexInDay":15,"word":"Apex","phonetic":"/ˈeɪ.peks/","pos":"noun","az":"Zirvə / Ən yüksək nöqtə","definition":"Top or highest part of something, especially forming a point","example":"Day 160 is the majestic apex of this vocabulary mountain.","exampleAz":"160-cı gün bu lüğət dağının əzəmətli zirvəsidir."}]},{"day":150,"level":"C1","theme":"Describing Scarcity, Decline & Deterioration","themeAz":"Qıtlıq, Tənəzzül və Zəifləmə Sözləri","wordCount":15,"words":[{"id":2236,"day":150,"indexInDay":1,"word":"Scarcity","phonetic":"/ˈskeə.sə.ti/","pos":"noun","az":"Qıtlıq / Çatışmazlıq","definition":"State of being scarce or in short supply; shortage","example":"Resource scarcity demands innovative engineering solutions.","exampleAz":"Resurs qıtlığı innovativ mühəndislik həlləri tələb edir."},{"id":2237,"day":150,"indexInDay":2,"word":"Dearth","phonetic":"/dɜːθ/","pos":"noun","az":"Yoxluq / Çatışmazlıq","definition":"Scarcity or lack of something","example":"There is no dearth of opportunities for the bilingual professional.","exampleAz":"İkidilli mütəxəssislər üçün imkanların çatışmazlığı yoxdur."},{"id":2238,"day":150,"indexInDay":3,"word":"Meager","phonetic":"/ˈmiː.ɡər/","pos":"adj","az":"Kasıb / Cüzi / Qeyri-kafi","definition":"Lacking in quantity or quality; lean; thin","example":"A meager ten-minute review still beats total neglect.","exampleAz":"Cüzi on dəqiqəlik təkrar belə tamamilə oxumamaqdan qat-qat yaxşıdır."},{"id":2239,"day":150,"indexInDay":4,"word":"Paucity","phonetic":"/ˈpɔː.sə.ti/","pos":"noun","az":"Azlıq / Qıtlıq","definition":"Presence of something only in small or insufficient quantities","example":"A paucity of vocabulary cripples otherwise brilliant intellects.","exampleAz":"Söz ehtiyatının azlığı ən parlaq zəkaları belə ifadədə çətinliyə salır."},{"id":2240,"day":150,"indexInDay":5,"word":"Decadence","phonetic":"/ˈdek.ə.dəns/","pos":"noun","az":"Tənəzzül / Əxlaqi düşgünlük","definition":"Moral or cultural decline as characterized by excessive indulgence","example":"Ancient empires fell into decadence before collapse.","exampleAz":"Qədim imperiyalar süqutdan əvvəl tənəzzülə uğradılar."},{"id":2241,"day":150,"indexInDay":6,"word":"Degeneration","phonetic":"/dɪˌdʒen.əˈreɪ.ʃən/","pos":"noun","az":"Deqradasiya / Zəifləmə","definition":"State or process of being or becoming degenerate","example":"Prevent neural degeneration by mastering foreign tongues.","exampleAz":"Xarici dilləri öyrənərək beyin zəifləməsinin qarşısını alın."},{"id":2242,"day":150,"indexInDay":7,"word":"Atrophy","phonetic":"/ˈæt.rə.fi/","pos":"noun","az":"Atrofiya / Hərəkətsizlikdən zəifləmə","definition":"Gradual decline in effectiveness or vigor due to underuse","example":"Unused vocabulary undergoes inevitable cognitive atrophy.","exampleAz":"İstifadə olunmayan sözlər qaçılmaz olaraq unudulub zəifləyir."},{"id":2243,"day":150,"indexInDay":8,"word":"Diminish","phonetic":"/dɪˈmɪn.ɪʃ/","pos":"verb","az":"Azalmaq / Əskilmək","definition":"Make or become less","example":"Hesitation will diminish as vocal confidence expands.","exampleAz":"Şifahi özünə inam artdıqca tərəddüd azalacaq."},{"id":2244,"day":150,"indexInDay":9,"word":"Wane","phonetic":"/weɪn/","pos":"verb","az":"Zəifləmək / Sönmək (ay kimi)","definition":"Decrease in vigor, power, or extent; become weaker","example":"Never let your curiosity wane after finishing the course.","exampleAz":"Kursu bitirdikdən sonra da marağınızın sönməsinə heç vaxt imkan verməyin."},{"id":2245,"day":150,"indexInDay":10,"word":"Erode","phonetic":"/ɪˈrəʊd/","pos":"verb","az":"Aşınmaq / Yeyilmək","definition":"Gradually wear away soil, rock, or intangible qualities","example":"Procrastination erodes the highest human ambitions.","exampleAz":"Təxirə salmaq ən ali insan arzularını belə tədricən aşındırır."},{"id":2246,"day":150,"indexInDay":11,"word":"Deplete","phonetic":"/dɪˈpliːt/","pos":"verb","az":"Tükətmək / Boşaltmaq","definition":"Use up the supply or resources of","example":"Do not deplete mental energy on senseless digital scrolling.","exampleAz":"Mənasız sosial şəbəkə vərəqləmələrinə zehni enerjinizi xərcləyib tükətməyin."},{"id":2247,"day":150,"indexInDay":12,"word":"Famine","phonetic":"/ˈfæm.ɪn/","pos":"noun","az":"Aclıq / Quraqlıq fəlakəti","definition":"Extreme scarcity of food","example":"Humanitarian food corridors prevent famine in dry regions.","exampleAz":"Humanitar qida dəhlizləri quraq bölgələrdə aclığın qarşısını alır."},{"id":2248,"day":150,"indexInDay":13,"word":"Stagnant","phonetic":"/ˈstæɡ.nənt/","pos":"adj","az":"Durğun / Hərəkətsiz","definition":"Showing no activity; dull and sluggish","example":"Avoid stagnant routines by challenging yourself with idioms.","exampleAz":"İdiomlarla özünüzü sınayaraq durğunluqdan qaçın."},{"id":2249,"day":150,"indexInDay":14,"word":"Oblivion","phonetic":"/əˈblɪv.i.ən/","pos":"noun","az":"Unudulma / Qaranlıq yoxluq","definition":"State of being unaware or unconscious of what is happening; forgotten","example":"Immortal poetry rescues heroic names from oblivion.","exampleAz":"Ölməz poeziya qəhrəman adları unudulmaqdan xilas edir."},{"id":2250,"day":150,"indexInDay":15,"word":"Perish","phonetic":"/ˈper.ɪʃ/","pos":"verb","az":"Məhv olmaq / Yox olmaq","definition":"Suffer death, typically in a violent, sudden, or untimely way","example":"Noble ideals never perish; they inspire succeeding eras.","exampleAz":"Alicənab ideallar heç vaxt məhv olmur; onlar sonrakı dövrlərə ilham verir."}]},{"day":151,"level":"C1","theme":"Existential & Abstract Concepts","themeAz":"Ekzistensial və Mücərrəd Konsepsiyalar","wordCount":15,"words":[{"id":2251,"day":151,"indexInDay":1,"word":"Consciousness","phonetic":"/ˈkɒn.ʃəs.nəs/","pos":"noun","az":"Şüur / Özünüdərk","definition":"State of being aware of and responsive to one’s surroundings","example":"Consciousness is the cosmos experiencing its own mystery.","exampleAz":"Şüur kainatın öz sirrini dərk etməsi və yaşamasıdır."},{"id":2252,"day":151,"indexInDay":2,"word":"Solitude","phonetic":"/ˈsɒl.ɪ.tʃuːd/","pos":"noun","az":"Tənhalıq / Xəlvətə çəkilmə","definition":"State or situation of being alone, especially beneficial","example":"Serene solitude fosters deep contemplation and creative insight.","exampleAz":"Dinc tənhalıq dərin düşüncə və yaradıcı ilham bəxş edir."},{"id":2253,"day":151,"indexInDay":3,"word":"Authenticity","phonetic":"/ˌɔː.θenˈtɪs.ə.ti/","pos":"noun","az":"Həqiqilik / Səmimiyyət","definition":"Quality of being authentic, genuine, or real","example":"Authenticity in communication creates immediate heart-to-heart rapport.","exampleAz":"Ünsiyyətdə səmimiyyət dərhal ürəkdən-ürəyə isti körpü qurur."},{"id":2254,"day":151,"indexInDay":4,"word":"Transcendence","phonetic":"/trænˈsen.dəns/","pos":"noun","az":"Transsendensiya / Məhdudiyyətləri aşma","definition":"Existence or experience beyond the normal or physical level","example":"Mystical poetry achieves spiritual transcendence through music.","exampleAz":"Təsəvvüf poeziyası musiqi vasitəsilə mənəvi ucalığa çatır."},{"id":2255,"day":151,"indexInDay":5,"word":"Mortality","phonetic":"/mɔːˈtæl.ə.ti/","pos":"noun","az":"Fanilik / Ölüm zərurəti","definition":"State of being subject to death","example":"Awareness of mortality reminds us to cherish every single sunrise.","exampleAz":"Faniliyin dərki hər bir günəşin doğuşunu əziz tutmağı xatırladır."},{"id":2256,"day":151,"indexInDay":6,"word":"Meaning","phonetic":"/ˈmiː.nɪŋ/","pos":"noun","az":"Həyatı
