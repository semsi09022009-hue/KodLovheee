y":110,"level":"B2","theme":"Conflict Resolution & Mediation","themeAz":"Münaqişələrin Həlli və Mediasiya","wordCount":15,"words":[{"id":1636,"day":110,"indexInDay":1,"word":"Conflict","phonetic":"/ˈkɒn.flɪkt/","pos":"noun","az":"Münaqişə / İxtilaf","definition":"Serious disagreement or argument","example":"Constructive dialogue transforms conflict into collaboration.","exampleAz":"Konstruktiv dialoq münaqişəni əməkdaşlığa çevirir."},{"id":1637,"day":110,"indexInDay":2,"word":"Mediation","phonetic":"/ˌmiː.diˈeɪ.ʃən/","pos":"noun","az":"Mediasiya / Vasitəçilik","definition":"Intervention in dispute in order to resolve it","example":"Skilled mediation assists disputants in finding harmony.","exampleAz":"Peşəkar mediasiya tərəflərə harmoniya tapmaqda kömək edir."},{"id":1638,"day":110,"indexInDay":3,"word":"Arbitration","phonetic":"/ˌɑː.bɪˈtreɪ.ʃən/","pos":"noun","az":"Arbitraj","definition":"Use of neutral party to settle a dispute bindingly","example":"Arbitration provides an efficient alternative to court trials.","exampleAz":"Arbitraj məhkəmə çəkişmələrinə səmərəli alternativ təqdim edir."},{"id":1639,"day":110,"indexInDay":4,"word":"Reconciliation","phonetic":"/ˌrek.ənˌsɪl.iˈeɪ.ʃən/","pos":"noun","az":"Barışıq / Əmin-amanlıq","definition":"Restoration of friendly relations","example":"Reconciliation heals historic grievances between peoples.","exampleAz":"Barışıq xalqlar arasındakı tarixi inciklikləri sağaldır."},{"id":1640,"day":110,"indexInDay":5,"word":"Compromise","phonetic":"/ˈkɒm.prə.maɪz/","pos":"noun","az":"Kompromis","definition":"Settlement of a dispute reached by mutual concession","example":"A durable compromise honours core dignity on both sides.","exampleAz":"Davamlı kompromis hər iki tərəfin ləyaqətinə hörmət edir."},{"id":1641,"day":110,"indexInDay":6,"word":"Deadlock","phonetic":"/ˈded.lɒk/","pos":"noun","az":"Çıxılmaz vəziyyət","definition":"Situation in which no progress can be made","example":"Innovative ideas broke the diplomatic deadlock.","exampleAz":"İnnovativ fikirlər diplomatik çıxılmazlığı aradan qaldırdı."},{"id":1642,"day":110,"indexInDay":7,"word":"Grievance","phonetic":"/ˈɡriː.vəns/","pos":"noun","az":"Şikayət / İnciklik","definition":"Real or imagined cause for complaint, especially unfair treatment","example":"Address the underlying grievance rather than the symptom.","exampleAz":"Simptomun deyil, əsas incikliyin kökünə baxın."},{"id":1643,"day":110,"indexInDay":8,"word":"Empathy","phonetic":"/ˈem.pə.θi/","pos":"noun","az":"Şəfqət / Qarşılıqlı anlama","definition":"Ability to share and understand another person’s feelings","example":"Empathy dissolves antagonism faster than defensive arguments.","exampleAz":"Empatiya düşmənçiliyi müdafiəvi arqumentlərdən daha tez yox edir."},{"id":1644,"day":110,"indexInDay":9,"word":"Hostility","phonetic":"/hɒsˈtɪl.ə.ti/","pos":"noun","az":"Düşmənçilik / Ədavət","definition":"Hostile behavior or unfriendliness","example":"De-escalate workplace hostility with calm composure.","exampleAz":"Təmkinli sakitliklə iş yerindəki gərginliyi səngidin."},{"id":1645,"day":110,"indexInDay":10,"word":"De-escalate","phonetic":"/diːˈes.kə.leɪt/","pos":"verb","az":"Gərginliyi azaltmaq / Səngitmək","definition":"Reduce the intensity of a conflict or potentially violent situation","example":"A gentle speaking voice helps de-escalate tension.","exampleAz":"Mülayim danışıq səsi gərginliyi səngitməyə kömək edir."},{"id":1646,"day":110,"indexInDay":11,"word":"Dialogue","phonetic":"/ˈdaɪ.ə.lɒɡ/","pos":"noun","az":"Dialoq","definition":"Conversation between two or more people to resolve problem","example":"Patient dialogue is the indispensable pathway to peace.","exampleAz":"Səbirli dialoq sülhə aparan əvəzolunmaz yoldur."},{"id":1647,"day":110,"indexInDay":12,"word":"Neutral","phonetic":"/ˈnjuː.trəl/","pos":"adj","az":"Neytral / Qərəzsiz","definition":"Not supporting or helping either side in a conflict","example":"The mediator maintained a strictly neutral stance.","exampleAz":"Vasitəçi tamamilə neytral bir mövqe saxladı."},{"id":1648,"day":110,"indexInDay":13,"word":"Settlement","phonetic":"/ˈset.əl.mənt/","pos":"noun","az":"Nizamlanma / Razılaşma","definition":"Official agreement ending an argument or dispute","example":"The dispute settlement secured mutual benefits.","exampleAz":"Mübahisənin nizamlanması qarşılıqlı faydaları təmin etdi."},{"id":1649,"day":110,"indexInDay":14,"word":"Concession","phonetic":"/kənˈseʃ.ən/","pos":"noun","az":"Güzəşt","definition":"Thing granted in response to demands","example":"Making a small concession built mutual confidence.","exampleAz":"Kiçik bir güzəştə getmək qarşılıqlı inam yaratdı."},{"id":1650,"day":110,"indexInDay":15,"word":"Harmony","phonetic":"/ˈhɑː.mə.ni/","pos":"noun","az":"Harmoniya / Həmrəylik","definition":"Agreement or concord in feeling or action","example":"Strive for lasting harmony in all personal and professional ties.","exampleAz":"Bütün şəxsi və peşəkar əlaqələrdə daimi harmoniyaya can atın."}]},{"day":111,"level":"B2","theme":"Critical Thinking & Fallacies","themeAz":"Tənqidi Düşüncə və Məntiq Xətaları","wordCount":15,"words":[{"id":1651,"day":111,"indexInDay":1,"word":"Fallacy","phonetic":"/ˈfæl.ə.si/","pos":"noun","az":"Məntiq xətası / Yanılsama","definition":"Mistaken belief or failure in reasoning rendering argument invalid","example":"Detecting the slippery slope fallacy preserves objective analysis.","exampleAz":"Uydurma qorxu xətasını aşkar etmək obyektiv təhlili qoruyur."},{"id":1652,"day":111,"indexInDay":2,"word":"Premise","phonetic":"/ˈprem.ɪs/","pos":"noun","az":"İlkin müddəa / Əsas şərt","definition":"Proposition supporting or helping to draw a conclusion","example":"Verify the foundational premise before accepting deductions.","exampleAz":"Nəticəni qəbul etməzdən əvvəl təməl müddəanı yoxlayın."},{"id":1653,"day":111,"indexInDay":3,"word":"Syllogism","phonetic":"/ˈsɪl.ə.dʒɪ.zəm/","pos":"noun","az":"Silogizm / Məntiqi çıxarış","definition":"Form of deductive reasoning consisting of major premise, minor, conclusion","example":"Aristotle analyzed deductive syllogisms in formal logic.","exampleAz":"Aristotel formal məntiqdə deduktiv silogizmləri təhlil etmişdir."},{"id":1654,"day":111,"indexInDay":4,"word":"Circular","phonetic":"/ˈsɜː.kjə.lər/","pos":"adj","az":"Dövrəvi (məntiqsiz)","definition":"Using conclusion as premise; redundant reasoning","example":"Avoid circular reasoning where the claim assumes itself.","exampleAz":"İddianın özünü əsas götürdüyü dövrəvi məntiqsizlikdən çəkinin."},{"id":1655,"day":111,"indexInDay":5,"word":"Deduction","phonetic":"/dɪˈdʌk.ʃən/","pos":"noun","az":"Deduksiya","definition":"Inference of particular instances from a general law","example":"By logical deduction, we reached the correct solution.","exampleAz":"Məntiqi deduksiya ilə düzgün həllə çatdıq."},{"id":1656,"day":111,"indexInDay":6,"word":"Induction","phonetic":"/ɪnˈdʌk.ʃən/","pos":"noun","az":"İnduksiya","definition":"Inference of general law from particular instances","example":"Scientific induction generalizes patterns from repeated tests.","exampleAz":"Elmi induksiya təkrarlanan sınaqlardan qanunauyğunluqlar hasil edir."},{"id":1657,"day":111,"indexInDay":7,"word":"Cognitive","phonetic":"/ˈkɒɡ.nə.tɪv/","pos":"adj","az":"İdraki / Koqnitiv","definition":"Relating to cognition or mental action of acquiring knowledge","example":"Critical reflection overcomes innate cognitive blind spots.","exampleAz":"Tənqidi düşüncə fitri koqnitiv kor nöqtələri aradan qaldırır."},{"id":1658,"day":111,"indexInDay":8,"word":"Skepticism","phonetic":"/ˈskep.tɪ.sɪ.zəm/","pos":"noun","az":"Skeptisizm / Sağlam şübhəçilik","definition":"Skeptical attitude; doubt as to the truth of something","example":"Healthy scientific skepticism demands empirical validation.","exampleAz":"Sağlam elmi skeptisizm empirik təsdiq tələb edir."},{"id":1659,"day":111,"indexInDay":9,"word":"Credibility","phonetic":"/ˌkred.əˈbɪl.ə.ti/","pos":"noun","az":"Etibarlılıq / İnam","definition":"Quality of being convincing or believable","example":"Citing reputable peer-reviewed research enhances credibility.","exampleAz":"Nüfuzlu elmi mənbələrə istinad etmək etibarlılığı artırır."},{"id":1660,"day":111,"indexInDay":10,"word":"Refutation","phonetic":"/ˌref.jəˈteɪ.ʃən/","pos":"noun","az":"Təkzib / Əsassızlığın sübutu","definition":"Action of proving a statement or theory to be wrong","example":"Her mathematical refutation dismantled the old theorem.","exampleAz":"Onun riyazi təkzibi köhnə teoremi darmadağın etdi."},{"id":1661,"day":111,"indexInDay":11,"word":"Assertion","phonetic":"/əˈsɜː.ʃən/","pos":"noun","az":"İddia / Təsdiq","definition":"Confident and forceful statement of fact or belief","example":"An unsupported assertion carries no scientific weight.","exampleAz":"Sübutsuz iddia heç bir elmi çəki daşımır."},{"id":1662,"day":111,"indexInDay":12,"word":"Correlation","phonetic":"/ˌkɒr.əˈleɪ.ʃən/","pos":"noun","az":"Korrelyasiya / Qarşılıqlı əlaqə","definition":"Mutual relationship between two things, not necessarily cause","example":"Remember: statistical correlation does not equal causation.","exampleAz":"Yadda saxlayın: statistik korrelyasiya səbəbiyyət demək deyil."},{"id":1663,"day":111,"indexInDay":13,"word":"Critique","phonetic":"/krɪˈtiːk/","pos":"verb","az":"Tənqid etmək / Təhlil etmək","definition":"Evaluate a theory or practice in a detailed and analytical way","example":"Critique your own essays to spot stylistic redundancies.","exampleAz":"Üslub qüsurlarını tapmaq üçün öz esselərinizi təhlil edin."},{"id":1664,"day":111,"indexInDay":14,"word":"Coherent","phonetic":"/kəʊˈhɪə.rənt/","pos":"adj","az":"Məntiqli / Ahəngdar / Ardıcıl","definition":"Logical and consistent; clearly reasoned","example":"A coherent argument flows smoothly from point to point.","exampleAz":"Məntiqli arqument fikirdən-fikrə rəvan şəkildə axır."},{"id":1665,"day":111,"indexInDay":15,"word":"Vigilant","phonetic":"/ˈvɪdʒ.əl.ənt/","pos":"adj","az":"Ayıq-sayıq / Diqqətli","definition":"Keeping careful watch for possible dangers or difficulties","example":"Stay vigilant against subtle persuasive propaganda.","exampleAz":"Hiyləgər inandırma təbliğatına qarşı ayıq-sayıq olun."}]},{"day":112,"level":"B2","theme":"Supply Chain & Logistics","themeAz":"Təchizat Zənciri və Logistika","wordCount":15,"words":[{"id":1666,"day":112,"indexInDay":1,"word":"Logistics","phonetic":"/ləˈdʒɪs.tɪks/","pos":"noun","az":"Logistika","definition":"Detailed organization and implementation of complex operations","example":"Baku’s modern international sea port coordinates Eurasian logistics.","exampleAz":"Bakının müasir beynəlxalq dəniz limanı Avrasiya logistikasını əlaqələndirir."},{"id":1667,"day":112,"indexInDay":2,"word":"Supply chain","phonetic":"/səˈplaɪ tʃeɪn/","pos":"noun","az":"Təchizat zənciri","definition":"Sequence of processes involved in production and distribution","example":"Resilient supply chains withstand geopolitical turbulence.","exampleAz":"Dözümlü təchizat zəncirləri geosiyasi çətinliklərə tab gətirir."},{"id":1668,"day":112,"indexInDay":3,"word":"Warehouse","phonetic":"/ˈweə.haʊs/","pos":"noun","az":"Anbar","definition":"Large building where raw materials or goods may be stored","example":"Automated robotic warehouses process shipments day and night.","exampleAz":"Avtomatlaşdırılmış robot anbarlar yükləri gecə-gündüz emal edir."},{"id":1669,"day":112,"indexInDay":4,"word":"Inventory","phonetic":"/ˈɪn.vən.tər.i/","pos":"noun","az":"İnventar / Mal qalığı","definition":"Complete list of items such as property, goods in stock","example":"Just-in-time manufacturing minimizes idle inventory costs.","exampleAz":"Dəqiq vaxtında istehsalat boş dayanan anbar xərclərini azaldır."},{"id":1670,"day":112,"indexInDay":5,"word":"Freight","phonetic":"/freɪt/","pos":"noun","az":"Yük daşınması","definition":"Goods transported in bulk by truck, train, ship, or aircraft","example":"Rail freight along the Middle Corridor expands swiftly.","exampleAz":"Orta Dəhliz boyu dəmir yolu yük daşımaları sürətlə genişlənir."},{"id":1671,"day":112,"indexInDay":6,"word":"Consignment","phonetic":"/kənˈsaɪn.mənt/","pos":"noun","az":"Partiya (malın) / Göndərilən yük","definition":"Batch of goods delivered to someone","example":"Inspect the incoming fruit consignment for prime freshness.","exampleAz":"Gələn meyvə partiyasını yüksək təravət üçün yoxlayın."},{"id":1672,"day":112,"indexInDay":7,"word":"Procurement","phonetic":"/prəˈkjʊə.mənt/","pos":"noun","az":"Tədarük / Satınalma","definition":"Action of obtaining or procuring equipment or supplies","example":"Transparent digital procurement eradicates favoritism.","exampleAz":"Şəffaf rəqəmsal satınalma qərəzliliyi aradan qaldırır."},{"id":1673,"day":112,"indexInDay":8,"word":"Distribution","phonetic":"/ˌdɪs.trɪˈbjuː.ʃən/","pos":"noun","az":"Bölüşdürmə / Paylama","definition":"Action of sharing something out among a number of recipients","example":"An agile distribution network shortens delivery times.","exampleAz":"Çevik paylama şəbəkəsi çatdırılma müddətlərini qısaldır."},{"id":1674,"day":112,"indexInDay":9,"word":"Customs","phonetic":"/ˈkʌs.təmz/","pos":"noun","az":"Gömrük","definition":"Official department that collects duties on imported goods","example":"Automated green customs corridors speed transit clearance.","exampleAz":"Avtomatlaşdırılmış yaşıl gömrük dəhlizləri keçidi sürətləndirir."},{"id":1675,"day":112,"indexInDay":10,"word":"Fulfillment","phonetic":"/fʊlˈfɪl.mənt/","pos":"noun","az":"Sifarişin icrası","definition":"Process of receiving, packaging, and shipping orders","example":"E-commerce fulfillment centers dispatch parcels globally.","exampleAz":"Elektron ticarət sifariş icra mərkəzləri bağlamaları dünyaya göndərir."},{"id":1676,"day":112,"indexInDay":11,"word":"Vendor","phonetic":"/ˈven.dər/","pos":"noun","az":"Təchizatçı / Satıcı","definition":"Person or company offering something for sale","example":"Cultivate reliable partnerships with ethical suppliers and vendors.","exampleAz":"Etik təchizatçılar və satıcılarla etibarlı tərəfdaşlıqlar qurun."},{"id":1677,"day":112,"indexInDay":12,"word":"Transit","phonetic":"/ˈtræn.zɪt/","pos":"noun","az":"Tranzit / Keçid","definition":"Action of passing through or across a place","example":"Azerbaijan is an essential Eurasian transit hub.","exampleAz":"Azərbaycan mühüm Avrasiya tranzit qovşağıdır."},{"id":1678,"day":112,"indexInDay":13,"word":"Fleet","phonetic":"/fliːt/","pos":"noun","az":"Donanma / Park (avtomobil/təyyarə)","definition":"Number of vehicles, aircraft, or ships operating under one agency","example":"The logistics carrier expanded its electric truck fleet.","exampleAz":"Logistika şirkəti elektrik yük maşınları parkını genişləndirdi."},{"id":1679,"day":112,"indexInDay":14,"word":"Depot","phonetic":"/ˈdep.əʊ/","pos":"noun","az":"Depo / Baza","definition":"Place for the storage of large quantities of goods","example":"Trains return to the central depot for safety inspection.","exampleAz":"Qatar təhlükəsizlik müayinəsi üçün mərkəzi depoya qayıdır."},{"id":1680,"day":112,"indexInDay":15,"word":"Cargo","phonetic":"/ˈkɑː.ɡəʊ/","pos":"noun","az":"Yük (gəmi/təyyarə)","definition":"Goods carried on a ship, aircraft, or motor vehicle","example":"Air cargo connects global producers with distant markets.","exampleAz":"Hava karqosu qlobal istehsalçıları uzaq bazarlarla əlaqələndirir."}]},{"day":113,"level":"B2","theme":"Customer Experience & Retention","themeAz":"Müştəri Məmnuniyyəti və Loyallıq","wordCount":15,"words":[{"id":1681,"day":113,"indexInDay":1,"word":"Retention","phonetic":"/rɪˈten.ʃən/","pos":"noun","az":"Müştərini saxlama / Qoruma","definition":"Continued use or patronage of a service by existing buyers","example":"Exceptional UX is the single greatest driver of user retention.","exampleAz":"Müstəsna istifadəçi təcrübəsi müştərini saxlamağın ən güclü amilidir."},{"id":1682,"day":113,"indexInDay":2,"word":"Touchpoint","phonetic":"/ˈtʌtʃ.pɔɪnt/","pos":"noun","az":"Təmas nöqtəsi","definition":"Any point of contact between a buyer and a seller","example":"Optimize every digital touchpoint for clarity and beauty.","exampleAz":"Hər bir rəqəmsal təmas nöqtəsini aydınlıq və gözəllik üçün optimallaşdırın."},{"id":1683,"day":113,"indexInDay":3,"word":"Onboarding","phonetic":"/ˈɒnˌbɔː.dɪŋ/","pos":"noun","az":"İlk bələdçilik / Qarşılama","definition":"Process of introducing a user to a product or service","example":"A gentle onboarding tour empowers new learners immediately.","exampleAz":"Səmimi qarşılama bələdçisi yeni öyrənənlərə dərhal güc verir."},{"id":1684,"day":113,"indexInDay":4,"word":"Churn","phonetic":"/tʃɜːn/","pos":"noun","az":"Müştəri itkisi dərəcəsi","definition":"Rate at which customers stop doing business with an entity","example":"Proactive customer care dramatically reduces subscription churn.","exampleAz":"Qabaqlayıcı müştəri qayğısı abunə itkisi faizini kəskin azaldır."},{"id":1685,"day":113,"indexInDay":5,"word":"Satisfaction","phonetic":"/ˌsæt.ɪsˈfæk.ʃən/","pos":"noun","az":"Məmnuniyyət","definition":"Fulfillment of one’s expectations or needs","example":"Your study satisfaction is our sole engineering metric.","exampleAz":"Sizin oxu məmnuniyyətiniz bizim yeganə mühəndislik meyarıdır."},{"id":1686,"day":113,"indexInDay":6,"word":"Advocacy","phonetic":"/ˈæd.və.kə.si/","pos":"noun","az":"Tərəfdarlıq / Müdafiə","definition":"Public support for or recommendation of a particular product","example":"Delighted learners provide spontaneous organic advocacy.","exampleAz":"Məmnun tələbələr tətbiqi səmimi könüllü tərəfdarlıqla tövsiyə edirlər."},{"id":1687,"day":113,"indexInDay":7,"word":"Empathy","phonetic":"/ˈem.pə.θi/","pos":"noun","az":"Empatiya / Şəfqətli anlama","definition":"Ability to understand and share the feelings of a user","example":"Design customer support interfaces with authentic empathy.","exampleAz":"Müştəri dəstək interfeyslərini səmimi empatiya ilə dizayn edin."},{"id":1688,"day":113,"indexInDay":8,"word":"Personalization","phonetic":"/ˌpɜː.sən.əl.aɪˈzeɪ.ʃən/","pos":"noun","az":"Fərdiləşdirmə","definition":"Action of designing or producing something to meet individual requirements","example":"Algorithmic personalization adapts quizzes to individual weak spots.","exampleAz":"Alqoritmik fərdiləşdirmə testləri hər kəsin zəif nöqtələrinə uyğunlaşdırır."},{"id":1689,"day":113,"indexInDay":9,"word":"NPS","phonetic":"/ˌen.piːˈes/","pos":"noun","az":"Net Promoter Score / Müştəri sədaqəti göstəricisi","definition":"Metric assessing customer willingness to recommend a product","example":"Our educational app boasts an industry-leading NPS score.","exampleAz":"Tədris tətbiqimiz sahə üzrə ən yüksək müştəri sədaqəti göstəricisinə malikdir."},{"id":1690,"day":113,"indexInDay":10,"word":"Seamless","phonetic":"/ˈsiːm.ləs/","pos":"adj","az":"Qüsursuz / Axıcı / Maneəsiz","definition":"Smooth and continuous, with no apparent gaps or difficulties","example":"The transition between mobile and desktop study is seamless.","exampleAz":"Mobil və kompüterlə oxu arasındakı keçid tamamilə maneəsizdir."},{"id":1691,"day":113,"indexInDay":11,"word":"Interface","phonetic":"/ˈɪn.tə.feɪs/","pos":"noun","az":"İnterfeys","definition":"Device or program enabling a user to communicate with a computer","example":"Clean typography creates an interface of timeless elegance.","exampleAz":"Aydın tipoqrafiya zamansız zəriflikdə bir interfeys yaradır."},{"id":1692,"day":113,"indexInDay":12,"word":"Journey","phonetic":"/ˈdʒɜː.ni/","pos":"noun","az":"İstifadəçi yolu / Təcrübə səyahəti","definition":"Path of interactions a customer takes with a brand","example":"Every step in the 160-day learning journey is celebrated.","exampleAz":"160 günlük öyrənmə səyahətinin hər bir addımı qeyd olunur."},{"id":1693,"day":113,"indexInDay":13,"word":"Feedback","phonetic":"/ˈfiːd.bæk/","pos":"noun","az":"Müştəri rəyi","definition":"Helpful reactions informing product development","example":"We incorporated user feedback into this revise
