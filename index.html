<!DOCTYPE html>
<html lang="az" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="160 Günlük İngilis">
  <meta name="theme-color" content="#09090b">
  <title>160 Günlük İngilis Dili - iPhone Edition (2400 Söz)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --card-subtle: #27272a;
      --card-border: #27272a;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-subtle: rgba(99, 102, 241, 0.15);
      --success: #10b981;
      --amber: #f59e0b;
      --rose: #ef4444;
      --font: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    [data-theme="light"] {
      --bg: #f8fafc;
      --card: #ffffff;
      --card-subtle: #f1f5f9;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-subtle: rgba(79, 70, 229, 0.1);
      --success: #10b981;
      --amber: #f59e0b;
      --rose: #ef4444;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.45;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      background-attachment: fixed;
    }
    /* Mobile Phone Shell Container */
    #app-container {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 50px rgba(0,0,0,0.5);
    }
    @media (min-width: 640px) {
      body {
        background-color: #050508;
        padding: 20px 0;
      }
      #app-container {
        border-radius: 44px;
        overflow: hidden;
        border: 4px solid #27272a;
        max-height: 94vh;
      }
    }
    /* iOS Status Bar & Dynamic Island */
    .ios-status-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg);
      padding: 10px 20px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
    }
    .dynamic-island {
      height: 26px;
      background: #000;
      color: #fff;
      border-radius: 9999px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
      transition: all 0.3s ease;
      min-width: 110px;
    }
    .dynamic-island.playing {
      min-width: 170px;
      border: 1px solid rgba(99, 102, 241, 0.4);
    }
    .ios-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    /* Main Navigation Header */
    .app-header {
      padding: 10px 14px;
      background: var(--bg);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 43px;
      z-index: 40;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .day-selector-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .level-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      background: var(--primary-subtle);
      color: var(--primary);
      border: 1px solid rgba(99,102,241,0.3);
      font-weight: 700;
    }
    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .icon-btn:active {
      transform: scale(0.92);
    }
    .streak-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #f59e0b;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }
    .header-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-top: 10px;
    }
    .action-btn {
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 8px 6px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .action-btn:active {
      transform: scale(0.95);
    }
    .action-btn.active {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    /* Main Content */
    #content-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      padding-bottom: 90px;
    }
    /* Day Banner */
    .day-banner {
      background: linear-gradient(135deg, rgba(99,102,241,0.18), var(--card));
      border: 1px solid rgba(99,102,241,0.25);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .day-banner-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .day-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
      margin-top: 4px;
    }
    .day-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }
    .progress-bar-container {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--card-border);
    }
    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 6px;
      color: var(--text-muted);
    }
    .progress-bar {
      height: 7px;
      background: var(--card-subtle);
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #a855f7);
      border-radius: 10px;
      transition: width 0.4s ease;
    }
    /* Word Cards */
    .word-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 10px;
      transition: all 0.2s;
    }
    .word-card.learned {
      border-color: rgba(16, 185, 129, 0.3);
      background: rgba(16, 185, 129, 0.04);
    }
    .word-card.active-playing {
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(99,102,241,0.3);
    }
    .word-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .word-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
    }
    .word-phonetic {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
      margin-left: 6px;
    }
    .word-pos {
      display: inline-block;
      font-size: 9px;
      text-transform: uppercase;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      background: var(--card-subtle);
      color: var(--text-muted);
      margin-left: 6px;
    }
    .word-az {
      font-size: 14px;
      font-weight: 700;
      color: #34d399;
      margin-top: 3px;
    }
    .word-actions {
      display: flex;
      gap: 6px;
    }
    .small-icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--card-subtle);
      border: 1px solid var(--card-border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .small-icon-btn.active-bookmark {
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.4);
    }
    .small-icon-btn.active-learned {
      color: #fff;
      background: var(--success);
      border-color: var(--success);
    }
    .word-def {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
    }
    .word-example-box {
      margin-top: 8px;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 12px;
    }
    .example-en {
      font-style: italic;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .example-az {
      color: var(--text-muted);
      font-size: 11px;
      margin-top: 2px;
    }
    /* iOS Bottom Tab Bar */
    .ios-tab-bar {
      position: sticky;
      bottom: 0;
      z-index: 50;
      background: var(--bg);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      padding: 6px 4px 10px;
      backdrop-filter: blur(15px);
    }
    .tab-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 0;
      position: relative;
    }
    .tab-btn.active {
      color: var(--primary);
      font-weight: 700;
    }
    .tab-btn svg {
      width: 20px;
      height: 20px;
      margin-bottom: 2px;
    }
    .tab-badge {
      position: absolute;
      top: 0;
      right: 25%;
      background: var(--rose);
      color: #fff;
      font-size: 9px;
      font-weight: 800;
      border-radius: 10px;
      padding: 1px 5px;
    }
    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal-box {
      width: 100%;
      max-width: 380px;
      max-height: 85vh;
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .modal-header {
      padding: 14px 18px;
      background: var(--card);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 14px;
    }
    .modal-content {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
    }
    /* 3D Flip Card */
    .flashcard-wrap {
      perspective: 1000px;
      height: 320px;
      width: 100%;
      margin: 10px 0;
    }
    .flashcard {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s;
      cursor: pointer;
    }
    .flashcard.flipped {
      transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid var(--card-border);
    }
    .card-face.front {
      background: linear-gradient(145deg, var(--card), #121217);
      text-align: center;
    }
    .card-face.back {
      background: linear-gradient(145deg, #1e1b4b, var(--card));
      transform: rotateY(180deg);
      border-color: rgba(99,102,241,0.4);
      text-align: center;
    }
  </style>
</head>
<body>

<div id="app-container">
  <!-- iOS Status Bar & Dynamic Island -->
  <div class="ios-status-bar">
    <div id="status-clock" style="width: 45px;">09:41</div>
    
    <div class="dynamic-island" id="dynamic-island">
      <span id="island-text" style="color: #a1a1aa;">160 Günlük</span>
      <span id="island-icon" style="color: #6366f1;">●</span>
    </div>
    
    <div class="ios-icons">
      <span>5G</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
      <div style="width: 20px; height: 10px; border: 1px solid currentColor; border-radius: 3px; padding: 1px; display: flex;">
        <div style="width: 75%; height: 100%; background: #10b981; border-radius: 1px;"></div>
      </div>
    </div>
  </div>

  <!-- App Header -->
  <div class="app-header">
    <div class="header-top">
      <div style="display: flex; align-items: center; gap: 4px;">
        <button class="icon-btn" onclick="prevDay()" title="Əvvəlki Gün">‹</button>
        <button class="day-selector-btn" onclick="openDayPicker()">
          <span id="header-day-label">Gün 1</span>
          <span class="level-badge" id="header-level-badge">A1</span>
        </button>
        <button class="icon-btn" onclick="nextDay()" title="Növbəti Gün">›</button>
      </div>

      <div style="display: flex; align-items: center; gap: 6px;">
        <div class="streak-badge">
          <span>🔥</span>
          <span id="streak-counter">1 gün</span>
        </div>

        <!-- DIRECT DOWNLOAD BUTTON (downloads this complete file immediately) -->
        <button class="icon-btn" onclick="downloadThisSelfContainedFile()" title="Bu Faylı Yüklə (.html)" style="background: rgba(99,102,241,0.2); border-color: rgba(99,102,241,0.4); color: #818cf8;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        </button>

        <button class="icon-btn" onclick="toggleTheme()" title="Qaranlıq / İşıqlı rejim">🌓</button>
      </div>
    </div>

    <!-- Quick action buttons -->
    <div class="header-actions">
      <button class="action-btn" onclick="openFlashcards()">
        <span>🎴</span>
        <span>Fləşkart</span>
      </button>

      <button class="action-btn" onclick="openQuiz()">
        <span>🎯</span>
        <span>Test Et</span>
      </button>

      <button class="action-btn" id="autoplay-btn" onclick="toggleAutoplay()">
        <span>🎧</span>
        <span id="autoplay-text">Hamısı Dinlə</span>
      </button>
    </div>
  </div>

  <!-- Main Views Container -->
  <div id="content-area"></div>

  <!-- iOS Bottom Tab Bar -->
  <div class="ios-tab-bar">
    <button class="tab-btn active" id="tab-learn" onclick="switchTab('learn')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      <span>Dərslər</span>
    </button>
    <button class="tab-btn" id="tab-plan" onclick="switchTab('plan')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>160 Gün</span>
    </button>
    <button class="tab-btn" id="tab-search" onclick="switchTab('search')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Axtarış</span>
    </button>
    <button class="tab-btn" id="tab-saved" onclick="switchTab('saved')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
      <span>Yaddaş</span>
      <span class="tab-badge" id="saved-badge" style="display: none;">0</span>
    </button>
    <button class="tab-btn" id="tab-stats" onclick="switchTab('stats')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span>Tərəqqi</span>
    </button>
  </div>
</div>

<!-- Day Picker Modal -->
<div class="modal-overlay" id="day-picker-modal">
  <div class="modal-box">
    <div class="modal-header">
      <span>160 Günlük Təqvim</span>
      <button class="icon-btn" onclick="closeModals()">✕</button>
    </div>
    <div class="modal-content" id="day-picker-grid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;"></div>
  </div>
</div>

<!-- Flashcards Modal -->
<div class="modal-overlay" id="flashcard-modal">
  <div class="modal-box" style="height: 520px;">
    <div class="modal-header">
      <span id="fc-title">Fləşkartlar</span>
      <div style="display: flex; gap: 4px;">
        <button class="icon-btn" onclick="shuffleFlashcards()" title="Qarışdır">🔀</button>
        <button class="icon-btn" onclick="closeModals()">✕</button>
      </div>
    </div>
    <div class="modal-content" style="display: flex; flex-direction: column; justify-content: space-between;">
      <div id="fc-progress-text" style="font-size: 12px; color: var(--text-muted); text-align: center;">Kart 1 / 15</div>
      
      <div class="flashcard-wrap" onclick="flipFlashcard()">
        <div class="flashcard" id="fc-card">
          <div class="card-face front">
            <span id="fc-pos" style="font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 700;">PHRASE</span>
            <div style="margin: auto 0;">
              <h2 id="fc-word" style="font-size: 28px; font-weight: 800;">Hello</h2>
              <p id="fc-phonetic" style="font-family: monospace; color: #818cf8; margin-top: 6px;">/həˈləʊ/</p>
            </div>
            <p style="font-size: 11px; color: var(--text-muted);">Tərcümə üçün toxunun ↺</p>
          </div>
          
          <div class="card-face back">
            <span style="font-size: 12px; font-weight: 700; color: #818cf8;">Tərcümə</span>
            <div style="margin: auto 0;">
              <h3 id="fc-az" style="font-size: 22px; font-weight: 800; color: #34d399;">Salam</h3>
              <p id="fc-def" style="font-size: 12px; color: var(--text-muted); margin-top: 8px;">A common greeting</p>
              <p id="fc-ex" style="font-size: 11px; font-style: italic; color: var(--text); margin-top: 8px;">"Hello! Welcome."</p>
            </div>
            <p style="font-size: 11px; color: var(--text-muted);">Geri qayıtmaq üçün toxunun ↺</p>
          </div>
        </div>
      </div>

      <div style="display: flex; gap: 8px; align-items: center;">
        <button class="icon-btn" onclick="prevFlashcard()">‹</button>
        <button style="flex: 1; padding: 10px; border-radius: 12px; background: var(--card-subtle); border: 1px solid var(--card-border); color: var(--text); font-weight: 600; cursor: pointer;" onclick="nextFlashcard()">Təkrar Et</button>
        <button style="flex: 1; padding: 10px; border-radius: 12px; background: #10b981; border: none; color: #fff; font-weight: 700; cursor: pointer;" onclick="markFlashcardKnown()">Bildim! ✓</button>
        <button class="icon-btn" onclick="nextFlashcard()">›</button>
      </div>
    </div>
  </div>
</div>

<!-- Quiz Modal -->
<div class="modal-overlay" id="quiz-modal">
  <div class="modal-box" style="height: 540px;">
    <div class="modal-header">
      <span id="quiz-header-title">Günün Testi</span>
      <button class="icon-btn" onclick="closeModals()">✕</button>
    </div>
    <div class="modal-content" id="quiz-body" style="display: flex; flex-direction: column; justify-content: space-between;"></div>
  </div>
</div>

<script>
  // EMBEDDED COMPLETE DATASET (ALL 160 DAYS, 2400 WORDS)

of facts indicating whether belief is valid","example":"Empirical evidence substantiates every valid claim.","exampleAz":"Empirik sübutlar hər bir etibarlı iddianı təsdiqləyir."},{"id":832,"day":56,"indexInDay":7,"word":"Gravity","phonetic":"/ˈɡræv.ə.ti/","pos":"noun","az":"Qravitasiya / Cazibə qüvvəsi","definition":"Force that attracts bodies toward center of the earth","example":"Gravity keeps our atmosphere wrapped securely around earth.","exampleAz":"Cazibə qüvvəsi atmosferimizi yer ətrafında etibarlı saxlayır."},{"id":833,"day":56,"indexInDay":8,"word":"Energy","phonetic":"/ˈen.ə.dʒi/","pos":"noun","az":"Enerji","definition":"Capacity of physical systems to perform work","example":"Energy cannot be created or destroyed, only transformed.","exampleAz":"Enerji nə yoxdan yaranır, nə də itir, sadəcə formasını dəyişir."},{"id":834,"day":56,"indexInDay":9,"word":"Element","phonetic":"/ˈel.ɪ.mənt/","pos":"noun","az":"Element","definition":"Substance that cannot be broken down chemically","example":"Carbon is the quintessential element of organic life.","exampleAz":"Karbon üzvi həyatın ən vacib təməl elementidir."},{"id":835,"day":56,"indexInDay":10,"word":"Molecule","phonetic":"/ˈmɒl.ɪ.kjuːl/","pos":"noun","az":"Molekul","definition":"Group of atoms bonded together","example":"A single water molecule consists of hydrogen and oxygen.","exampleAz":"Bircə su molekulu hidrogen və oksigendən ibarətdir."},{"id":836,"day":56,"indexInDay":11,"word":"Invention","phonetic":"/ɪnˈven.ʃən/","pos":"noun","az":"İxtira","definition":"Action of inventing something, or the new process created","example":"The printing press was an invention that spread enlightenment.","exampleAz":"Çap maşını maariflənmə yayan böyük bir ixtira idi."},{"id":837,"day":56,"indexInDay":12,"word":"Research","phonetic":"/rɪˈsɜːtʃ/","pos":"noun","az":"Tədqiqat","definition":"Systematic investigation into sources","example":"Peer-reviewed research ensures scientific validity.","exampleAz":"Rəydən keçmiş tədqiqat king emails.","exampleAz":"Məktubları yoxlamazdan əvvəl əsas oxu tapşırıqlarını önə çəkin."},{"id":844,"day":57,"indexInDay":4,"word":"Distraction","phonetic":"/dɪˈstræk.ʃən/","pos":"noun","az":"Fikri yayan amil","definition":"Thing that prevents someone from concentrating","example":"Eliminate smartphone distraction during study hours.","exampleAz":"Dərs saatlarında smartfonun fikri yayındırmasını aradan qaldırın."},{"id":845,"day":57,"indexInDay":5,"word":"Efficiency","phonetic":"/ɪˈfɪʃ.ən.si/","pos":"noun","az":"Səmərəlilik / Çeviklik","definition":"Ability to accomplish a task without wasting materials or time","example":"Spaced review enhances memory efficiency fivefold.","exampleAz":"Aralıqlı təkrar yaddaş səmərəliliyini beş qat artırır."},{"id":846,"day":57,"indexInDay":6,"word":"Procrastination","phonetic":"/prəʊˌkræs.tɪˈneɪ.ʃən/","pos":"noun","az":"Təxirəsalma / İşi yubatma","definition":"Action of delaying or postponing something","example":"Procrastination steals time; act with immediate decisiveness.","exampleAz":"İşi yubatma vaxt oğurlayır; dərhal qətiyyətlə hərəkət edin."},{"id":847,"day":57,"indexInDay":7,"word":"Habit","phonetic":"/ˈhæb.ɪt/","pos":"noun","az":"Vərdiş","definition":"Settled or regular tendency or practice","example":"Learning fifteen words daily is a life-changing habit.","exampleAz":"Hər gün 15 söz öyrənmək həyatı dəyişən bir vərdişdir."},{"id":848,"day":57,"indexInDay":8,"word":"Routine","phonetic":"/ruːˈtiːn/","pos":"noun","az":"Gündəlik rejim / Qayda","definition":"Sequence of actions regularly followed","example":"A structured study routine eliminates decision fatigue.","exampleAz":"Nizamlı oxu rejimi qərar qəbul etmə yorğunluğunu yox edir."},{"id":849,"day":57,"indexInDay":9,"word":"Milestone","phonetic":"/ˈmaɪl.stəʊn/","pos":"noun","az":"Mərhələ / Mühüm hadisə","definition":"Action or event marking significant stage in development","example":"Day 50 is a significant intermediate milestone.","exampleAz":"50-ci gün mühüm bir orta g Materials & Textures","themeAz":"Materiallar və Teksturalar","wordCount":15,"words":[{"id":856,"day":58,"indexInDay":1,"word":"Wood","phonetic":"/wʊd/","pos":"noun","az":"Ağac / Taxta","definition":"Hard fibrous material forming the trunk of trees","example":"Carved walnut wood is celebrated in traditional crafts.","exampleAz":"Oyma qoz ağacı ənənəvi sənətkarlıqda çox yüksək qiymətləndirilir."},{"id":857,"day":58,"indexInDay":2,"word":"Metal","phonetic":"/ˈmet.əl/","pos":"noun","az":"Metal","definition":"Solid material that is typically hard and conducts electricity","example":"Forged metal gates adorn historical mansions.","exampleAz":"Döymə metal darvazalar tarixi malikanələri bəzəyir."},{"id":858,"day":58,"indexInDay":3,"word":"Glass","phonetic":"/ɡlɑːs/","pos":"noun","az":"Şüşə","definition":"Hard, brittle, transparent substance","example":"The multifaceted glass facade sparkles in the sun.","exampleAz":"Çoxüzlü şüşə fasad günəşdə parıldayır."},{"id":859,"day":58,"indexInDay":4,"word":"Plastic","phonetic":"/ˈplæs.tɪk/","pos":"noun","az":"Plastik","definition":"Synthetic material made from polymers","example":"Reduce single-use plastic consumption to protect the oceans.","exampleAz":"Okeanları qorumaq üçün birdəfəlik plastik istifadəsini azaldın."},{"id":860,"day":58,"indexInDay":5,"word":"Leather","phonetic":"/ˈleð.ər/","pos":"noun","az":"Dəri (material)","definition":"Material made from hide of animals, tanned for use","example":"Handcrafted leather boots last for decades.","exampleAz":"Əl işi dəri çəkmələr onilliklər boyu davam gətirir."},{"id":861,"day":58,"indexInDay":6,"word":"Cotton","phonetic":"/ˈkɒt.ən/","pos":"noun","az":"Pambıq","definition":"Soft white fibrous substance surrounding seeds of plant","example":"Breathable cotton garments are ideal for hot summers.","exampleAz":"Nəfəs alan pambıq geyimlər isti yay üçün idealdır."},{"id":862,"day":58,"indexInDay":7,"word":"Silk","phonetic":"/sɪlk/","pos":"noun","az":"İpək","definition":"Fine, strong, soft lustrous fiber produced by silkworms","example":"Sheki silk is renowned along the ancient Silk Road.","exampleAz":"Şəki ipəyi qədim İpək Yolu boyunca məşhurdur."},{"id":863,"day":58,"indexInDay":8,"word":"Smooth","phonetic":"/smuːð/","pos":"adj","az":"Hamar / Hamarlanmış","definition":"Having an even and regular surface or consistency","example":"The marble countertop feels cool and smooth.","exampleAz":"Mərmər səth sərin və hamar hiss olunur."},{"id":864,"day":58,"indexInDay":9,"word":"Rough","phonetic":"/rʌf/","pos":"adj","az":"Kələ-kötür / Nahamar","definition":"Having an uneven or irregular surface, not smooth","example":"The rough stone walls stood strong against winter gales.","exampleAz":"Kələ-kötür daş divarlar qış küləklərinə mətanətlə dözdü."},{"id":865,"day":58,"indexInDay":10,"word":"Soft","phonetic":"/sɒft/","pos":"adj","az":"Yumşaq","definition":"Easy to press, bend, or cut; not hard or firm","example":"A soft wool blanket ensures cozy warmth.","exampleAz":"Yumşaq yun ədyal rahat isti təmin edir."},{"id":866,"day":58,"indexInDay":11,"word":"Hard","phonetic":"/hɑːd/","pos":"adj","az":"Bərk / Çətin","definition":"Solid, firm, and resistant to pressure","example":"Diamond is the hardest known natural mineral.","exampleAz":"Almaz məlum olan ən bərk təbii mineraldır."},{"id":867,"day":58,"indexInDay":12,"word":"Flexible","phonetic":"/ˈflek.sə.bəl/","pos":"adj","az":"Çevik / Əyilən","definition":"Capable of bending easily without breaking","example":"Flexible study habits adapt to unpredictable schedules.","exampleAz":"Çevik öyrənmə vərdişləri dəyişən qrafiklərə asanlıqla uyğunlaşır."},{"id":868,"day":58,"indexInDay":13,"word":"Transparent","phonetic":"/trænˈspær.ənt/","pos":"adj","az":"Şəffaf","definition":"Allowing light to pass through so objects are visible","example":"Pure mountain spring water is crystal transparent.","exampleAz":"Təmiz dağ bulaq suyu büllur kimi şəffafdır."},{"id":869,"day":58,"indexInDay":14,"word":"Durable","phonetic":"/ˈdʒʊə.rə.b ":"Buna baxmayaraq / Yenə də","definition":"In spite of that; nonetheless","example":"The trail was steep; nevertheless, they climbed the summit.","exampleAz":"Cığır sıldırım idi; buna baxmayaraq, zirvəni fəth etdilər."},{"id":1041,"day":70,"indexInDay":6,"word":"Meanwhile","phonetic":"/ˈmiːn.waɪl/","pos":"adv","az":"Bu arada / Eyni zamanda","definition":"In the intervening period of time","example":"Dinner simmered; meanwhile, we completed the vocabulary quiz.","exampleAz":"Yemək dəm alırdı; bu arada biz lüğət testini tamamladıq."},{"id":1042,"day":70,"indexInDay":7,"word":"Whereas","phonetic":"/weərˈæz/","pos":"conj","az":"Halbuki / Əksinə olaraq","definition":"In contrast or comparison with the fact that","example":"Some choose passive listening, whereas polyglots practice speaking.","exampleAz":"Bəziləri passiv dinləməni seçir, halbuki poliqlotlar danışığı məşq edirlər."},{"id":1043,"day":70,"indexInDay":8,"word":"Consequently","phonetic":"/ˈkɒn.sɪ.kwənt.li/","pos":"adv","az":"Nəticə etibarilə","definition":"As a result","example":"He mastered phonetics; consequently, his accent improved.","exampleAz":"O, fonetikanı mənimsədi; nəticə etibarilə tələffüzü xeyli yaxşılaşdı."},{"id":1044,"day":70,"indexInDay":9,"word":"Besides","phonetic":"/bɪˈsaɪdz/","pos":"prep","az":"Bundan başqa / Əlavə olaraq","definition":"In addition to; apart from","example":"Besides vocabulary, focus on natural sentence rhythm.","exampleAz":"Sözlərdən əlavə, təbii cümlə ritminə də diqqət yetirin."},{"id":1045,"day":70,"indexInDay":10,"word":"Otherwise","phonetic":"/ˈʌð.ə.waɪz/","pos":"adv","az":"Əks halda","definition":"In different circumstances; or else","example":"Review today’s words; otherwise, retention drops sharply.","exampleAz":"Bugünkü sözləri təkrar edin; əks halda yadda saxlama kəskin düşər."},{"id":1046,"day":70,"indexInDay":11,"word":"In addition","phonetic":"/ɪn əˈdɪʃ.ən/","pos":"phrase","az":"Əlavə olaraq","definition":"As an extra element or factor","example":"In addition t Venture capital accelerates groundbreaking clean technology.","exampleAz":"Risk kapitalı qabaqcıl təmiz texnologiyaları sürətləndirir."},{"id":1180,"day":79,"indexInDay":10,"word":"Shareholder","phonetic":"/ˈʃeəˌhəʊl.dər/","pos":"noun","az":"Səhmdar","definition":"Owner of shares in a company","example":"Shareholders voted in favor of green corporate governance.","exampleAz":"Səhmdarlar yaşıl korporativ idarəetmənin lehinə səs verdilər."},{"id":1181,"day":79,"indexInDay":11,"word":"Market","phonetic":"/ˈmɑː.kɪt/","pos":"noun","az":"Bazar","definition":"Arena of commercial dealings","example":"Emerging financial markets offer dynamic opportunities.","exampleAz":"İnkişaf etməkdə olan maliyyə bazarları dinamik imkanlar təqdim edir."},{"id":1182,"day":79,"indexInDay":12,"word":"Index","phonetic":"/ˈɪn.deks/","pos":"noun","az":"İndeks","definition":"Indicator, sign, or measure of something","example":"The stock index touched an all-time record high.","exampleAz":"Səhm indeksi bütün dövrlərin rekord səviyyəsinə toxundu."},{"id":1183,"day":79,"indexInDay":13,"word":"Yield","phonetic":"/jiːld/","pos":"noun","az":"Gəlir / Məhsuldarlıq","definition":"Financial return on an investment over a period","example":"Treasury bills deliver guaranteed nominal yield.","exampleAz":"Xəzinədarlıq vekselləri zəmanətli nominal gəlir təmin edir."},{"id":1184,"day":79,"indexInDay":14,"word":"Broker","phonetic":"/ˈbrəʊ.kər/","pos":"noun","az":"Broker / Vasitəçi","definition":"Person who buys and sells goods or assets for others","example":"A licensed broker executed the institutional trade.","exampleAz":"Lisenziyalı broker institusional əməliyyatı həyata keçirdi."},{"id":1185,"day":79,"indexInDay":15,"word":"Valuation","phonetic":"/ˌvæl.juˈeɪ.ʃən/","pos":"noun","az":"Qiymətləndirmə / Dəyər","definition":"Estimation of something’s worth, especially by appraisal","example":"The tech startup achieved a billion-dollar valuation.","exampleAz":"Texnologiya startapı bir milyard dollarlıq dəyərləndirm y":7,"word":"Deflation","phonetic":"/dɪˈfleɪ.ʃən/","pos":"noun","az":"Deflyasiya / Qiymət enməsi","definition":"Reduction of general level of prices in an economy","example":"Persistent deflation can damp consumer demand and output.","exampleAz":"Davamlı deflyasiya istehlakçı tələbatını və istehsalı zəiflədə bilər."},{"id":1238,"day":83,"indexInDay":8,"word":"Fiscal","phonetic":"/ˈfɪs.kəl/","pos":"adj","az":"Fiskal / Maliyyə-büdcə","definition":"Relating to government revenue, especially taxes","example":"Prudent fiscal policies create long-term national wealth.","exampleAz":"Uzaqgörən fiskal siyasət uzunmüddətli milli sərvət yaradır."},{"id":1239,"day":83,"indexInDay":9,"word":"Monetary","phonetic":"/ˈmʌn.ɪ.tri/","pos":"adj","az":"Monetar / Pul siyasəti","definition":"Relating to money or currency","example":"Monetary stability protects household purchasing power.","exampleAz":"Monetar sabitlik ailələrin alıcılıq qabiliyyətini qoruyur."},{"id":1240,"day":83,"indexInDay":10,"word":"Surplus","phonetic":"/ˈsɜː.pləs/","pos":"noun","az":"Profisit / Artıq vəsait","definition":"Amount of something left over when requirements have been met","example":"A healthy trade surplus strengthens national reserves.","exampleAz":"Sağlam ticarət profisiti milli ehtiyatları gücləndirir."},{"id":1241,"day":83,"indexInDay":11,"word":"Deficit","phonetic":"/ˈdef.ɪ.sɪt/","pos":"noun","az":"Kəsir / Çatışmazlıq","definition":"Amount by which something, especially sum of money, is too small","example":"Government trimmed expenditure to erase the fiscal deficit.","exampleAz":"Hökumət büdcə kəsirini aradan qaldırmaq üçün xərcləri optimallaşdırdı."},{"id":1242,"day":83,"indexInDay":12,"word":"Commerce","phonetic":"/ˈkɒm.ɜːs/","pos":"noun","az":"Kommersiya / Ticarət","definition":"Activity of buying and selling, especially on a large scale","example":"Cross-border electronic commerce expands opportunities.","exampleAz":"Sərhədlərarası elektron ticarət imkanları genişləndirir."},{"id":1243,"day":83,"indexInDay":13,"word":"Globalization","phonetic":"/ˌɡləʊ.bəl.aɪˈzeɪ.ʃən/","pos":"noun","az":"Qloballaşma","definition":"Process by which businesses develop international influence","example":"Globalization necessitates fluent English communication.","exampleAz":"Qloballaşma ingilis dilində sərbəst ünsiyyəti zəruri edir."},{"id":1244,"day":83,"indexInDay":14,"word":"Commodity","phonetic":"/kəˈmɒd.ə.ti/","pos":"noun","az":"Xammal / Əmtəə","definition":"Raw material or agricultural product that can be bought and sold","example":"Crude oil, grain, and copper are major global commodities.","exampleAz":"Xam neft, taxıl və mis əsas qlobal əmtəələrdir."},{"id":1245,"day":83,"indexInDay":15,"word":"Prosperity","phonetic":"/prɒsˈper.ə.ti/","pos":"noun","az":"Rifah / Çiçəklənmə","definition":"State of flourishing, thriving, or good fortune","example":"Investment in research and education yields shared prosperity.","exampleAz":"Tədqiqat və təhsilə qoyulan sərmayə ümumi rifah gətirir."}]},{"day":84,"level":"B2","theme":"Contract Law & Legal Terms","themeAz":"Müqavilə Hüququ və Hüquqi Terminlər","wordCount":15,"words":[{"id":1246,"day":84,"indexInDay":1,"word":"Contract","phonetic":"/ˈkɒn.trækt/","pos":"noun","az":"Müqavilə / Saziş","definition":"Legally binding agreement between parties","example":"A written contract clarifies mutual obligations.","exampleAz":"Yazılı müqavilə qarşılıqlı öhdəlikləri aydınlaşdırır."},{"id":1247,"day":84,"indexInDay":2,"word":"Clause","phonetic":"/klɔːz/","pos":"noun","az":"Bənd / Maddə (müqavilədə)","definition":"Distinct article or provision in a formal legal document","example":"Examine the confidentiality clause before signing.","exampleAz":"İmzalamazdan əvvəl məxfilik bəndini diqqətlə nəzərdən keçirin."},{"id":1248,"day":84,"indexInDay":3,"word":"Liability","phonetic":"/ˌlaɪ.əˈbɪl.ə.ti/","pos":"noun","az":"Hüquqi məsuliyyət / Öhdəlik","definition":"State of being legally responsible for something","example":"The limitation of liability claus t or course of action to which a person is morally bound","example":"Fulfill every professional obligation with strict honesty.","exampleAz":"Hər bir peşəkar öhdəliyi vicdanla yerinə yetirin."}]},{"day":85,"level":"B2","theme":"Human Resources & Recruitment","themeAz":"İnsan Resursları və İşə Qəbul","wordCount":15,"words":[{"id":1261,"day":85,"indexInDay":1,"word":"Recruitment","phonetic":"/rɪˈkruːt.mənt/","pos":"noun","az":"İşə qəbul prosesi","definition":"Action of finding and hiring new people to join organization","example":"Strategic recruitment identifies passionate cultural fits.","exampleAz":"Strateji işə qəbul korporativ mədəniyyətə uyğun olan istedadları tapır."},{"id":1262,"day":85,"indexInDay":2,"word":"Onboarding","phonetic":"/ˈɒnˌbɔː.dɪŋ/","pos":"noun","az":"İşə uyğunlaşma mərhələsi","definition":"Process of integrating a new employee into an organization","example":"Structured onboarding accelerates productivity within weeks.","exampleAz":"Nizamlı işə uyğunlaşma mərhələsi həftələr içində məhsuldarlığı artırır."},{"id":1263,"day":85,"indexInDay":3,"word":"Talent","phonetic":"/ˈtæl.ənt/","pos":"noun","az":"İstedad / İstedadlı kadr","definition":"Natural aptitude or skill; gifted people collectively","example":"Nurture domestic software talent with world-class resources.","exampleAz":"Yerli proqramlaşdırma istedadlarını dünya səviyyəli vəsaitlərlə inkişaf etdirin."},{"id":1264,"day":85,"indexInDay":4,"word":"Compensation","phonetic":"/ˌkɒm.penˈseɪ.ʃən/","pos":"noun","az":"Kompensasiya / Əmək haqqı paketi","definition":"Money given in recognition of work, loss, or hardship","example":"A fair compensation package includes health and training perks.","exampleAz":"Ədalətli əmək haqqı paketinə sağlamlıq və təlim imkanları daxildir."},{"id":1265,"day":85,"indexInDay":5,"word":"Benefits","phonetic":"/ˈben.ɪ.fɪts/","pos":"noun","az":"Əlavə güzəştlər / Sosial paket","definition":"Advantage or profit gained from employment perks","example":"Flexible hours and wellness budgets are attractive benefits.","exampleAz":"Çevik iş saatları və sağlamlıq büdcəsi cəlbedici sosial imtiyazlardır."},{"id":1266,"day":85,"indexInDay":6,"word":"Retention","phonetic":"/rɪˈten.ʃən/","pos":"noun","az":"Kadrların saxlanması","definition":"Continued possession, use, or control of talent in company","example":"Empathetic leadership is the greatest driver of staff retention.","exampleAz":"Həssas liderlik kadrların saxlanmasının ən güclü amilidir."},{"id":1267,"day":85,"indexInDay":7,"word":"Appraisal","phonetic":"/əˈpreɪ.zəl/","pos":"noun","az":"Fəaliyyətin qiymətləndirilməsi","definition":"Act of assessing something or someone, performance review","example":"Annual performance appraisals celebrate milestones achieved.","exampleAz":"İllik qiymətləndirmə əldə olunmuş uğurları ucaldır."},{"id":1268,"day":85,"indexInDay":8,"word":"Diversity","phonetic":"/daɪˈvɜː.sə.ti/","pos":"noun","az":"Müxtəliflik","definition":"Range of different things; state of having varied backgrounds","example":"Cognitive diversity stimulates richer brainstorming sessions.","exampleAz":"Fikir müxtəlifliyi daha zəngin müzakirələri stimullaşdırır."},{"id":1269,"day":85,"indexInDay":9,"word":"Turnover","phonetic":"/ˈtɜːnˌəʊ.vər/","pos":"noun","az":"Kadr axını","definition":"Rate at which employees leave a workforce and are replaced","example":"Improving workplace well-being slashes costly staff turnover.","exampleAz":"İş yerində rifahı yaxşılaşdırmaq kadr axınını əhəmiyyətli dərəcədə azaldır."},{"id":1270,"day":85,"indexInDay":10,"word":"Promotion","phonetic":"/prəˈməʊ.ʃən/","pos":"noun","az":"Vəzifə yüksəlişi","definition":"Advance in rank, position, or importance","example":"Earn promotions through demonstrable impact and dedication.","exampleAz":"Gözlə görünən nəticələr və sədaqətlə vəzifə yüksəlişinə nail olun."},{"id":1271,"day":85,"indexInDay":11,"word":"Payroll","phonetic":"/ˈpeɪ.rəʊl/","pos":"noun","az":"Maaş cədvəli","definition":"Total amount of wages and salaries paid ","phonetic":"/ˈkɒn.ʃəs.nəs/","pos":"noun","az":"Şüur","definition":"State of being awake and aware of one’s surroundings","example":"Language is the magnificent architecture of human consciousness.","exampleAz":"Dil insan şüurunun möhtəşəm memarlıq abidəsidir."}]},{"day":93,"level":"B2","theme":"Cognitive Biases & Decision Making","themeAz":"Koqnitiv Yanılmalar və Qərar Qəbulu","wordCount":15,"words":[{"id":1381,"day":93,"indexInDay":1,"word":"Bias","phonetic":"/ˈbaɪ.əs/","pos":"noun","az":"Qərəz / Yanılma","definition":"Prejudice in favor of or against one thing compared with another","example":"Critical thinkers examine their subconscious cognitive bias.","exampleAz":"Tənqidi düşünənlər öz şüuraltı koqnitiv qərəzlərini araşdırırlar."},{"id":1382,"day":93,"indexInDay":2,"word":"Confirmation","phonetic":"/ˌkɒn.fəˈmeɪ.ʃən/","pos":"noun","az":"Təsdiqləmə","definition":"Action of confirming something or state of being confirmed","example":"Confirmation bias prompts people to notice only agreeing facts.","exampleAz":"Təsdiqləmə yanılması insanları yalnız öz fikirlərinə uyğun faktları görməyə sövq edir."},{"id":1383,"day":93,"indexInDay":3,"word":"Heuristic","phonetic":"/hjuˈrɪs.tɪk/","pos":"noun","az":"Evristika / Zehni qısa yol","definition":"Mental shortcut allowing rapid decisions and problem-solving","example":"Heuristics speed up decisions but occasionally lead to error.","exampleAz":"Evristik qaydalar qərarları sürətləndirir, lakin bəzən səhvlərə yol aça bilər."},{"id":1384,"day":93,"indexInDay":4,"word":"Fallacy","phonetic":"/ˈfæl.ə.si/","pos":"noun","az":"Məntiq xətası / Yanılsama","definition":"Mistaken belief, especially one based on unsound argument","example":"Recognize logical fallacies to argue with rigorous clarity.","exampleAz":"Dəqiq mühakimə yürütmək üçün məntiq xətalarını tanıyın."},{"id":1385,"day":93,"indexInDay":5,"word":"Rational","phonetic":"/ˈræʃ.ən.əl/","pos":"adj","az":"Rasional / Ağıllı","definition":"Based on or in accordance with reason or logic","example":"A rational approach balances emotion with objective data.","exampleAz":"Rasional yanaşma emosiyanı obyektiv məlumatlarla tarazlaşdırır."},{"id":1386,"day":93,"indexInDay":6,"word":"Irrational","phonetic":"/ɪˈræʃ.ən.əl/","pos":"adj","az":"Qeyri-rasional / Məntiqsiz","definition":"Not logical or reasonable","example":"Panic buying during crises is an irrational reaction.","exampleAz":"Böhran zamanı təşvişlə mal almaq qeyri-rasional reaksiyadır."},{"id":1387,"day":93,"indexInDay":7,"word":"Anchoring","phonetic":"/ˈæŋ.kər.ɪŋ/","pos":"noun","az":"Lövbər effekti / İlkin rəqəmə bağlılıq","definition":"Tendency to rely heavily on the first piece of information offered","example":"Negotiators exploit anchoring by presenting initial numbers.","exampleAz":"Danışıqçılar ilkin rəqəmləri irəli sürərək lövbər effektindən istifadə edirlər."},{"id":1388,"day":93,"indexInDay":8,"word":"Overconfidence","phonetic":"/ˌəʊ.vəˈkɒn.fɪ.dəns/","pos":"noun","az":"Həddən artıq arxayınlıq","definition":"Excessive belief in one’s abilities, judgment, or knowledge","example":"Overconfidence leads students to skip crucial review sessions.","exampleAz":"Həddən artıq arxayınlıq tələbələrin vacib təkrarları buraxmasına səbəb olur."},{"id":1389,"day":93,"indexInDay":9,"word":"Judgment","phonetic":"/ˈdʒʌdʒ.mənt/","pos":"noun","az":"Mühakimə / Qərar","definition":"Ability to make considered decisions or come to conclusions","example":"Experience refines professional judgment over time.","exampleAz":"Təcrübə zamanla peşəkar mühakimə qabiliyyətini cilalayır."},{"id":1390,"day":93,"indexInDay":10,"word":"Perspective","phonetic":"/pəˈspek.tɪv/","pos":"noun","az":"Baxış bucağı","definition":"Particular attitude or way of regarding things","example":"Consulting diverse colleagues enriches your decision perspective.","exampleAz":"Fərqli həmkarlarla məsləhətləşmək qərar perspektivinizi zənginləşdirir."},{"id":1391,"day":93,"indexInDay":11,"word":"Illusion","phonetic":"/ɪˈluː.ʒən/","pos":"noun","az":"İllüziya / Yanılsama","definition":"Deceptive appearance or impression","example":"Do not fall into the illusion of passive competence.","exampleAz":"Passiv bacarıq illüziyasına aldanmayın; mütləq danışın."},{"id":1392,"day":93,"indexInDay":12,"word":"Intuition","phonetic":"/ˌɪn.tʃuːˈɪʃ.ən/","pos":"noun","az":"İntuisiya / Daxili duyum","definition":"Ability to understand something instinctively without reasoning","example":"Experienced doctors combine data with cultivated intuition.","exampleAz":"Təcrübəli həkimlər məlumatları daxili duyumla birləşdirirlər."},{"id":1393,"day":93,"indexInDay":13,"word":"Deduction","phonetic":"/dɪˈdʌk.ʃən/","pos":"noun","az":"Deduksiya / Nəticə çıxarma","definition":"Action of deducing or deriving logical consequences","example":"Sherlock Holmes solved baffling crimes by logical deduction.","exampleAz":"Şerlok Holms sirli cinayətləri məntiqi deduksiya ilə həll edirdi."},{"id":1394,"day":93,"indexInDay":14,"word":"Assumption","phonetic":"/əˈsʌmp.ʃən/","pos":"noun","az":"Fərziyyə / Güman","definition":"Thing accepted as true without proof","example":"Question every underlying assumption before proceeding.","exampleAz":"İrəliləməzdən əvvəl hər bir təməl fərziyyəni şübhə altına alın."},{"id":1395,"day":93,"indexInDay":15,"word":"Objectivity","phonetic":"/ˌɒb.dʒekˈtɪv.ə.ti/","pos":"noun","az":"Obyektivlik","definition":"Quality of being objective and free from personal bias","example":"Maintain scientific objectivity when evaluating results.","exampleAz":"Nəticələri qiymətləndirərkən elmi obyektivliyi qoruyun."}]},{"day":94,"level":"B2","theme":"Public Speaking & Presentations","themeAz":"Natiqlik və Təqdimat Bacarıqları","wordCount":15,"words":[{"id":1396,"day":94,"indexInDay":1,"word":"Oratory","phonetic":"/ˈɒr.ə.tər.i/","pos":"noun","az":"Natiqlik sənəti","definition":"Small or public speech delivered with formal eloquence","example":"Classical oratory inspires listeners through noble rhythm.","exampleAz":"Klassik natiqlik nəcib ritmlə dinləyiciləri heyran edir."},{"id":1397,"day":94,"indexInDay":2,"word":"Audience","phonetic":"/ˈɔː.di.əns/","pos":"noun","az":"Auditoriya / Tamaşaçılar","definition":"Assembled group of listeners or viewers","example":"Connect with your audience by maintaining warm eye contact.","exampleAz":"Səmimi göz təması quraraq auditoriyanızla əlaqə yaradın."},{"id":1398,"day":94,"indexInDay":3,"word":"Articulate","phonetic":"/ɑːˈtɪk.jə.lət/","pos":"verb","az":"Aydın ifadə etmək / Tələffüz etmək","definition":"Express an idea or feeling fluently and coherently","example":"Articulate each syllable with crisp and confident poise.","exampleAz":"Hər bir hecanı aydın və inamlı təmkinlə tələffüz edin."},{"id":1399,"day":94,"indexInDay":4,"word":"Slide","phonetic":"/slaɪd/","pos":"noun","az":"Slayd","definition":"Single page of a presentation created with software","example":"Keep presentation slides minimal with plenty of white space.","exampleAz":"Təqdimat slaydlarını sadə və geniş boşluqlu saxlayın."},{"id":1400,"day":94,"indexInDay":5,"word":"Visual","phonetic":"/ˈvɪʒ.u.əl/","pos":"adj","az":"Vizual / Görsəl","definition":"Relating to seeing or sight","example":"Visual charts convey complex data faster than dense paragraphs.","exampleAz":"Vizual qrafiklər mürəkkəb məlumatı uzun mətnlərdən daha tez çatdırır."},{"id":1401,"day":94,"indexInDay":6,"word":"Rehearse","phonetic":"/rɪˈhɜːs/","pos":"verb","az":"Məşq etmək / Təkrar etmək","definition":"Practice a speech, play, or other work for later public performance","example":"Rehearse your presentation three times in front of a mirror.","exampleAz":"Təqdimatınızı güzgü qarşısında üç dəfə məşq edin."},{"id":1402,"day":94,"indexInDay":7,"word":"Posture","phonetic":"/ˈpɒs.tʃər/","pos":"noun","az":"Qamət / Duruş","definition":"Position in which someone holds their body while standing","example":"An open, upright posture radiates unshakeable authority.","exampleAz":"Açıq və şax duruş sarsılmaz nüfuz təlqin edir."},{"id":1403,"day":94,"indexInDay":8,"word":"Intonation","phonetic":"/ˌɪn.təˈneɪ.ʃən/","pos":"noun","az":"İntonasiya / Səs ahəngi","definition":"Rise and fall of the voice in speaking","example":"Modulate your intonation to maintain audience interest.","exampleAz":"Dinləyicinin marağını saxlamaq üçün intonasiyanızı dəyişin."},{"id":1404,"day":94,"indexInDay":9,"word":"Rapport","phonetic":"/ræpˈɔːr/","pos":"noun","az":"Səmimi əlaqə / Qarşılıqlı anlaşma","definition":"Close and harmonious relationship where people understand each other","example":"Establish rapport early by sharing an authentic story.","exampleAz":"Səmimi bir hekayə bölüşərək əvvəlcədən isti əlaqə qurun."},{"id":1405,"day":94,"indexInDay":10,"word":"Clarity","phonetic":"/ˈklær.ə.ti/","pos":"noun","az":"Aydınlıq","definition":"Quality of being clear and easy to understand","example":"Clarity of thought breeds clarity of expression.","exampleAz":"Düşüncənin aydınlığı ifadənin aydınlığını doğurur."},{"id":1406,"day":94,"indexInDay":11,"word":"Gesture","phonetic":"/ˈdʒes.tʃər/","pos":"noun","az":"Jest / Əl-qol hərəkəti","definition":"Movement of part of the body to express an idea or meaning","example":"Natural hand gestures emphasize key verbal concepts.","exampleAz":"Təbii əl hərəkətləri əsas söz anlayışlarını vurğulayır."},{"id":1407,"day":94,"indexInDay":12,"word":"Poise","phonetic":"/pɔɪz/","pos":"noun","az":"Təmkinlilik / Vüqar","definition":"Graceful and elegant bearing in a person; composure","example":"Maintain calm poise even if technological glitches occur.","exampleAz":"Texniki nasazlıqlar baş versə belə, sakit təmkininizi qoruyun."},{"id":1408,"day":94,"indexInDay":13,"word":"Engage","phonetic":"/ɪnˈɡeɪdʒ/","pos":"verb","az":"Cəlb etmək / Maraq oyatmaq","definition":"Attract and hold interest and attention","example":"Engage the audience with provocative thought experiments.","exampleAz":"Düşündürücü zehni suallarla dinləyiciləri cəlb edin."},{"id":1409,"day":94,"indexInDay":14,"word":"Summary","phonetic":"/ˈsʌm.ər.i/","pos":"noun","az":"Xülasə / Yekun","definition":"Brief statement or account of the main points of something","example":"Deliver a punchy three-bullet summary at the conclusion.","exampleAz":"Yekunda üç bəndlik vurucu bir xülasə təqdim edin."},{"id":1410,"day":94,"indexInDay":15,"word":"Eloquent","phonetic":"/ˈel.ə.kwənt/","pos":"adj","az":"Bəlağətli / Gözəl danışan","definition":"Fluent or persuasive in speaking or writing","example":"Her eloquent address moved the conference to a standing ovation.","exampleAz":"Onun bəlağətli çıxışı konfrans iştirakçılarını ayaqüstə alqışa qaldırdı."}]},{"day":95,"level":"B2","theme":"Debate & Persuasion Techniques","themeAz":"Debat və İandırma Texnikaları","wordCount":15,"words":[{"id":1411,"day":95,"indexInDay":1,"word":"Persuade","phonetic":"/pəˈsweɪd/","pos":"verb","az":"İnandırmaq / Razı salmaq","definition":"Cause someone to do something through reasoning or argument","example":"Persuade listeners using verifiable evidence and empathy.","exampleAz":"Dinləyiciləri yoxlanıla bilən sübutlar və şəfqətlə inandırın."},{"id":1412,"day":95,"indexInDay":2,"word":"Argument","phonetic":"/ˈɑːɡ.jə.mənt/","pos":"noun","az":"Arqument / Dəlil / Mübahisə","definition":"Reason or set of reasons given in support of an idea","example":"A sound argument withstands the sharpest counter-attacks.","exampleAz":"Möhkəm bir arqument ən kəskin əks-hücumlara tab gətirir."},{"id":1413,"day":95,"indexInDay":3,"word":"Rhetoric","phonetic":"/ˈret.ər.ɪk/","pos":"noun","az":"Ritorika / Bəlağət","definition":"Art of effective or persuasive speaking or writing","example":"Aristotle analyzed rhetoric through ethos, pathos, and logos.","exampleAz":"Aristotel ritorikanı etos, patos və loqos vasitəsilə təhlil etmişdir."},{"id":1414,"day":95,"indexInDay":4,"word":"Counterpart","phonetic":"/ˈkaʊn.tə.pɑːt/","pos":"noun","az":"Həmkar / Qarşı tərəf","definition":"Person holding corresponding position in another team","example":"Confer respectfully with your debate counterpart.","exampleAz":"Debatdakı həmkarınızla qarşılıqlı hörmətlə danışın."},{"id":1415,"day":95,"indexInDay":5,"word":"Rebuttal","phonetic":"/rɪˈbʌt.əl/","pos":"noun","az":"Təkzib / Əks-dəlil","definition":"Refutation or contradiction using evidence","example":"Deliver a devastating factual rebuttal to the fallacy.","exampleAz":"Məntiq xətasına qarşı sarsıdıcı faktiki təkzib irəli sürün."},{"id":1416,"day":95,"indexInDay":6,"word":"Evidence","phonetic":"/ˈev.ɪ.dəns/","pos":"noun","az":"Sübut / Dəlil","definition":"Available body of facts establishing validity","example":"Back every factual claim with authoritative empirical evidence.","exampleAz":"Hər bir faktiki iddianı etibarlı empirik sübutlarla əsaslandırın."},{"id":1417,"day":95,"indexInDay":7,"word":"Logical","phonetic":"/ˈlɒdʒ.ɪ.kəl/","pos":"adj","az":"Məntiqi","definition":"According to rules of logic or formal reasoning","example":"Construct logical progressions from premise to deduction.","exampleAz":"İlkin şərtdən nəticəyə qədər məntiqi ardıcıllıq qurun."},{"id":1418,"day":95,"indexInDay":8,"word":"Premise","phonetic":"/ˈprem.ɪs/","pos":"noun","az":"İlkin şərt / Əsas fərziyyə","definition":"Previous statement or proposition from which another is inferred","example":"If the initial premise is flawed, the deduction fails.","exampleAz":"İlkin şərt qüsurlu olarsa, çıxarılan nəticə də yanlış olar."},{"id":1419,"day":95,"indexInDay":9,"word":"Fallacy","phonetic":"/ˈfæl.ə.si/","pos":"noun","az":"Məntiq xətası","definition":"Flawed reasoning rendering an argument unsound","example":"Spotting ad hominem fallacy exposes weak reasoning.","exampleAz":"Şəxsiyyətə keçid xətasını aşkar etmək zəif mühakiməni üzə çıxarır."},{"id":1420,"day":95,"indexInDay":10,"word":"Concede","phonetic":"/kənˈsiːd/","pos":"verb","az":"Güzəştə getmək / Qəbul etmək","definition":"Admit that an opponent’s point is valid","example":"Concede minor points gracefully to preserve moral high ground.","exampleAz":"Mənəvi üstünlüyü qorumaq üçün kiçik məqamları zərifliklə qəbul edin."},{"id":1421,"day":95,"indexInDay":11,"word":"Assert","phonetic":"/əˈsɜːt/","pos":"verb","az":"Təsdiq etmək / İddia etmək","definition":"State a fact or belief confidently and forcefully","example":"Assert your viewpoint with calm and steady firmness.","exampleAz":"Öz mövqeyinizi sakit və sarsılmaz qətiyyətlə iddia edin."},{"id":1422,"day":95,"indexInDay":12,"word":"Refute","phonetic":"/rɪˈfjuːt/","pos":"verb","az":"Təkzib etmək / Əsassızlığını sübut etmək","definition":"Prove a statement or theory to be wrong or false","example":"The scientist refuted old myths using laboratory proof.","exampleAz":"Alim laboratoriya sübutları ilə köhnə miflər təkzib etdi."},{"id":1423,"day":95,"indexInDay":13,"word":"Credibility","phonetic":"/ˌkred.əˈbɪl.ə.ti/","pos":"noun","az":"Etibarlılıq / Nüfuz","definition":"Quality of being trusted and believed in","example":"Honesty underpins an orator’s enduring credibility.","exampleAz":"Dürüstlük natiqin daimi etibarlılığının təməlini təşkil edir."},{"id":1424,"day":95,"indexInDay":14,"word":"Stance","phonetic":"/stɑːns/","pos":"noun","az":"Mövqe / Durum","definition":"Attitude or posture held toward an issue","example":"Explain your principled stance on digital privacy.","exampleAz":"Rəqəmsal məxfiliklə bağlı prinsipial mövqeyinizi izah edin."},{"id":1425,"day":95,"indexInDay":15,"word":"Consensus","phonetic":"/kənˈsen.səs/","pos":"noun","az":"Ümumi razılıq","definition":"General agreement reached through respectful debate","example":"A rigorous debate ultimately crystallizes consensus.","exampleAz":"Gərgin debat nəhayətdə ümumi razılığı kristallaşdırır."}]},{"day":96,"level":"B2","theme":"Journalism & Media Ethics","themeAz":"Jurnalistika və Media Etikası","wordCount":15,"words":[{"id":1426,"day":96,"indexInDay":1,"word":"Journalism","phonetic":"/ˈdʒɜː.nə.lɪ.zəm/","pos":"noun","az":"Jurnalistika","definition":"Activity of investigating, reporting, and editing news","example":"Ethical journalism cret or illegal acts","example":"Investigative reporters uncovered corporate embezzlement.","exampleAz":"Təhqiqatçı jurnalistlər korporativ mənimsəmələri üzə çıxardılar."},{"id":1433,"day":96,"indexInDay":8,"word":"Editorial","phonetic":"/ˌed.ɪˈtɔː.ri.əl/","pos":"noun","az":"Redaksiya məqaləsi","definition":"Article written by editor expressing opinion of the paper","example":"The newspaper’s editorial urged investments in education.","exampleAz":"Qəzetin redaksiya məqaləsi təhsilə investisiya qoymağa çağırdı."},{"id":1434,"day":96,"indexInDay":9,"word":"Censorship","phonetic":"/ˈsen.sə.ʃɪp/","pos":"noun","az":"Senzura","definition":"Suppression of speech, public communication, or material","example":"Freedom from unlawful censorship ensures an informed populace.","exampleAz":"Qanunsuz senzuranın olmaması məlumatlı cəmiyyət formalaşdırır."},{"id":1435,"day":96,"indexInDay":10,"word":"Transparency","phonetic":"/trænˈspær.ən.si/","pos":"noun","az":"Şəffaflıq","definition":"Openness and accountability in reporting methods","example":"Media transparency fosters deep democratic resilience.","exampleAz":"Media şəffaflığı dərin demokratik dözümlülük yaradır."},{"id":1436,"day":96,"indexInDay":11,"word":"Libel","phonetic":"/ˈlaɪ.bəl/","pos":"noun","az":"Böhtan (yazılı)","definition":"Published false statement damaging to person’s reputation","example":"Publishing fabricated allegations constitutes actionable libel.","exampleAz":"Uydurma iddialar dərc etmək hüquqi məsuliyyət doğuran böhtandır."},{"id":1437,"day":96,"indexInDay":12,"word":"Headline","phonetic":"/ˈhed.laɪn/","pos":"noun","az":"Başlıq","definition":"Heading at the top of an article or page in a newspaper","example":"Write informative headlines that capture truth, not hype.","exampleAz":"Şişirtmə deyil, həqiqəti əks etdirən məlumatlandırıcı başlıqlar yazın."},{"id":1438,"day":96,"indexInDay":13,"word":"Broadcast","phonetic":"/ˈbrɔːd.kɑːst/","pos":"verb","az":"Yayımlamaq","definition":"Transmit sound and images o acy & International Relations","themeAz":"Diplomatiya və Beynəlxalq Əlaqələr","wordCount":15,"words":[{"id":1456,"day":98,"indexInDay":1,"word":"Diplomacy","phonetic":"/dɪˈpləʊ.mə.si/","pos":"noun","az":"Diplomatiya","definition":"Profession, activity, or skill of managing international relations","example":"Skilled diplomacy averts catastrophic armed confrontations.","exampleAz":"Məharətli diplomatiya fəlakətli silahlı qarşıdurmaların qarşısını alır."},{"id":1457,"day":98,"indexInDay":2,"word":"Ambassador","phonetic":"/æmˈbæs.ə.dər/","pos":"noun","az":"Səfir","definition":"Accredited diplomat sent by country as its official representative","example":"The ambassador fostered cultural and economic bridges.","exampleAz":"Səfir mədəni və iqtisadi körpülər qurdu."},{"id":1458,"day":98,"indexInDay":3,"word":"Treaty","phonetic":"/ˈtriː.ti/","pos":"noun","az":"Müqavilə / Pakt","definition":"Formally concluded and ratified agreement between countries","example":"The peace treaty established mutually recognized borders.","exampleAz":"Sülh müqaviləsi qarşılıqlı tanınmış sərhədləri müəyyən etdi."},{"id":1459,"day":98,"indexInDay":4,"word":"Alliance","phonetic":"/əˈlaɪ.əns/","pos":"noun","az":"İttifaq / Hərbi-siyasi birlik","definition":"Union or association formed for mutual benefit, especially between countries","example":"Strategic alliances enhance regional defense and security.","exampleAz":"Strateji ittifaqlar regional müdafiə və təhlükəsizliyi gücləndirir."},{"id":1460,"day":98,"indexInDay":5,"word":"Bilateral","phonetic":"/ˌbaɪˈlæt.ər.əl/","pos":"adj","az":"İkitərəfli","definition":"Having or relating to two sides; affecting two countries","example":"The nations signed a historic bilateral trade agreement.","exampleAz":"Ölkələr tarixi ikitərəfli ticarət müqaviləsi imzaladılar."},{"id":1461,"day":98,"indexInDay":6,"word":"Multilateral","phonetic":"/ˌmʌl.tiˈlæt.ər.əl/","pos":"adj","az":"Çoxtərəfli","definition":"Agreed upon or participated in by three or more parties","example":"Multilateral diplomacy tackles global climate challenges.","exampleAz":"Çoxtərəfli diplomatiya qlobal iqlim problemlərini həll edir."},{"id":1462,"day":98,"indexInDay":7,"word":"Negotiate","phonetic":"/nəˈɡəʊ.ʃi.eɪt/","pos":"verb","az":"Danışıqlar aparmaq","definition":"Try to reach agreement or compromise by discussion","example":"Diplomats negotiate tirelessly to secure enduring peace.","exampleAz":"Diplomatlar daimi sülhü təmin etmək üçün yorulmadan danışıqlar aparırlar."},{"id":1463,"day":98,"indexInDay":8,"word":"Sanction","phonetic":"/ˈsæŋk.ʃən/","pos":"noun","az":"Sanksiya / Cəza tədbiri","definition":"Threatened penalty for disobeying a law or rule","example":"Economic sanctions were lifted following compliance verification.","exampleAz":"Uyğunluq təsdiqləndikdən sonra iqtisadi sanksiyalar ləğv edildi."},{"id":1464,"day":98,"indexInDay":9,"word":"Summit","phonetic":"/ˈsʌm.ɪt/","pos":"noun","az":"Sammit / Zirvə görüşü","definition":"Meeting between heads of government to discuss issues","example":"Baku hosted the international environmental summit with acclaim.","exampleAz":"Bakı beynəlxalq ətraf mühit sammitinə yüksək səviyyədə ev sahibliyi etdi."},{"id":1465,"day":98,"indexInDay":10,"word":"Protocol","phonetic":"/ˈprəʊ.tə.kɒl/","pos":"noun","az":"Protokol / Qayda","definition":"Official procedure or system of rules governing diplomatic affairs","example":"Strict diplomatic protocol governed seating arrangements.","exampleAz":"Oturma qaydasını ciddi diplomatik protokol müəyyənləşdirdi."},{"id":1466,"day":98,"indexInDay":11,"word":"Delegation","phonetic":"/ˌdel.ɪˈɡeɪ.ʃən/","pos":"noun","az":"Nümayəndə heyəti","definition":"Group of people representing an organization or country","example":"The ministerial delegation arrived in Geneva for talks.","exampleAz":"Nazirlər nümayəndə heyəti danışıqlar üçün Cenevrəyə çatdı."},{"id":1467,"day":98,"indexInDay":12,"word":"Mediation","phonetic":"/ˌmiː.diˈeɪ.ʃən/","pos":"noun","az":"Vasitəçilik / Mediasiya","defin ":"Səhiyyə / Tibbi xidmət","definition":"Organized provision of medical care to a community","example":"Accessible healthcare is the backbone of national prosperity.","exampleAz":"Əlçatan səhiyyə milli rifahın onurğa sütunudur."},{"id":1502,"day":101,"indexInDay":2,"word":"Diagnostics","phonetic":"/ˌdaɪ.əɡˈnɒs.tɪks/","pos":"noun","az":"Diaqnostika / Diaqnoz üsulları","definition":"Practice or techniques of identifying illnesses or conditions","example":"Advanced genomic diagnostics detect genetic risks years early.","exampleAz":"Qabaqcıl genomik diaqnostika riskləri illərlə əvvəl aşkar edir."},{"id":1503,"day":101,"indexInDay":3,"word":"Pharmaceutical","phonetic":"/ˌfɑː.məˈsjuː.tɪ.kəl/","pos":"adj","az":"Əczaçılıq / Dərman istehsalı","definition":"Relating to medicinal drugs or their preparation","example":"The pharmaceutical industry accelerates targeted immunotherapy.","exampleAz":"Əczaçılıq sənayesi hədəfli immunoterapiyanı sürətləndirir."},{"id":1504,"day":101,"indexInDay":4,"word":"Physician","phonetic":"/fɪˈzɪʃ.ən/","pos":"noun","az":"Həkim / Terapevt","definition":"Person qualified to practice medicine","example":"The attending physician explained treatment alternatives clearly.","exampleAz":"Müalicə həkimi müalicə variantlarını aydın izah etdi."},{"id":1505,"day":101,"indexInDay":5,"word":"Epidemic","phonetic":"/ˌep.ɪˈdem.ɪk/","pos":"noun","az":"Epidemiya","definition":"Widespread occurrence of infectious disease in a community","example":"Global surveillance coordinates response to potential epidemics.","exampleAz":"Qlobal müşahidə mümkün epidemiyalara qarşı tədbirləri əlaqələndirir."},{"id":1506,"day":101,"indexInDay":6,"word":"Therapy","phonetic":"/ˈθer.ə.pi/","pos":"noun","az":"Terapiya / Müalicə kursu","definition":"Treatment intended to relieve or heal a disorder","example":"Physical therapy restored full athletic mobility.","exampleAz":"Fizioterapiya tam idman hərəkətliliyini bərpa etdi."},{"id":1507,"day":101,"indexInDay":7,"word":"Chronic","phonetic "},{"id":1624,"day":109,"indexInDay":4,"word":"Colloquial","phonetic":"/kəˈləʊ.kwi.əl/","pos":"adj","az":"Danışıq dilinə aid / Şifahi","definition":"Used in ordinary or familiar conversation; not formal","example":"Colloquial expressions give speech authentic flavor.","exampleAz":"Danışıq dili ifadələri nitqə orijinal təbii dad verir."},{"id":1625,"day":109,"indexInDay":5,"word":"Slang","phonetic":"/slæŋ/","pos":"noun","az":"Jarqon / Slənq","definition":"Informal words and phrases more common in spoken language","example":"Youth slang changes quickly across decades.","exampleAz":"Gənclər jarqonu onilliklər boyu sürətlə dəyişir."},{"id":1626,"day":109,"indexInDay":6,"word":"Jargon","phonetic":"/ˈdʒɑː.ɡən/","pos":"noun","az":"Peşəkar jarqon / Sahə terminologiyası","definition":"Special words used by a profession difficult for others","example":"Demystify technical jargon by explaining plain concepts.","exampleAz":"Sadə anlayışlarla izah edərək texniki jarqonu aydınlaşdırın."},{"id":1627,"day":109,"indexInDay":7,"word":"Politeness","phonetic":"/pəˈlaɪt.nəs/","pos":"noun","az":"Nəzakət / Ədəb","definition":"Courteous behavior showing respect","example":"Politeness markers soften requests in diplomatic letters.","exampleAz":"Nəzakət ifadələri diplomatik məktublarda xahişləri yumşaldır."},{"id":1628,"day":109,"indexInDay":8,"word":"Tone","phonetic":"/təʊn/","pos":"noun","az":"Ton / İntonasiya","definition":"General character or attitude of a piece of writing or speech","example":"Adopt an encouraging, constructive tone when giving feedback.","exampleAz":"Rəy bildirərkən həvəsləndirici və konstruktiv ton seçin."},{"id":1629,"day":109,"indexInDay":9,"word":"Euphemism","phonetic":"/ˈjuː.fə.mɪ.zəm/","pos":"noun","az":"Evfemizm / Yumşaldıcı söz","definition":"Mild or indirect expression substituted for harsh one","example":"Saying \"passed away\" instead of \"died\" is a gentle euphemism.","exampleAz":"\"Öldü\" əvəzinə \"dünyasını dəyişdi\" demək zərif bir evfemizmdir."},{"id"
