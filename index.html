InDay":12,"word":"Epiphany","phonetic":"/ɪˈpɪf.ən.i/","pos":"noun","az":"İlahi idrak anı","definition":"Moment of sudden and great revelation or realization","example":"An epiphany struck: language is a bridge, not a barrier.","exampleAz":"Qəfil bir idrak parladı: dil maneə deyil, körpüdür."},{"id":2263,"day":151,"indexInDay":13,"word":"Temporal","phonetic":"/ˈtem.pər.əl/","pos":"adj","az":"Müvəqqəti / Dünyəvi","definition":"Relating to time or worldly affairs","example":"Look past temporal anxieties to timeless spiritual values.","exampleAz":"Müvəqqəti narahatlıqlardan ötüb əbədi mənəvi dəyərlərə baxın."},{"id":2264,"day":151,"indexInDay":14,"word":"Equanimity","phonetic":"/ˌek.wəˈnɪm.ə.ti/","pos":"noun","az":"Ruh sakitliyi / Daxili təmkin","definition":"Mental calmness, composure, and evenness of temper in difficulty","example":"Maintain serene equanimity through both triumph and storm.","exampleAz":"Həm qələbədə, həm də fırtınada daxili təmkininizi qoruyun."},{"id":2265,"day":151,"indexInDay":15,"word":"Legacy","phonetic":"/ˈleɡ.ə.si/","pos":"noun","az":"Mənəvi irs","definition":"Something handed down from an ancestor or predecessor","example":"A life devoted to wisdom and teaching leaves an immortal legacy.","exampleAz":"Hikmətə və tədrisə həsr olunmuş həyat ölməz bir irs qoyur."}]},{"day":152,"level":"C1","theme":"Advanced Collocations with Abstract Nouns","themeAz":"Mücərrəd İsimlərlə Sabit Birləşmələr","wordCount":15,"words":[{"id":2266,"day":152,"indexInDay":1,"word":"Exercise restraint","phonetic":"/ˈek.sə.saɪz rɪˈstreɪnt/","pos":"phrase","az":"Təmkin göstərmək / Özünü saxlamaq","definition":"Act with self-control and avoid reckless reaction","example":"Exercise restraint when provoked during heated arguments.","exampleAz":"Qızğın mübahisələrdə təhrik olunanda təmkin göstərin."},{"id":2267,"day":152,"indexInDay":2,"word":"Cast doubt on","phonetic":"/kɑːst daʊt ɒn/","pos":"phrase","az":"Şübhə altına almaq","definition":"Cause something to appear uncertain or unreliable","example":"Rigorous new evidence cast doubt on the outdated hypothesis.","exampleAz":"Yeni dəqiq sübutlar köhnəlmiş fərziyyəni şübhə altına aldı."},{"id":2268,"day":152,"indexInDay":3,"word":"Bear resemblance to","phonetic":"/beər rɪˈzem.bləns tuː/","pos":"phrase","az":"Bənzəmək / Oxşarlıq daşımaq","definition":"Look like or be similar to someone or something","example":"His elegant speech bore striking resemblance to classical oratory.","exampleAz":"Onun gözəl nitqi klassik natiqliklə heyrətamiz oxşarlıq daşıyırdı."},{"id":2269,"day":152,"indexInDay":4,"word":"Pay tribute to","phonetic":"/peɪ ˈtrɪb.juːt tuː/","pos":"phrase","az":"Ehtiramını bildirmək / Yad etmək","definition":"Praise, celebrate, or honor someone publicly","example":"We pay tribute to the visionary founders of our republic.","exampleAz":"Biz cümhuriyyətimizin uzaqgörən qurucularına dərin ehtiramımızı bildiririk."},{"id":2270,"day":152,"indexInDay":5,"word":"Take precedence over","phonetic":"/teɪk ˈpres.ɪ.dəns ˈəʊ.vər/","pos":"phrase","az":"Üstünlük təşkil etmək / Öncə gəlmək","definition":"Be more important than someone or something else","example":"Ethical truth must take precedence over temporary convenience.","exampleAz":"Əxlaqi həqiqət müvəqqəti rahatlıqdan həmişə öncə gəlməlidir."},{"id":2271,"day":152,"indexInDay":6,"word":"Shed light on","phonetic":"/ʃed laɪt ɒn/","pos":"phrase","az":"İşıq salmaq / Aydınlatmaq","definition":"Provide an explanation for something that was obscure","example":"The newly unveiled scrolls shed light on ancient history.","exampleAz":"Yeni aşkar edilmiş əlyazmalar qədim tarixə aydın işıq saldı."},{"id":2272,"day":152,"indexInDay":7,"word":"Pave the way for","phonetic":"/peɪv ðə weɪ fɔːr/","pos":"phrase","az":"Yol açmaq / Zəmin hazırlamaq","definition":"Create conditions making something possible or easier","example":"Mastering 2,400 words paves the way for effortless scholarship.","exampleAz":"2400 sözü mənimsəmək yüksək akademik uğurlara möhkəm yol açır."},{"id":2273,"day":152,"indexInDay":8,"word":"Draw a distinction between","phonetic":"/drɔː ə dɪˈstɪŋk.ʃən bɪˈtwiːn/","pos":"phrase","az":"Fərq qoymaq / Ayırmaq","definition":"Differentiate between two entities clearly","example":"Draw a clear distinction between knowledge and mere information.","exampleAz":"Biliklə sadə məlumat arasında aydın fərq qoyun."},{"id":2274,"day":152,"indexInDay":9,"word":"Fall prey to","phonetic":"/fɔːl preɪ tuː/","pos":"phrase","az":"Qurbanı olmaq / Tələsinə düşmək","definition":"Be victimized or ruined by an adverse influence","example":"Never fall prey to defeatist internal narratives.","exampleAz":"Məğlubiyyətçi daxili fikirlərin qurbanı heç vaxt olmayın."},{"id":2275,"day":152,"indexInDay":10,"word":"Lend credence to","phonetic":"/lend ˈkriː.dəns tuː/","pos":"phrase","az":"İnandırıcı etmək / Qüvvətləndirmək","definition":"Make something appear credible or likely to be true","example":"Replicated laboratory tests lend credence to the discovery.","exampleAz":"Təkrarlanan laboratoriya sınaqları kəşfi daha da inandırıcı edir."},{"id":2276,"day":152,"indexInDay":11,"word":"Pose a threat to","phonetic":"/pəʊz ə θret tuː/","pos":"phrase","az":"Təhlükə yaratmaq","definition":"Present or create danger or hazard to","example":"Erosion poses a threat to ancient cliff-side monuments.","exampleAz":"Torpaq aşınması qədim qayaüstü abidələr üçün təhlükə yaradır."},{"id":2277,"day":152,"indexInDay":12,"word":"Bring to fruition","phonetic":"/brɪŋ tuː fruˈɪʃ.ən/","pos":"phrase","az":"Bəhrəsini vermək / Həyata keçirmək","definition":"Cause an undertaking to be completed successfully","example":"Daily practice brings long-held linguistic dreams to fruition.","exampleAz":"Gündəlik məşq uzun illərin dil arzularını həyata keçirir."},{"id":2278,"day":152,"indexInDay":13,"word":"Reach a deadlock","phonetic":"/riːtʃ ə ˈded.lɒk/","pos":"phrase","az":"Çıxılmaz vəziyyətə çatmaq","definition":"Reach a state where further negotiation is impossible","example":"Mediators intervened when treaty talks reached a deadlock.","exampleAz":"Danışıqlar çıxılmaz vəziyyətə çatanda vasitəçilər işə qarışdı."},{"id":2279,"day":152,"indexInDay":14,"word":"Reap the benefits of","phonetic":"/riːp ðə ˈben.ɪ.fɪts ɒv/","pos":"phrase","az":"Bəhrəsini görmək / Faydasını götürmək","definition":"Enjoy the good results of what one has worked for","example":"You will reap the benefits of this 160-day dedication for life.","exampleAz":"Siz bu 160 günlük zəhmətin bəhrəsini ömür boyu görəcəksiniz."},{"id":2280,"day":152,"indexInDay":15,"word":"Stand in stark contrast to","phonetic":"/stænd ɪn stɑːk ˈkɒn.trɑːst tuː/","pos":"phrase","az":"Kəskin təzad təşkil etmək","definition":"Be utterly different from something adjacent","example":"Her calm poise stood in stark contrast to the surrounding panic.","exampleAz":"Onun təmkinliyi ətrafdakı təşvişlə kəskin təzad təşkil edirdi."}]},{"day":153,"level":"C1","theme":"Nuanced Praise & Appreciation","themeAz":"Tərif və Yüksək Qiymətləndirmə Sözləri","wordCount":15,"words":[{"id":2281,"day":153,"indexInDay":1,"word":"Exemplary","phonetic":"/ɪɡˈzem.plər.i/","pos":"adj","az":"Nümunəvi / Örnək olan","definition":"Serving as a desirable model; representing the best of its kind","example":"Your study discipline over 150 days is truly exemplary.","exampleAz":"150 gün boyu oxu intizamınız həqiqətən nümunəvidir."},{"id":2282,"day":153,"indexInDay":2,"word":"Commendable","phonetic":"/kəˈmen.də.bəl/","pos":"adj","az":"Təqdirəlayiq / Alqışlanan","definition":"Deserving praise and hearty admiration","example":"Her commitment to supporting peers is highly commendable.","exampleAz":"Həmkarlarına dəstək olmaq əzmi olduqca təqdirəlayiqdir."},{"id":2283,"day":153,"indexInDay":3,"word":"Impeccable","phonetic":"/ɪmˈpek.ə.bəl/","pos":"adj","az":"Qüsursuz / Ləkəsiz","definition":"In accordance with the highest standards; faultless","example":"The ambassador spoke with impeccable British diction.","exampleAz":"Səfir qüsursuz və zərif Britaniya tələffüzü ilə danışdı."},{"id":2284,"day":153,"indexInDay":4,"word":"Peerless","phonetic":"/ˈpɪə.ləs/","pos":"adj","az":"Bənzərsiz / Tayı-bərabəri olmayan","definition":"Unequaled; unrivaled in quality or excellence","example":"Nizami’s linguistic tapestry remains peerless across centuries.","exampleAz":"Nizaminin poetik dili əsrlər boyu tayı-bərabəri olmayan zirvədir."},{"id":2285,"day":153,"indexInDay":5,"word":"Luminous","phonetic":"/ˈluː.mɪ.nəs/","pos":"adj","az":"Şəfəqli / Aydın / Parlaq","definition":"Shedding light; intellectually or spiritually brilliant","example":"Her luminous commentary clarified the enigmatic poem.","exampleAz":"Onun aydın və parlaq şərhi sirli şeiri tam aydınlaşdırdı."},{"id":2286,"day":153,"indexInDay":6,"word":"Stellar","phonetic":"/ˈstel.ər/","pos":"adj","az":"Möhtəşəm / Ulduz kimi parlayan","definition":"Featuring or having the quality of a star; exceptionally good","example":"The development team delivered stellar code performance.","exampleAz":"Tərtibatçı komanda möhtəşəm kod performansı təqdim etdi."},{"id":2287,"day":153,"indexInDay":7,"word":"Invaluable","phonetic":"/ɪnˈvæl.jə.bəl/","pos":"adj","az":"Qiymətsiz / Çox dəyərli","definition":"Extremely useful; indispensable","example":"Your constructive mentorship was invaluable to my career.","exampleAz":"Sizin dəyərli mentorluğunuz karyeram üçün qiymətsiz oldu."},{"id":2288,"day":153,"indexInDay":8,"word":"Ingenious","phonetic":"/ɪnˈdʒiː.ni.əs/","pos":"adj","az":"Dahiyanə / Zirəkcəsinə düşünülmüş","definition":"Clever, original, and inventive","example":"The mnemonic trick is an ingenious aid to vocabulary recall.","exampleAz":"Bu yaddaş üsulu sözləri xatırlamaq üçün dahiyanə bir köməkdir."},{"id":2289,"day":153,"indexInDay":9,"word":"Virtuoso","phonetic":"/ˌvɜː.tʃuˈəʊ.səʊ/","pos":"noun","az":"Virtuoz / Sənətkar","definition":"Person highly skilled in music or another artistic pursuit","example":"The tar virtuoso captivated international halls.","exampleAz":"Tar virtuozu beynəlxalq zalları öz sənəti ilə ovsunladı."},{"id":2290,"day":153,"indexInDay":10,"word":"Sublime","phonetic":"/səˈblaɪm/","pos":"adj","az":"Uca / Heyranedici","definition":"Of such excellence or grandeur as to inspire awe","example":"The mountain sunrise was an experience of sublime beauty.","exampleAz":"Dağda gün doğumu uca və heyranedici gözəllik təcrübəsi idi."},{"id":2291,"day":153,"indexInDay":11,"word":"Formidable","phonetic":"/fɔːˈmɪd.ə.bəl/","pos":"adj","az":"Qüdrətli / Heyranlıq doğuran gücə malik","definition":"Inspiring respect through being powerfully capable","example":"You now wield a formidable active English vocabulary.","exampleAz":"Siz artıq qüdrətli fəal ingilis dili lüğətinə sahibsiniz."},{"id":2292,"day":153,"indexInDay":12,"word":"Unrivaled","phonetic":"/ʌnˈraɪ.vəld/","pos":"adj","az":"Rəqibsiz / Bənzərsiz","definition":"Better than everyone or everything of the same type","example":"The carpet museum’s collection is historically unrivaled.","exampleAz":"Xalça muzeyinin kolleksiyası tarixi baxımdan rəqibsizdir."},{"id":2293,"day":153,"indexInDay":13,"word":"Profound","phonetic":"/prəˈfaʊnd/","pos":"adj","az":"Dərin / Dərin mənalı","definition":"Very great or intense; having deep insight","example":"His lecture imparted profound philosophical insights.","exampleAz":"Onun mühazirəsi dərin fəlsəfi fikirlər aşıladı."},{"id":2294,"day":153,"indexInDay":14,"word":"Auspicious","phonetic":"/ɔːˈspɪʃ.əs/","pos":"adj","az":"Uğurlu / Xeyirli / Fərəhli","definition":"Conducive to success; favorable","example":"Day 153 marks an auspicious step toward the finish line.","exampleAz":"153-cü gün finiş xəttinə doğru çox uğurlu və fərəhli bir addımdır."},{"id":2295,"day":153,"indexInDay":15,"word":"Triumphant","phonetic":"/traɪˈʌm.fənt/","pos":"adj","az":"Zəfər dolu / Qalibanə","definition":"Having won a battle or contest; victorious","example":"A triumphant smile celebrated mastering 2,400 words.","exampleAz":"Qalibanə bir təbəssüm 2400 sözün fəthini qeyd etdi."}]},{"day":154,"level":"C1","theme":"Nuanced Critique & Condemnation","themeAz":"Zərif Tənqid və Məzəmmət Sözləri","wordCount":15,"words":[{"id":2296,"day":154,"indexInDay":1,"word":"Superficial","phonetic":"/ˌsuː.pəˈfɪʃ.əl/","pos":"adj","az":"Dayaz / Səthi","definition":"Existing or occurring at or on the surface; not thorough","example":"Avoid superficial memorization; internalize real examples.","exampleAz":"Səthi əzbərçilikdən çəkinin; real nümunələri daxilən mənimsəyin."},{"id":2297,"day":154,"indexInDay":2,"word":"Pedantic","phonetic":"/pəˈdæn.tɪk/","pos":"adj","az":"Xırdaçı / Lüzumsuz dəqiqlik tələb edən","definition":"Excessively concerned with minor details and rules","example":"Do not let pedantic grammar obsessiveness freeze your speech.","exampleAz":"Xırdaçı qrammatika tələblərinin danışığınızı kilidləməsinə imkan verməyin."},{"id":2298,"day":154,"indexInDay":3,"word":"Spurious","phonetic":"/ˈspjʊə.ri.əs/","pos":"adj","az":"Saxta / Əsassız","definition":"Not being what it purports to be; false or fake","example":"The defense dismantled the plaintiff’s spurious claims.","exampleAz":"Müdafiə tərəfi iddiaçının saxta və əsassız iddialarını darmadağın etdi."},{"id":2299,"day":154,"indexInDay":4,"word":"Specious","phonetic":"/ˈspiː.ʃəs/","pos":"adj","az":"Zahirən doğru görünən, amma yalan","definition":"Superficially plausible, but actually wrong","example":"Beware of specious arguments that disguise poor logic.","exampleAz":"Zəif məntiqi gizlədən zahirən doğru görünən yalanlara aldanmayın."},{"id":2300,"day":154,"indexInDay":5,"word":"Disingenuous","phonetic":"/ˌdɪs.ɪnˈdʒen.ju.əs/","pos":"adj","az":"Qeyri-səmimi / Hiyləgər","definition":"Not candid or sincere, typically by pretending to know less","example":"His flattering praise was quietly disingenuous.","exampleAz":"Onun tərifləri əslində qeyri-səmimi və hiyləgər idi."},{"id":2301,"day":154,"indexInDay":6,"word":"Pretentious","phonetic":"/prɪˈten.ʃəs/","pos":"adj","az":"İddialı / Özünü dartan / Süni","definition":"Attempting to impress by affecting greater importance than possessed","example":"Speak naturally; avoid pretentious, convoluted words.","exampleAz":"Təbii danışın; süni və qəliz sözlərlə özünüzü dartmaqdan çəkinin."},{"id":2302,"day":154,"indexInDay":7,"word":"Tenuous","phonetic":"/ˈten.ju.əs/","pos":"adj","az":"Zəif / Əsassız / Tükdən asılı","definition":"Very weak or slight; insubstantial","example":"The historical connection proved exceedingly tenuous.","exampleAz":"Tarixi əlaqənin olduqca zəif və əsassız olduğu üzə çıxdı."},{"id":2303,"day":154,"indexInDay":8,"word":"Redundant","phonetic":"/rɪˈdʌn.dənt/","pos":"adj","az":"Artıq / Lüzumsuz","definition":"Not or no longer needed or useful; superfluous","example":"Edit essays strictly to prune redundant expressions.","exampleAz":"Lüzumsuz ifadələri kənarlaşdırmaq üçün esseni diqqətlə redaktə edin."},{"id":2304,"day":154,"indexInDay":9,"word":"Flawed","phonetic":"/flɔːd/","pos":"adj","az":"Qüsurlu / Xətalı","definition":"Having or characterized by a fundamental defect","example":"The methodology was fundamentally flawed from inception.","exampleAz":"Metodologiya başlanğıcdan etibarən təməldən qüsurlu idi."},{"id":2305,"day":154,"indexInDay":10,"word":"Dubious","phonetic":"/ˈdʒuː.bi.əs/","pos":"adj","az":"Şübhəli / Etibarsız","definition":"Hesitating or doubting; not to be relied upon","example":"Citing dubious blogs undermines academic credibility.","exampleAz":"Şübhəli bloqlara istinad etmək akademik etibarlılığı zədələyir."},{"id":2306,"day":154,"indexInDay":11,"word":"Derisive","phonetic":"/dɪˈraɪ.sɪv/","pos":"adj","az":"İstehzalı / Lağ edən","definition":"Expressing contempt or ridicule","example":"Dismiss derisive remarks with serene silence.","exampleAz":"İstehzalı sözlərə dinc sükutla cavab verin."},{"id":2307,"day":154,"indexInDay":12,"word":"Unwarranted","phonetic":"/ʌnˈwɒr.ən.tɪd/","pos":"adj","az":"Əsassız / Haqsız","definition":"Not justified or authorized","example":"The harsh reprimand was utterly unwarranted.","exampleAz":"Sərt töhmət tamamilə əsassız və haqsız idi."},{"id":2308,"day":154,"indexInDay":13,"word":"Myopic","phonetic":"/maɪˈɒp.ɪk/","pos":"adj","az":"Uzağı görməyən / Qısamüddətli baxan","definition":"Short-sighted; lacking intellectual imagination or foresight","example":"Cutting education budgets is a disastrously myopic policy.","exampleAz":"Təhsil büdcəsini azaltmaq fəlakətli dərəcədə uzağı görməyən bir siyasətdir."},{"id":2309,"day":154,"indexInDay":14,"word":"Banal","phonetic":"/bəˈnɑːl/","pos":"adj","az":"Bəsit / Maraqsız / Adi","definition":"So lacking in originality as to be obvious and boring","example":"Replace banal phrases with vivid, memorable collocations.","exampleAz":"Bəsit ifadələri canlı və yadda qalan sabit birləşmələrlə əvəzləyin."},{"id":2310,"day":154,"indexInDay":15,"word":"Dogmatic","phonetic":"/dɒɡˈmæt.ɪk/","pos":"adj","az":"Doqmatik / Tənqid qəbul etməyən","definition":"Inclined to lay down principles as undeniably true","example":"Critical scholars avoid dogmatic and inflexible positions.","exampleAz":"Tənqidi düşünən alimlər doqmatik və sərt mövqelərdən qaçırlar."}]},{"day":155,"level":"C1","theme":"Ambiguity, Irony & Paradox","themeAz":"Qeyri-müəyyənlik, İroniya və Paradoks","wordCount":15,"words":[{"id":2311,"day":155,"indexInDay":1,"word":"Ambiguity","phonetic":"/ˌæm.bɪˈɡjuː.ə.ti/","pos":"noun","az":"Qeyri-müəyyənlik / İkimənalılıq","definition":"Quality of being open to more than one interpretation","example":"Eliminate syntactic ambiguity to write with sharp clarity.","exampleAz":"Aydın yazmaq üçün cümlələrdəki ikimənalılığı aradan qaldırın."},{"id":2312,"day":155,"indexInDay":2,"word":"Equivocation","phonetic":"/ɪˌkwɪv.əˈkeɪ.ʃən/","pos":"noun","az":"İkibaşlı danışma / Söz oyunu","definition":"Use of ambiguous language to conceal the truth","example":"The politician used equivocation to dodge uncomfortable queries.","exampleAz":"Siyasətçi narahat suallardan yayınmaq üçün ikibaşlı danışığa əl atdı."},{"id":2313,"day":155,"indexInDay":3,"word":"Irony","phonetic":"/ˈaɪ.rə.ni/","pos":"noun","az":"İroniya / Taleyin kinayəsi","definition":"Expression of meaning by language signifying opposite; state of contrary outcome","example":"The supreme irony is that mistakes are what teach correctness.","exampleAz":"Ən böyük ironiya ondadır ki, insanı düzgünlüyə öyrədən məhz səhvlərdir."},{"id":2314,"day":155,"indexInDay":4,"word":"Paradox","phonetic":"/ˈpær.ə.dɒks/","pos":"noun","az":"Paradoks","definition":"Seemingly contradictory proposition that proves well founded","example":"The paradox of courage is that it requires acknowledging fear.","exampleAz":"Cəsarətin paradoksu ondadır ki, o, qorxunu etiraf etməyi tələb edir."},{"id":2315,"day":155,"indexInDay":5,"word":"Satire","phonetic":"/ˈsæt.aɪər/","pos":"noun","az":"Satira / Həcv","definition":"Use of humor, irony, exaggeration, or ridicule to expose stupidity","example":"Molla Nasreddin anecdotes are immortal jewels of social satire.","exampleAz":"Molla Nəsrəddin lətifələri ictimai satiranın ölməz inciləridir."},{"id":2316,"day":155,"indexInDay":6,"word":"Sarcasm","phonetic":"/ˈsɑː.kæz.əm/","pos":"noun","az":"Sarkazm / Acı istehza","definition":"Use of irony to mock or convey contempt","example":"Avoid hurtful sarcasm in collaborative learning settings.","exampleAz":"Birgə təhsil mühitində qəlb qırıcı acı istehzadan çəkinin."},{"id":2317,"day":155,"indexInDay":7,"word":"Contradiction","phonetic":"/ˌkɒn.trəˈdɪk.ʃən/","pos":"noun","az":"Ziddiyyət","definition":"Combination of statements or ideas opposed to one another","example":"Resolve internal contradictions through rigorous logical analysis.","exampleAz":"Daxili ziddiyyətləri dəqiq məntiqi təhlillə həll edin."},{"id":2318,"day":155,"indexInDay":8,"word":"Nuance","phonetic":"/ˈnjuː.ɑːns/","pos":"noun","az":"Zərif çalar","definition":"Subtle difference in meaning, opinion, or attitude","example":"Humor hinges on the nuance of timing and pitch.","exampleAz":"Yumor zamanlama və səs tonunun zərif çalarına söykənir."},{"id":2319,"day":155,"indexInDay":9,"word":"Subtlety","phonetic":"/ˈsʌt.əl.ti/","pos":"noun","az":"İncəlik / Həssaslıq","definition":"State or quality of being subtle; delicate complexity","example":"The subtlety of Persian classical poetry rewards patient readers.","exampleAz":"Klassik poeziyanın incəliyi səbirli oxucunu zənginləşdirir."},{"id":2320,"day":155,"indexInDay":10,"word":"Enigma","phonetic":"/ɪˈnɪɡ.mə/","pos":"noun","az":"Sirr / Müəmma","definition":"Person or thing that is mysterious or difficult to understand","example":"The origin of Gobustan’s early petroglyphs remains a majestic enigma.","exampleAz":"Qobustanın ilk qaya rəsmlərinin mənşəyi əzəmətli bir sirr olaraq qalır."},{"id":2321,"day":155,"indexInDay":11,"word":"Incongruity","phonetic":"/ˌɪn.kɒŋˈɡruː.ə.ti/","pos":"noun","az":"Uyğunsuzluq / Yersizlik","definition":"State of being out of place or incompatible","example":"Comedy arises from the unexpected incongruity of situations.","exampleAz":"Komediya vəziyyətlərin gözlənilməz uyğunsuzluğundan doğur."},{"id":2322,"day":155,"indexInDay":12,"word":"Understatement","phonetic":"/ˈʌn.dəˌsteɪt.mənt/","pos":"noun","az":"Litota / Sözü kiçiltmə","definition":"Presentation of something as being smaller or less good than it is","example":"To call 2,400 words a \"few terms\" is an immense understatement.","exampleAz":"2400 sözə \"bir neçə söz\" demək nəhəng bir litotadır."},{"id":2323,"day":155,"indexInDay":13,"word":"Allusion","phonetic":"/əˈluː.ʒən/","pos":"noun","az":"İşarə / Allüziya","definition":"Implied or indirect reference, especially in literature","example":"Notice the philosophical allusion to ancient epics.","exampleAz":"Qədim dastanlara olan fəlsəfi işarəyə diqqət yetirin."},{"id":2324,"day":155,"indexInDay":14,"word":"Parody","phonetic":"/ˈpær.ə.di/","pos":"noun","az":"Parodiya / Təqlid","definition":"Imitation of style of a particular writer with deliberate exaggeration","example":"The literary review published a clever parody of academic jargon.","exampleAz":"Ədəbi jurnal akademik jarqonun ağıllı bir parodiyasını dərc etdi."},{"id":2325,"day":155,"indexInDay":15,"word":"Cryptic","phonetic":"/ˈkrɪp.tɪk/","pos":"adj","az":"Müəmmalı / Gizli mənalı","definition":"Having a meaning that is mysterious or obscure","example":"The ancient inscription carried a cryptic philosophical maxim.","exampleAz":"Qədim kitabə müəmmalı bir fəlsəfi kəlam daşıyırdı."}]},{"day":156,"level":"C1","theme":"Strategic Leadership & Visionary Language","themeAz":"Uzaqgörən Liderlik və Vizyon Dili","wordCount":15,"words":[{"id":2326,"day":156,"indexInDay":1,"word":"Visionary","phonetic":"/ˈvɪʒ.ən.ri/","pos":"adj","az":"Uzaqgörən / Müdrik","definition":"Thinking about or planning the future with wisdom","example":"A visionary leader inspires people to perceive unseen horizons.","exampleAz":"Uzaqgörən lider insanları görünməz üfüqləri dərk etməyə ruhlandırır."},{"id":2327,"day":156,"indexInDay":2,"word":"Empower","phonetic":"/ɪmˈpaʊ.ər/","pos":"verb","az":"Səlahiyyətləndirmək / Güc vermək","definition":"Give someone the authority, power, or confidence to do something","example":"True educators empower students to think independently.","exampleAz":"Əsl müəllimlər tələbələrə müstəqil düşünmək gücü verirlər."},{"id":2328,"day":156,"indexInDay":3,"word":"Stewardship","phonetic":"/ˈstjuː.əd.ʃɪp/","pos":"noun","az":"Qayğıkeş idarəçilik / Məsuliyyət","definition":"Job of supervising or taking care of something","example":"Exercise noble stewardship over your intellect and skills.","exampleAz":"Zəkanız və bacarıqlarınız üzərində alicənab qayğı və məsuliyyət daşıyın."},{"id":2329,"day":156,"indexInDay":4,"word":"Integrity","phonetic":"/ɪnˈteɡ.rə.ti/","pos":"noun","az":"Dürüstlük / Vicdan","definition":"Quality of being honest and having strong moral principles","example":"Integrity is the bedrock of enduring leadership.","exampleAz":"Dürüstlük daimi liderliyin ən möhkəm təməl daşıdır."},{"id":2330,"day":156, ]},{"day":160,"level":"C1","theme":"The Grand Finale: Fluency & Lifelong Mastery","themeAz":"Böyük Yekun: Sərbəst Danışıq və Zirvə","wordCount":15,"words":[{"id":2386,"day":160,"indexInDay":1,"word":"Summit","phonetic":"/ˈsʌm.ɪt/","pos":"noun","az":"Zirvə / Ən uca nöqtə","definition":"Highest point of a mountain or highest attainment","example":"Congratulations! You have stood atop the 160-day summit!","exampleAz":"Təbriklər! Siz 160 günlük təhsil zirvəsinin ən uca nöqtəsindəsiniz!"},{"id":2387,"day":160,"indexInDay":2,"word":"Fluency","phonetic":"/ˈfluː.ən.si/","pos":"noun","az":"Sərbəstlik / Rəvanlıq","definition":"Ability to speak or write a foreign language easily and accurately","example":"You possess complete, authentic conversational English fluency.","exampleAz":"Siz artıq tam və orijinal danışıq ingiliscəsi sərbəstliyinə maliksiz."},{"id":2388,"day":160,"indexInDay":3,"word":"Triumph","phonetic":"/ˈtraɪ.əmf/","pos":"noun","az":"Böyük Zəfər","definition":"Great victory, achievement, or success","example":"Completing all 2,400 words is an extraordinary personal triumph.","exampleAz":"Bütün 2400 sözü tamamlamaq fövqəladə şəxsi zəfərdir."},{"id":2389,"day":160,"indexInDay":4,"word":"Monumental","phonetic":"/ˌmɒn.jəˈmen.təl/","pos":"adj","az":"Əzəmətli / Nəhəng","definition":"Great in importance, extent, or size","example":"Your dedication is a monumental testament to disciplined willpower.","exampleAz":"Sizin əzmkarlığınız intizamlı iradə gücünün əzəmətli sübutudur."},{"id":2390,"day":160,"indexInDay":5,"word":"Milestone","phonetic":"/ˈmaɪl.stəʊn/","pos":"noun","az":"Tarixi mərhələ","definition":"Significant turning point of lifetime achievement","example":"Day 160 is a historic milestone you will cherish forever.","exampleAz":"160-cı gün ömür boyu fəxrlə xatırlayacağınız tarixi bir mərhələdir."},{"id":2391,"day":160,"indexInDay":6,"word":"Perseverance","phonetic":"/ˌpɜː.sɪˈvɪə.rəns/","pos":"noun","az":"Əzmkarlıq / Dözüm","definition":"Persistence in doing some n":"Lasting through the whole of one’s life","example":"Language mastery is a joyful lifelong adventure.","exampleAz":"Dil ustalığı sevincli və ömürlük bir macəradır."},{"id":2398,"day":160,"indexInDay":13,"word":"Sovereignty","phonetic":"/ˈsɒv.rɪn.ti/","pos":"noun","az":"Müstəqillik / Suveren güc","definition":"Supreme power over one’s intellectual expression","example":"You have attained sovereign command over the English lexicon.","exampleAz":"Siz ingilis dili lüğətinə tam suveren şəkildə hökm edirsiniz."},{"id":2399,"day":160,"indexInDay":14,"word":"Excellence","phonetic":"/ˈek.səl.əns/","pos":"noun","az":"Mükəmməllik / Üstünlük","definition":"Quality of being outstanding; continuous habit of greatness","example":"Excellence is not an endpoint; it is your permanent standard.","exampleAz":"Mükəmməllik son nöqtə deyil; o, sizin daimi həyat standartınızdır."},{"id":2400,"day":160,"indexInDay":15,"word":"Victory","phonetic":"/ˈvɪk.tər.i/","pos":"noun","az":"Böyük Qələbə","definition":"Success in a struggle, contest, or journey","example":"We celebrate your glorious Victory: 160 Days, 2,400 Words!","exampleAz":"Sizin möhtəşəm Qələbənizi qeyd edirik: 160 Gün, 2400 Söz!"}]}];

  // State Management
  const STORAGE_KEY = 'english_160_iphone_offline_v1';
  let appState = {
    currentDay: 1,
    activeTab: 'learn',
    isDark: true,
    learnedWordIds: [],
    completedDays: [],
    bookmarkedWordIds: [],
    streak: 1,
    lastActiveDate: new Date().toISOString().slice(0, 10),
    quizScores: {}
  };

  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      appState = { ...appState, ...parsed };
    }
  } catch(e) {}

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
    } catch(e) {}
  }

  // Audio System
  let isAutoplaying = false;
  let autoplayTimer = null;

  function speak(text, onEnd) {
    if (!('speechSynthesis' in window)) {
      if (onEnd) onEnd();
      return;
    }
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.9;
      u.onend = () => { if (onEnd) onEnd(); };
      u.onerror = () => { if (onEnd) onEnd(); };
      window.speechSynthesis.speak(u);
    } catch(e) {
      if (onEnd) onEnd();
    }
  }

  function playChime() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [523.25, 659.25, 783.99, 1046.5];
      const now = ctx.currentTime;
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(freq, now + i * 0.08);
        gain.gain.setValueAtTime(0.001, now + i * 0.08);
        gain.gain.linearRampToValueAtTime(0.18, now + i * 0.08 + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.08 + 0.5);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + i * 0.08);
        osc.stop(now + i * 0.08 + 0.55);
      });
    } catch(e) {}
  }

  // Theme toggle
  function toggleTheme() {
    appState.isDark = !appState.isDark;
    document.documentElement.setAttribute('data-theme', appState.isDark ? 'dark' : 'light');
    saveState();
  }

  // Day navigation
  function setDay(day) {
    if (day < 1) day = 1;
    if (day > 160) day = 160;
    appState.currentDay = day;
    stopAutoplay();
    renderHeader();
    renderContent();
    saveState();
  }
  function prevDay() { setDay(appState.currentDay - 1); }
  function nextDay() { setDay(appState.currentDay + 1); }

  // Autoplay sequencer
  function toggleAutoplay() {
    if (isAutoplaying) {
      stopAutoplay();
    } else {
      startAutoplay();
    }
  }

  function stopAutoplay() {
    isAutoplaying = false;
    if (autoplayTimer) clearTimeout(autoplayTimer);
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    document.getElementById('autoplay-text').innerText = 'Hamısı Dinlə';
    document.getElementById('autoplay-btn').classList.remove('active');
    document.getElementById('dynamic-island').classList.remove('playing');
    document.getElementById('island-text').innerText = '160 Günlük';
  }

  function startAutoplay() {
    isAutoplaying = true;
    document.getElementById('autoplay-text').innerText = 'Dayandır';
    document.getElementById('autoplay-btn').classList.add('active');
    document.getElementById('dynamic-island').classList.add('playing');

    const dayData = window.VOCABULARY_DATA.find(d => d.day === appState.currentDay) || window.VOCABULARY_DATA[0];
    let idx = 0;

    function nextWord() {
      if (!isAutoplaying) return;
      if (idx >= dayData.words.length) {
        stopAutoplay();
        playChime();
        return;
      }
      const item = dayData.words[idx];
      document.getElementById('island-text').innerText = item.word;
      speak(item.word, () => {
        autoplayTimer = setTimeout(() => {
          idx++;
          nextWord();
        }, 750);
      });
    }
    nextWord();
  }

  // Learned toggle
  function toggleLearned(wordId) {
    if (appState.learnedWordIds.includes(wordId)) {
      appState.learnedWordIds = appState.learnedWordIds.filter(id => id !== wordId);
    } else {
      appState.learnedWordIds.push(wordId);
    }
    saveState();
    renderHeader();
    renderContent();
  }

  function toggleAllDayLearned(day) {
    const dayData = window.VOCABULARY_DATA.find(d => d.day === day);
    if (!dayData) return;
    const ids = dayData.words.map(w => w.id);
    const allDone = ids.every(id => appState.learnedWordIds.includes(id));
    if (allDone) {
      appState.learnedWordIds = appState.learnedWordIds.filter(id => !ids.includes(id));
    } else {
      ids.forEach(id => {
        if (!appState.learnedWordIds.includes(id)) appState.learnedWordIds.push(id);
      });
      playChime();
    }
    saveState();
    renderHeader();
    renderContent();
  }

  // Bookmark toggle
  function toggleBookmark(wordId) {
    if (appState.bookmarkedWordIds.includes(wordId)) {
      appState.bookmarkedWordIds = appState.bookmarkedWordIds.filter(id => id !== wordId);
    } else {
      appState.bookmarkedWordIds.push(wordId);
    }
    saveState();
    renderHeader();
    renderContent();
  }

  // Header update
  function renderHeader() {
    const dayData = window.VOCABULARY_DATA.find(d => d.day === appState.currentDay) || window.VOCABULARY_DATA[0];
    document.getElementById('header-day-label').innerText = 'Gün ' + dayData.day;
    document.getElementById('header-level-badge').innerText = dayData.level;
    document.getElementById('streak-counter').innerText = appState.streak + ' gün';

    const savedCount = appState.bookmarkedWordIds.length;
    const badge = document.getElementById('saved-badge');
    if (savedCount > 0) {
      badge.style.display = 'block';
      badge.innerText = savedCount;
    } else {
      badge.style.display = 'none';
    }
  }

  // Switch tab
  function switchTab(tab) {
    appState.activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    stopAutoplay();
    renderContent();
  }

  // Render Views
  function renderContent() {
    const container = document.getElementById('content-area');
    const dayData = window.VOCABULARY_DATA.find(d => d.day === appState.currentDay) || window.VOCABULARY_DATA[0];

    if (appState.activeTab === 'learn') {
      const dayWordIds = dayData.words.map(w => w.id);
      const learnedCount = dayWordIds.filter(id => appState.learnedWordIds.includes(id)).length;
      const isAllDone = learnedCount === dayData.words.length;
      const pct = Math.round((learnedCount / dayData.words.length) * 100);

      let html = `
        <div class="day-banner">
          <div class="day-banner-header">
            <div>
              <span class="level-badge">${dayData.level} Səviyyəsi</span>
              <h1 class="day-title">${dayData.themeAz}</h1>
              <div class="day-subtitle">${dayData.theme}</div>
            </div>
            <button onclick="toggleAllDayLearned(${dayData.day})" style="padding: 6px 12px; border-radius: 12px; font-size: 11px; font-weight: 700; cursor: pointer; border: 1px solid var(--card-border); background: ${isAllDone ? '#10b981' : 'var(--card-subtle)'}; color: ${isAllDone ? '#fff' : 'var(--text)'};">
              ${isAllDone ? '✓ Hamısı Bildim' : 'Hamısını İşarələ'}
            </button>
          </div>
          <div class="progress-bar-container">
            <div class="progress-info">
              <span>Günün Tərəqqisi</span>
              <span>${learnedCount} / ${dayData.words.length} (${pct}%)</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width: ${pct}%;"></div>
            </div>
          </div>
        </div>
      `;

      dayData.words.forEach((item, idx) => {
        const isLearned = appState.learnedWordIds.includes(item.id);
        const isSaved = appState.bookmarkedWordIds.includes(item.id);

        html += `
          <div class="word-card ${isLearned ? 'learned' : ''}">
            <div class="word-card-top">
              <div>
                <span style="font-size: 11px; font-family: monospace; color: var(--text-muted);">#${idx + 1}</span>
                <span class="word-title">${item.word}</span>
                <span class="word-phonetic">${item.phonetic}</span>
                <span class="word-pos">${item.pos}</span>
                <div class="word-az">${item.az}</div>
              </div>
              <div class="word-actions">
                <button class="small-icon-btn" onclick="speak('${item.word.replace(/'/g, "\\'")}')" title="Tələffüz">🔊</button>
                <button class="small-icon-btn ${isSaved ? 'active-bookmark' : ''}" onclick="toggleBookmark(${item.id})" title="Yadda saxla">★</button>
                <button class="small-icon-btn ${isLearned ? 'active-learned' : ''}" onclick="toggleLearned(${item.id})" title="Öyrəndim">✓</button>
              </div>
            </div>
            <div class="word-def">${item.definition}</div>
            <div class="word-example-box">
              <div class="example-en">
                <span>"${item.example}"</span>
                <button onclick="speak('${item.example.replace(/'/g, "\\'")}')" style="background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 2px;">🔊</button>
              </div>
              <div class="example-az">${item.exampleAz}</div>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }
    else if (appState.activeTab === 'plan') {
      let html = `
        <div class="day-banner">
          <h2 style="font-size: 16px; font-weight: 800; color: var(--text);">160 Günlük Tədris Planı</h2>
          <p style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">A1-dən C1-ə qədər bütün 2400 söz</p>
        </div>
        <div style="display: grid; gap: 8px;">
      `;

      window.VOCABULARY_DATA.forEach(d => {
        const ids = d.words.map(w => w.id);
        const doneCount = ids.filter(id => appState.learnedWordIds.includes(id)).length;
        const isCurrent = d.day === appState.currentDay;
        const isDone = doneCount === d.words.length;

        html += `
          <div onclick="setDay(${d.day}); switchTab('learn');" style="background: var(--card); border: 1px solid ${isCurrent ? 'var(--primary)' : 'var(--card-border)'}; border-radius: 16px; padding: 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer;">
            <div style="display: flex; align-items: center; gap: 10px;">
              <div style="width: 36px; height: 36px; border-radius: 10px; background: ${isDone ? 'rgba(16,185,129,0.2)' : 'var(--card-subtle)'}; color: ${isDone ? '#10b981' : 'var(--text)'}; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: 12px;">
                <span style="font-size: 8px; font-weight: 600;">GÜN</span>

              </div>
              <div>
                <div style="font-size: 13px; font-weight: 700; color: var(--text);">${d.themeAz}</div>

              </div>
            </div>
            <div style="font-size: 11px; font-weight: 700; color: ${isDone ? '#10b981' : 'var(--text-muted)'};">
              ${isDone ? '✓ 15/15' : doneCount + ' / 15'}
            </div>
          </div>
        `;
      });
      html += '</div>';
      container.innerHTML = html;
    }
    else if (appState.activeTab === 'search') {
      container.innerHTML = `
        <div class="day-banner">
          <h2 style="font-size: 16px; font-weight: 800;">2400 Söz Axtarışı</h2>
          <input type="text" id="search-input" placeholder="İngiliscə və ya azərbaycanca axtarın..." oninput="filterSearch(this.value)" style="width: 100%; margin-top: 10px; padding: 10px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--card-border); color: var(--text); font-size: 13px; outline: none;">
        </div>
        <div id="search-results"></div>
      `;
      filterSearch('');
    }
    else if (appState.activeTab === 'saved') {
      const allWords = window.VOCABULARY_DATA.flatMap(d => d.words);
      const savedList = allWords.filter(w => appState.bookmarkedWordIds.includes(w.id));

      let html = `
        <div class="day-banner">
          <h2 style="font-size: 16px; font-weight: 800; color: #f59e0b;">★ Yadda Saxlanılan Sözlər</h2>
          <p style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">${savedList.length} söz saxlanılıb</p>
        </div>
      `;

      if (savedList.length === 0) {
        html += '<p style="text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 13px;">Hələ heç bir söz saxlanılmayıb. Kartların yanındakı ulduza toxunaraq əlavə edə bilərsiniz.</p>';
      } else {
        savedList.forEach(item => {
          html += `
            <div class="word-card">
              <div class="word-card-top">
                <div>
                  <span class="word-title">${item.word}</span>
                  <span class="word-phonetic">${item.phonetic}</span>
                  <div class="word-az">${item.az}</div>
                </div>
                <div class="word-actions">
                  <button class="small-icon-btn" onclick="speak('${item.word.replace(/'/g, "\\'")}')">🔊</button>
                  <button class="small-icon-btn active-bookmark" onclick="toggleBookmark(${item.id})">★</button>
                </div>
              </div>
              <div class="word-def">${item.definition}</div>
              <div class="example-az" style="margin-top: 4px;">Gün ${item.day} dərsi</div>
            </div>
          `;
        });
      }
      container.innerHTML = html;
    }
    else if (appState.activeTab === 'stats') {
      const totalWords = 2400;
      const totalLearned = appState.learnedWordIds.length;
      const pct = Math.round((totalLearned / totalWords) * 100);

      container.innerHTML = `
        <div class="day-banner" style="text-align: center;">
          <div style="font-size: 32px; font-weight: 800; color: #818cf8;">${totalLearned} / ${totalWords}</div>
          <p style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">Bütün kurs üzrə ${pct}% öyrənilmiş sözlər</p>
          <div class="progress-bar" style="margin-top: 12px; height: 10px;">
            <div class="progress-fill" style="width: ${pct}%;"></div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;">
          <div style="background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 14px; text-align: center;">
            <div style="font-size: 24px;">🔥</div>
            <div style="font-size: 18px; font-weight: 800; margin-top: 4px;">${appState.streak} gün</div>
            <div style="font-size: 11px; color: var(--text-muted);">Davamiyyət zənciri</div>
          </div>
          <div style="background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 14px; text-align: center;">
            <div style="font-size: 24px;">★</div>
            <div style="font-size: 18px; font-weight: 800; margin-top: 4px;">${appState.bookmarkedWordIds.length} söz</div>
            <div style="font-size: 11px; color: var(--text-muted);">Yadda saxlanılan</div>
          </div>
        </div>

        <div style="background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; margin-bottom: 16px;">
          <h3 style="font-size: 13px; font-weight: 800; margin-bottom: 10px;">Fayl Kimi Yükləmə</h3>
          <button onclick="downloadThisSelfContainedFile()" style="width: 100%; padding: 12px; border-radius: 12px; background: #6366f1; border: none; color: #fff; font-weight: 700; font-size: 13px; cursor: pointer;">
            📥 Bu Tək Faylı Endir (.html)
          </button>
        </div>
      `;
    }
  }

  // Live search
  function filterSearch(query) {
    const resultsContainer = document.getElementById('search-results');
    if (!resultsContainer) return;
    const allWords = window.VOCABULARY_DATA.flatMap(d => d.words);
    const q = query.trim().toLowerCase();

    const filtered = allWords.filter(w =>
      !q || w.word.toLowerCase().includes(q) || w.az.toLowerCase().includes(q) || w.definition.toLowerCase().includes(q)
    ).slice(0, 50);

    let html = '';
    filtered.forEach(item => {
      const isSaved = appState.bookmarkedWordIds.includes(item.id);
      html += `
        <div class="word-card" style="padding: 10px;">
          <div class="word-card-top">
            <div>
              <span class="word-title" style="font-size: 16px;">${item.word}</span>
              <span class="word-phonetic">${item.phonetic}</span>
              <div class="word-az">${item.az}</div>
            </div>
            <div class="word-actions">
              <button class="small-icon-btn" onclick="speak('${item.word.replace(/'/g, "\\'")}')">🔊</button>
              <button class="small-icon-btn ${isSaved ? 'active-bookmark' : ''}" onclick="toggleBookmark(${item.id})">★</button>
            </div>
          </div>
        </div>
      `;
    });
    resultsContainer.innerHTML = html || '<p style="text-align: center; color: var(--text-muted); padding: 20px;">Nəticə tapılmadı.</p>';
  }

  // Flashcards state
  let fcDeck = [];
  let fcIndex = 0;
  let fcIsFlipped = false;

  function openFlashcards() {
    const dayData = window.VOCABULARY_DATA.find(d => d.day === appState.currentDay) || window.VOCABULARY_DATA[0];
    fcDeck = [...dayData.words];
    fcIndex = 0;
    fcIsFlipped = false;
    document.getElementById('flashcard-modal').classList.add('open');
    renderCurrentFlashcard();
  }

  function renderCurrentFlashcard() {
    if (!fcDeck[fcIndex]) return;
    const item = fcDeck[fcIndex];
    document.getElementById('fc-progress-text').innerText = 'Kart ' + (fcIndex + 1) + ' / ' + fcDeck.length;
    document.getElementById('fc-pos').innerText = item.pos;
    document.getElementById('fc-word').innerText = item.word;
    document.getElementById('fc-phonetic').innerText = item.phonetic;
    document.getElementById('fc-az').innerText = item.az;
    document.getElementById('fc-def').innerText = item.definition;
    document.getElementById('fc-ex').innerText = '"' + item.example + '"';
    
    fcIsFlipped = false;
    document.getElementById('fc-card').classList.remove('flipped');
  }

  function flipFlashcard() {
    fcIsFlipped = !fcIsFlipped;
    document.getElementById('fc-card').classList.toggle('flipped', fcIsFlipped);
  }

  function nextFlashcard() {
    fcIndex = (fcIndex + 1) % fcDeck.length;
    renderCurrentFlashcard();
  }

  function prevFlashcard() {
    fcIndex = (fcIndex - 1 + fcDeck.length) % fcDeck.length;
    renderCurrentFlashcard();
  }

  function markFlashcardKnown() {
    const item = fcDeck[fcIndex];
    if (item && !appState.learnedWordIds.includes(item.id)) {
      appState.learnedWordIds.push(item.id);
      saveState();
      playChime();
    }
    nextFlashcard();
  }

  function shuffleFlashcards() {
    fcDeck.sort(() => Math.random() - 0.5);
    fcIndex = 0;
    renderCurrentFlashcard();
  }

  // Quiz state
  let quizQuestions = [];
  let quizIndex = 0;
  let quizScore = 0;

  function openQuiz() {
    const dayData = window.VOCABULARY_DATA.find(d => d.day === appState.currentDay) || window.VOCABULARY_DATA[0];
    const words = [...dayData.words].sort(() => Math.random() - 0.5).slice(0, 10);
    const allWords = window.VOCABULARY_DATA.flatMap(d => d.words);

    quizQuestions = words.map(item => {
      const correct = item.az;
      const distractors = allWords
        .filter(w => w.id !== item.id && w.az !== correct)
        .sort(() => Math.random() - 0.5)
        .slice(0, 3)
        .map(w => w.az);
      const options = [correct, ...distractors].sort(() => Math.random() - 0.5);
      return { item, prompt: item.word, correct, options };
    });

    quizIndex = 0;
    quizScore = 0;
    document.getElementById('quiz-modal').classList.add('open');
    renderQuizQuestion();
  }

  function renderQuizQuestion() {
    const container = document.getElementById('quiz-body');
    if (quizIndex >= quizQuestions.length) {
      // Quiz finished
      const pct = Math.round((quizScore / quizQuestions.length) * 100);
      container.innerHTML = `
        <div style="text-align: center; margin: auto 0;">
          <div style="font-size: 48px;">🏆</div>
          <h2 style="font-size: 22px; font-weight: 800; margin-top: 10px;">Test Tamamlandı!</h2>
          <div style="font-size: 28px; font-weight: 800; color: #10b981; margin-top: 6px;">${quizScore} / ${quizQuestions.length} (${pct}%)</div>
          <button onclick="closeModals()" style="margin-top: 20px; padding: 12px 24px; border-radius: 14px; background: #6366f1; border: none; color: #fff; font-weight: 700; cursor: pointer;">
            Dərslərə Qayıt
          </button>
        </div>
      `;
      playChime();
      return;
    }

    const q = quizQuestions[quizIndex];
    let html = `
      <div>
        <div style="font-size: 11px; color: var(--text-muted); text-align: center; margin-bottom: 8px;">
          Sual ${quizIndex + 1} / ${quizQuestions.length}
        </div>
        <div style="background: var(--card); border: 1px solid var(--card-border); border-radius: 18px; padding: 20px; text-align: center;">
          <h2 style="font-size: 24px; font-weight: 800;">${q.prompt}</h2>
          <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">${q.item.phonetic}</p>
        </div>
        <div style="display: grid; gap: 8px; margin-top: 14px;">
    `;

    q.options.forEach(opt => {
      html += `
        <button onclick="answerQuiz('${opt.replace(/'/g, "\\'")}', this)" style="padding: 12px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--card-border); color: var(--text); font-size: 13px; font-weight: 600; text-align: left; cursor: pointer;">
          ${opt}
        </button>
      `;
    });

    html += '</div></div>';
    container.innerHTML = html;
  }

  function answerQuiz(selected, btn) {
    const q = quizQuestions[quizIndex];
    const isCorrect = selected === q.correct;
    if (isCorrect) {
      btn.style.background = 'rgba(16, 185, 129, 0.3)';
      btn.style.borderColor = '#10b981';
      quizScore++;
      playChime();
    } else {
      btn.style.background = 'rgba(239, 68, 68, 0.3)';
      btn.style.borderColor = '#ef4444';
    }
    setTimeout(() => {
      quizIndex++;
      renderQuizQuestion();
    }, 900);
  }

  // Day picker
  function openDayPicker() {
    const grid = document.getElementById('day-picker-grid');
    let html = '';
    window.VOCABULARY_DATA.forEach(d => {
      const isCurrent = d.day === appState.currentDay;
      html += `
        <button onclick="setDay(${d.day}); closeModals();" style="padding: 8px 4px; border-radius: 12px; background: ${isCurrent ? '#6366f1' : 'var(--card)'}; border: 1px solid var(--card-border); color: ${isCurrent ? '#fff' : 'var(--text)'}; font-size: 12px; font-weight: 700; cursor: pointer;">
          <div>${d.day}</div>
          <div style="font-size: 9px; opacity: 0.7;">${d.level}</div>
        </button>
      `;
    });
    grid.innerHTML = html;
    document.getElementById('day-picker-modal').classList.add('open');
  }

  function closeModals() {
    document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('open'));
  }

  // DIRECT DOWNLOAD OF THIS STANDALONE HTML FILE
  function downloadThisSelfContainedFile() {
    try {
      const htmlBlob = new Blob(['<!DOCTYPE html>' + document.documentElement.outerHTML], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(htmlBlob);
      const link = document.createElement('a');
      link.href = url;
      link.download = '160_gunluk_ingilis_dili_iphone.html';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch(e) {
      window.location.href = '/160_gunluk_ingilis_dili_iphone.html';
    }
  }

  // Initial render
  renderHeader();
  renderContent();

  // Clock
  setInterval(() => {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('status-clock').innerText = h + ':' + m;
  }, 30000);
</script>
</body>
